<script>
(async function(){
"use strict";
const FACH_ID = "elektrotechnik";
const BASIS_PFADE = ["content/" + FACH_ID + "/", "../../content/" + FACH_ID + "/"];
const app = document.getElementById("app");
let basis = null, fach = null;
for (const b of BASIS_PFADE) {
  try { const r = await fetch(b + "fach.json", {cache:"no-cache"}); if (r.ok) { fach = await r.json(); basis = b; break; } } catch(e) {}
}
if (!fach) { app.innerHTML = '<p class="note">Inhalte konnten nicht geladen werden: content/' + FACH_ID + '/fach.json fehlt.</p>'; return; }
const holen = async p => { try { const r = await fetch(basis + p, {cache:"no-cache"}); return r.ok ? await r.json() : null; } catch(e) { return null; } };
const termine = await holen(fach.termine || "termine.json");
const einheiten = {};
await Promise.all(fach.einheiten.filter(e => e.status !== "geplant").map(async e => { const d = await holen("einheiten/" + e.id + ".json"); if (d) einheiten[e.id] = d; }));

/* ---------- Speicher ---------- */
const KEY = "digital-campus-" + FACH_ID;
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) {}
store.lektionen = store.lektionen || {};
store.labore = store.labore || {};
store.vorb = store.vorb || {};
store.setup = store.setup || {klasse:"H2601", gruppe:"A", bestaetigt:false};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} };

/* ---------- Hilfen ---------- */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tex = (t, display) => {
  try { if (window.katex) return katex.renderToString(t, {output:"mathml", displayMode:!!display, throwOnError:false}); } catch(e) {}
  return '<span class="tex-fallback">' + esc(t) + '</span>';
};
// Text mit $…$-Formeln und **fett**
const md = s => String(s ?? "").split(/(\$[^$]+\$)/g).map(part => {
  if (part.length > 2 && part[0] === "$" && part[part.length-1] === "$") return tex(part.slice(1, -1));
  return esc(part).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
}).join("");
const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const WT = ["So","Mo","Di","Mi","Do","Fr","Sa"], MON = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const tag = iso => { const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d); };
const heute = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const tageBis = iso => Math.round((tag(iso) - heute()) / 864e5);
const lk = (u, l) => u + "/" + l;
const lessonDone = (u, l) => !!(store.lektionen[lk(u,l)] && store.lektionen[lk(u,l)].fertig);
const unitPct = u => { const d = einheiten[u]; if (!d || !d.lektionen.length) return 0; return Math.round(100 * d.lektionen.filter(l => lessonDone(u, l.id)).length / d.lektionen.length); };
const bereichPct = b => { const ids = fach.einheiten.filter(e => e.bereich === b && einheiten[e.id]).map(e => e.id); let n = 0, k = 0; ids.forEach(id => { einheiten[id].lektionen.forEach(l => { n++; if (lessonDone(id, l.id)) k++; }); }); return n ? Math.round(100*k/n) : 0; };

/* ---------- Zustand / Navigation ---------- */
let state = {tab:"uebersicht", view:"list"};
const TABS = ["uebersicht","theorie","labor"];
const fromHash = () => { const h = location.hash.slice(1); if (TABS.includes(h)) state = {tab:h, view:"list"}; };
try { const t = localStorage.getItem(KEY + "-tab"); if (TABS.includes(t)) state.tab = t; } catch(e) {}
fromHash();
window.addEventListener("hashchange", () => { fromHash(); render(); });
document.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => {
  state = {tab:btn.dataset.tab, view:"list"};
  try { localStorage.setItem(KEY + "-tab", state.tab); history.replaceState(null, "", "#" + state.tab); } catch(e) {}
  render(); scrollTo(0,0);
}));

function render(){
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === state.tab));
  if (state.view === "unit") return renderUnit();
  if (state.view === "lesson") return renderLesson();
  if (state.tab === "theorie") return renderListe("theorie");
  if (state.tab === "labor") return renderListe("labor");
  return renderDashboard();
}

/* ---------- Termine aus dem Zeitplan ---------- */
function alleTermine(){
  if (!termine) return [];
  const k = termine.klassen.find(x => x.id === store.setup.klasse) || termine.klassen[0];
  const plan = termine.plan[store.setup.gruppe] || termine.plan.A;
  return plan.map((was, i) => {
    const datum = k.daten[i];
    const istLab = was.startsWith("Lab ");
    const istProbe = was === "Probe-MEP";
    let titel, aufgabe = "", art, unitId = null;
    if (istLab) {
      const nr = +was.split(" ")[1];
      titel = "Labor " + nr; art = "labor";
      const u = fach.einheiten.find(e => e.bereich === "labor" && e.labor === nr); if (u && einheiten[u.id]) unitId = u.id;
      const v = (termine.labor_vorbereitung || {})[was];
      aufgabe = (v ? "Vorbereiten: " + v + ". " : "") + "Zählt 2 % – ganze Zeit anwesend sein.";
    } else if (istProbe) {
      titel = "Probe-MEP"; art = "pruefung"; aufgabe = "Handgeschriebene Zusammenfassung (max. 2 Blätter) und Taschenrechner mitnehmen.";
    } else {
      const nr = +was.split(" ")[1];
      titel = "Theorie Block " + nr; art = "theorie";
      const u = fach.einheiten.find(e => e.bereich === "theorie" && e.block === nr); if (u && einheiten[u.id]) unitId = u.id;
      const ha = termine.hausaufgaben && termine.hausaufgaben["Block " + (nr-1)];
      if (ha) aufgabe = "Bis dann erledigt: Hausaufgaben Block " + (nr-1) + " – " + ha + ".";
    }
    const raum = istLab ? k.raum_labor : k.raum_theorie;
    return {id: k.id + "-" + i, datum, sw: i+1, titel, art, aufgabe, unitId, zeit: k.zeit + " · " + raum, was};
  });
}
function statusText(iso){
  const n = tageBis(iso);
  if (n < 0) return {txt:"vorbei", cls:""};
  if (n === 0) return {txt:"heute", cls:"warn"};
  if (n === 1) return {txt:"morgen", cls:"warn"};
  return {txt:"in " + n + " Tagen", cls: n <= 3 ? "warn" : ""};
}
function terminHtml(t){
  const d = tag(t.datum), st = statusText(t.datum);
  const artTxt = {labor:"Labor", theorie:"Theorie", pruefung:"Prüfung"}[t.art];
  return `<div class="termin">
    <div class="dbox"><b>${d.getDate()}</b><span>${MON[d.getMonth()]}</span></div>
    <div class="tbody">
      <div class="tline"><span class="ttitle">${esc(t.titel)}</span><span class="chip">${artTxt}</span>${st.txt !== "vorbei" ? `<span class="chip ${st.cls}">${st.cls === "warn" ? "Bald · " : ""}${st.txt}</span>` : ""}</div>
      <div class="meta">${WT[d.getDay()]}, ${d.getDate()}. ${MON[d.getMonth()]} · ${esc(t.zeit)} · SW ${t.sw}</div>
      ${t.aufgabe ? `<div class="task">${md(t.aufgabe)}</div>` : ""}
      ${t.unitId ? `<button class="btn text" data-open="${t.unitId}" style="margin-left:-8px">Einheit öffnen ›</button>` : ""}
    </div></div>`;
}

/* ---------- Übersicht ---------- */
function renderDashboard(){
  const T = alleTermine();
  const offen = T.filter(t => tageBis(t.datum) >= 0);
  const vorbei = T.filter(t => tageBis(t.datum) < 0).reverse();
  const naechster = offen[0];
  const k = termine ? (termine.klassen.find(x => x.id === store.setup.klasse) || termine.klassen[0]) : null;
  let h = "";

  // Nächster Termin + Einstellungen
  h += `<div class="sect"><span class="label">Als Nächstes</span></div><div class="card"><div class="next">`;
  if (naechster) {
    const st = statusText(naechster.datum), d = tag(naechster.datum);
    h += `<div class="tline"><span class="chip ${st.cls}">${st.cls === "warn" ? "Bald · " : ""}${st.txt}</span><span class="meta">${WT[d.getDay()]}, ${d.getDate()}. ${MON[d.getMonth()]} · ${esc(naechster.zeit)}</span></div>
      <div class="big">${esc(naechster.titel)}</div>
      ${naechster.aufgabe ? `<div class="task" style="margin:0">${md(naechster.aufgabe)}</div>` : ""}`;
  } else {
    h += `<div class="big">Alle Termine des Semesters sind vorbei</div><div class="meta">Jetzt zählt die Modulendprüfung – Datum im Prüfungsplan HS26.</div>`;
  }
  if (termine) {
    h += `<div class="setup"><label class="meta" for="kl">Klasse</label>
      <select id="kl">${termine.klassen.map(x => `<option value="${x.id}" ${x.id === store.setup.klasse ? "selected" : ""}>${x.id} · ${x.tag.slice(0,2)} ${x.zeit}</option>`).join("")}</select>
      <span class="meta">Gruppe</span><div class="seg">${["A","B"].map(g => `<button data-g="${g}" aria-pressed="${store.setup.gruppe === g}">${g}</button>`).join("")}</div>
      ${!store.setup.bestaetigt ? `<span class="faint">Geschätzt aus deinen Download-Daten – stimmt das?</span><button class="btn text" id="ok">Stimmt</button>` : `<span class="faint">${esc(k.dozent)} · Theorie ${esc(k.raum_theorie)}, Labor ${esc(k.raum_labor)}</span>`}
    </div>`;
  }
  h += `</div></div>`;

  // Kommende Termine
  h += `<div class="sect"><span class="label">Kommende Termine & Abgaben</span><span class="faint">Zeitplan HS26</span></div><div class="card">`;
  h += offen.length ? offen.map(terminHtml).join("") : `<p class="meta" style="margin:0">Keine offenen Termine.</p>`;
  if (termine && termine.pruefung) {
    h += `<div class="termin"><div class="dbox"><b>?</b><span>Jan/Feb</span></div><div class="tbody">
      <div class="tline"><span class="ttitle">${esc(termine.pruefung.titel)}</span><span class="chip">Prüfung</span><span class="chip">Datum offen</span></div>
      <div class="meta">${esc(termine.pruefung.modus)}</div>
      <div class="task">${esc(termine.pruefung.datum_hinweis)}</div></div></div>`;
  }
  h += `</div>`;
  if (vorbei.length) h += `<details style="margin-top:8px"><summary>Vorbei (${vorbei.length})</summary><div class="card">${vorbei.map(terminHtml).join("")}</div></details>`;

  // Semesterleistung + Fortschritt
  const labsDone = [1,2,3,4,5].filter(n => store.labore[n]).length;
  h += `<div class="two" style="margin-top:var(--dc-space-8)">
    <div class="card"><div class="label">Semesterleistung</div>
      <div style="margin-top:8px;font:600 26px/32px var(--dc-font-fach)">${labsDone*2} <span class="meta">von 10 %</span></div>
      <div class="labs">${[1,2,3,4,5].map(n => {
        const tt = alleTermine().find(t => t.was === "Lab " + n);
        const d = tt ? tag(tt.datum) : null;
        return `<button class="lab ${store.labore[n] ? "done" : ""}" data-lab="${n}" aria-pressed="${!!store.labore[n]}" title="Als absolviert markieren"><b>L${n}</b><span>${store.labore[n] ? "✓ absolviert" : d ? d.getDate() + "." + (d.getMonth()+1) + "." : ""}</span></button>`;
      }).join("")}</div>
      <div class="faint" style="margin-top:8px">Antippen, sobald ein Labor absolviert ist. Gespeichert nur in diesem Browser.</div>
    </div>
    <div class="card"><div class="label">Lernfortschritt</div>
      ${["theorie","labor"].map(b => { const p = bereichPct(b); return `<div style="margin-top:14px"><div class="tline" style="justify-content:space-between"><span>${b === "theorie" ? "Theorie" : "Labor"}</span><span class="meta">${p} %</span></div><div class="bar" style="margin-top:6px"><i style="width:${p}%"></i></div></div>`; }).join("")}
      <div class="row"><button class="btn primary" id="weiter">Weiterlernen</button></div>
    </div></div>`;

  // Prüfung
  if (termine && termine.pruefung) {
    const p = termine.pruefung;
    h += `<div class="sect"><span class="label">Modulendprüfung</span></div><div class="card"><dl class="kv" style="margin:0">
      <dt>Modus</dt><dd>${esc(p.modus)}</dd>
      <dt>Erlaubt</dt><dd>${p.hilfsmittel.map(esc).join("<br>")}</dd>
      <dt>Nicht erlaubt</dt><dd>${esc(p.nicht_erlaubt)}</dd>
      <dt>Stoff</dt><dd>${esc(p.inhalt)}</dd>
      <dt>Semesterleistung</dt><dd>${esc(p.semesterleistung)}</dd></dl>
      <p class="src">Quelle: ${esc(termine.quelle)}</p></div>`;
  }
  app.innerHTML = h;

  const kl = document.getElementById("kl");
  if (kl) kl.onchange = () => { store.setup.klasse = kl.value; store.setup.bestaetigt = true; save(); render(); };
  app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { store.setup.gruppe = b.dataset.g; store.setup.bestaetigt = true; save(); render(); });
  const ok = document.getElementById("ok"); if (ok) ok.onclick = () => { store.setup.bestaetigt = true; save(); render(); };
  app.querySelectorAll("[data-lab]").forEach(b => b.onclick = () => { const n = b.dataset.lab; if (store.labore[n]) delete store.labore[n]; else store.labore[n] = true; save(); render(); });
  app.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openUnit(b.dataset.open));
  document.getElementById("weiter").onclick = () => {
    const e = fach.einheiten.find(e => einheiten[e.id] && unitPct(e.id) < 100);
    if (e) openUnit(e.id); else { state = {tab:"theorie", view:"list"}; render(); }
  };
}

/* ---------- Listen ---------- */
function renderListe(bereich){
  const liste = fach.einheiten.filter(e => e.bereich === bereich);
  let h = `<div class="sect"><span class="label">${bereich === "theorie" ? "Theorieblöcke" : "Labore"}</span><span class="faint">${bereichPct(bereich)} % erledigt</span></div><div class="grid">`;
  liste.forEach(e => {
    const d = einheiten[e.id], pct = d ? unitPct(e.id) : 0;
    const nr = bereich === "theorie" ? "B" + e.block : "L" + e.labor;
    const n = d ? d.lektionen.length : 0;
    const min = d ? d.lektionen.reduce((s,l) => s + l.dauer_min, 0) : 0;
    h += `<button class="unit" ${d ? "" : "disabled"} data-unit="${e.id}">
      <span class="badge ${pct === 100 ? "ok" : ""}">${pct === 100 ? "✓" : nr}</span>
      <span class="ubody"><span class="uname">${esc(e.titel)}</span>
      <span class="meta">${d ? `${n} Lektionen · ca. ${min} Min · ${pct} %` : "Unterlagen folgen"}</span>
      ${d ? `<span class="bar"><i style="width:${pct}%"></i></span>` : ""}</span>
      ${d ? '<span class="chev">›</span>' : ""}</button>`;
  });
  h += `</div><p class="note">${bereich === "theorie" ? "Blöcke 7 und 8 kommen dazu, sobald die Folien auf ILIAS sind." : "Labore 4 und 5 kommen dazu, sobald die Anleitungen da sind."}</p>`;
  app.innerHTML = h;
  app.querySelectorAll("[data-unit]:not([disabled])").forEach(b => b.onclick = () => openUnit(b.dataset.unit));
}

function openUnit(id){
  const e = fach.einheiten.find(x => x.id === id);
  state = {tab: e.bereich, view:"unit", unitId:id};
  try { history.replaceState(null, "", "#" + e.bereich); } catch(err) {}
  render(); scrollTo(0,0);
}

/* ---------- Einheit ---------- */
function renderUnit(){
  const u = einheiten[state.unitId], pct = unitPct(u.id);
  const total = u.lektionen.reduce((s,l) => s + l.uebungen.length, 0);
  const nextIdx = Math.max(0, u.lektionen.findIndex(l => !lessonDone(u.id, l.id)));
  const alleFertig = pct === 100;
  let h = `<button class="back" id="back">‹ ${u.bereich === "labor" ? "Labore" : "Theorie"}</button>
    <div class="card" style="margin-top:8px"><div class="label">${u.bereich === "labor" ? "Labor " + u.labor_nr : "SW " + u.woche}</div>
    <h2 style="margin-top:4px">${esc(u.titel.replace(/^(Block \d+|Labor \d+) · /, ""))}</h2>
    <div class="meta" style="margin-top:4px">${esc(u.untertitel)}</div>
    <div class="bar" style="margin-top:16px"><i style="width:${pct}%"></i></div>
    <div class="row"><button class="btn primary" id="start">${alleFertig ? "Nochmals von vorne" : pct ? "Weiter mit Lektion " + (nextIdx+1) : "Lektion 1 starten"}</button>
    <button class="btn" id="mix">Gemischt üben (${total})</button></div>
    <p class="src">Quelle: ${esc(u.quelle)}</p></div>`;
  if (u.vorbereitung && u.vorbereitung.length) {
    h += `<div class="sect"><span class="label">Vorbereitung aufs Labor</span></div><div class="card"><div class="grid" style="gap:4px">` +
      u.vorbereitung.map((v,i) => { const k = u.id + "/" + i, on = !!store.vorb[k];
        return `<button class="opt" data-v="${k}" aria-pressed="${on}" style="background:none;border-color:${on ? "var(--dc-success)" : "var(--dc-line)"}"><span style="color:${on ? "var(--dc-success)" : "var(--dc-text-faint)"}">${on ? "✓" : "○"}</span><span>${md(v)}</span></button>`; }).join("") + `</div></div>`;
  }
  h += `<div class="sect"><span class="label">Lektionen</span><button class="btn text" id="reset">Zurücksetzen</button></div><div class="grid">`;
  u.lektionen.forEach((l,i) => {
    const p = store.lektionen[lk(u.id,l.id)], done = p && p.fertig;
    h += `<button class="unit" data-lesson="${i}">
      <span class="badge ${done ? "ok" : ""}">${done ? "✓" : i+1}</span>
      <span class="ubody"><span class="uname">${esc(l.titel)}</span>
      <span class="meta">${l.dauer_min} Min · ${l.uebungen.length} Übungen${p && p.best != null ? " · Bestwert " + p.best + "/" + l.uebungen.length : ""}</span></span>
      <span class="chev">›</span></button>`;
  });
  h += `</div>`;
  app.innerHTML = h;
  document.getElementById("back").onclick = () => { state = {tab:state.tab, view:"list"}; render(); };
  document.getElementById("start").onclick = () => openLesson(u, alleFertig ? 0 : nextIdx);
  document.getElementById("mix").onclick = () => {
    const qs = shuffle(u.lektionen.flatMap(l => l.uebungen));
    state = Object.assign({}, state, {view:"lesson", mix:true, lesson:{titel:"Gemischt üben", uebungen:qs, inhalt:[], dauer_min:0}, phase:"quiz", qi:0, results:[], order:prepare(qs)});
    render(); scrollTo(0,0);
  };
  app.querySelectorAll("[data-lesson]").forEach(b => b.onclick = () => openLesson(u, +b.dataset.lesson));
  app.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { const k = b.dataset.v; if (store.vorb[k]) delete store.vorb[k]; else store.vorb[k] = true; save(); renderUnit(); });
  let armed = false;
  document.getElementById("reset").onclick = ev => {
    if (!armed) { armed = true; ev.target.textContent = "Wirklich zurücksetzen?"; return; }
    u.lektionen.forEach(l => delete store.lektionen[lk(u.id,l.id)]); save(); render();
  };
}

function prepare(qs){ return qs.map(q => q.typ === "multiple_choice" ? shuffle(q.optionen.map((t,i) => i)) : null); }
function openLesson(u, idx){
  const l = u.lektionen[idx];
  state = Object.assign({}, state, {view:"lesson", mix:false, lessonIdx:idx, lesson:l, phase:"theorie", qi:0, results:[], order:prepare(l.uebungen)});
  render(); scrollTo(0,0);
}

/* ---------- Lektion ---------- */
function renderLesson(){
  const u = einheiten[state.unitId], l = state.lesson;
  let h = `<button class="back" id="back">‹ ${esc(u.titel)}</button>
    <div class="lhead"><div class="meta">${state.mix ? "Alle Lektionen gemischt" : "Lektion " + (state.lessonIdx+1) + " von " + u.lektionen.length + " · " + l.dauer_min + " Min"}</div>
    <h2 style="margin-top:4px">${esc(l.titel)}</h2></div>`;
  if (state.phase === "theorie") {
    h += `<div class="card theory">`;
    l.inhalt.forEach(c => {
      if (c.typ === "text") h += `<p>${md(c.text)}</p>`;
      else if (c.typ === "titel") h += `<h4>${md(c.text)}</h4>`;
      else if (c.typ === "liste") h += "<ul>" + c.punkte.map(p => `<li>${md(p)}</li>`).join("") + "</ul>";
      else if (c.typ === "formel") h += `<div class="formula">${tex(c.tex, true)}</div>`;
      else if (c.typ === "code") h += `<pre><code>${esc(c.code)}</code></pre>`;
    });
    h += `</div><div class="row"><button class="btn primary" id="go">Zu den Übungen (${l.uebungen.length})</button></div>`;
    app.innerHTML = h;
    document.getElementById("go").onclick = () => { state.phase = "quiz"; render(); scrollTo(0,0); };
  } else if (state.phase === "quiz") {
    const q = l.uebungen[state.qi];
    h += `<div class="steps">${l.uebungen.map((_,i) => { const r = state.results[i]; return `<i class="${r === true ? "ok" : r === false ? "bad" : i === state.qi ? "cur" : ""}"></i>`; }).join("")}</div>`;
    h += `<div class="card"><div class="faint" style="margin-bottom:6px">Übung ${state.qi+1} von ${l.uebungen.length}${q.typ === "rechnen" ? " · Rechnen" : ""}</div><div class="q">${md(q.frage)}</div>`;
    if (q.typ === "wahr_falsch") h += `<div class="opts tf"><button class="opt" data-v="1">Wahr<span class="ic"></span></button><button class="opt" data-v="0">Falsch<span class="ic"></span></button></div>`;
    else if (q.typ === "rechnen") h += `<form class="inrow" id="rf" autocomplete="off"><input id="ans" inputmode="decimal" placeholder="Ergebnis" aria-label="Ergebnis in ${esc(q.einheit)}"><span class="unit-lbl">${esc(q.einheit)}</span><button class="btn primary" type="submit">Prüfen</button><button class="btn text" type="button" id="skip">Lösung zeigen</button></form>`;
    else h += `<div class="opts">${state.order[state.qi].map(i => `<button class="opt" data-v="${i}"><span>${md(q.optionen[i])}</span><span class="ic"></span></button>`).join("")}</div>`;
    h += `<div id="fb"></div></div>`;
    app.innerHTML = h;
    if (q.typ === "rechnen") {
      const f = document.getElementById("rf"), inp = document.getElementById("ans");
      inp.focus({preventScroll:true});
      f.onsubmit = ev => { ev.preventDefault(); if (!inp.value.trim()) { inp.focus(); return; } answerRechnen(q, inp.value); };
      document.getElementById("skip").onclick = () => answerRechnen(q, null);
    } else app.querySelectorAll(".opt").forEach(o => o.onclick = () => answer(q, o));
  } else {
    const ok = state.results.filter(Boolean).length, n = l.uebungen.length;
    const hatNext = !state.mix && state.lessonIdx < u.lektionen.length - 1;
    h += `<div class="card done"><div class="big">${ok}/${n}</div>
      <p class="meta">${ok === n ? "Alles richtig." : ok >= n*0.7 ? "Gut – schau dir die Fehler nochmals an." : "Lies die Theorie nochmals und versuch es erneut."}</p>
      <div class="row"><button class="btn" id="again">Nochmals</button>
      ${hatNext ? '<button class="btn primary" id="next">Nächste Lektion</button>' : '<button class="btn primary" id="overview">Zur Einheit</button>'}</div></div>`;
    app.innerHTML = h;
    document.getElementById("again").onclick = () => {
      if (state.mix) { const qs = shuffle(l.uebungen); state.lesson = Object.assign({}, l, {uebungen:qs}); state.order = prepare(qs); } else state.order = prepare(l.uebungen);
      state.phase = "quiz"; state.qi = 0; state.results = []; render();
    };
    const nx = document.getElementById("next"); if (nx) nx.onclick = () => openLesson(u, state.lessonIdx + 1);
    const ov = document.getElementById("overview"); if (ov) ov.onclick = () => { state.view = "unit"; render(); scrollTo(0,0); };
  }
  document.getElementById("back").onclick = () => { state.view = "unit"; render(); scrollTo(0,0); };
}

function feedback(q, correct, extra){
  const last = state.qi === state.lesson.uebungen.length - 1;
  let weg = "";
  if (q.rechenweg && q.rechenweg.length) weg = `<ol>${q.rechenweg.map(s => `<li>${md(s)}</li>`).join("")}</ol>`;
  document.getElementById("fb").innerHTML = `<div class="fb ${correct ? "ok" : "bad"}"><div class="verdict">${correct ? "✓ Richtig." : "✗ Nicht ganz."}</div>${extra || ""}${q.erklaerung ? md(q.erklaerung) : ""}${weg}${q.quelle ? `<div class="src">Aufgabe ${esc(q.quelle)}</div>` : ""}</div>
    <div class="row"><button class="btn primary" id="nq">${last ? "Auswertung" : "Weiter"}</button></div>`;
  const nq = document.getElementById("nq"); nq.focus({preventScroll:true});
  nq.onclick = () => {
    if (last) {
      if (!state.mix) {
        const u = einheiten[state.unitId], k = lk(u.id, state.lesson.id), ok = state.results.filter(Boolean).length;
        const p = store.lektionen[k] || {}; p.fertig = true; p.best = Math.max(p.best || 0, ok); p.zuletzt = new Date().toISOString().slice(0,10);
        store.lektionen[k] = p; save();
      }
      state.phase = "fertig";
    } else state.qi++;
    render(); scrollTo(0,0);
  };
}
function answer(q, btn){
  const v = +btn.dataset.v;
  const isRight = ov => q.typ === "wahr_falsch" ? (ov === 1) === q.antwort : ov === q.richtig;
  const correct = isRight(v);
  state.results[state.qi] = correct;
  app.querySelectorAll(".opt").forEach(o => {
    o.disabled = true; const ov = +o.dataset.v;
    if (isRight(ov)) { o.classList.add("ok"); o.querySelector(".ic").textContent = "✓"; }
    else if (o === btn) { o.classList.add("bad"); o.querySelector(".ic").textContent = "✗"; }
  });
  feedback(q, correct);
}
function zahl(s){
  s = String(s).trim().replace(/\s|'/g, "").replace("−", "-").replace(",", ".");
  const m = s.match(/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?/i);
  return m ? parseFloat(m[0]) : NaN;
}
function fmt(x){ return String(+x.toPrecision(4)).replace(".", "."); }
function answerRechnen(q, roh){
  const inp = document.getElementById("ans"); inp.disabled = true;
  app.querySelectorAll("#rf button").forEach(b => b.hidden = true);
  let correct = false, extra = "";
  if (roh !== null) {
    const x = zahl(roh), tol = q.toleranz ?? 0.02;
    correct = isFinite(x) && Math.abs(x - q.loesung) <= Math.abs(q.loesung) * tol + 1e-12;
    inp.style.borderColor = correct ? "var(--dc-success)" : "var(--dc-danger)";
    if (!correct) extra = `<p style="margin:0 0 6px">${isFinite(x) ? "Deine Antwort: " + esc(roh) + " " + esc(q.einheit) + ". " : ""}Lösung: <strong>${fmt(q.loesung)} ${esc(q.einheit)}</strong></p>`;
  } else extra = `<p style="margin:0 0 6px">Lösung: <strong>${fmt(q.loesung)} ${esc(q.einheit)}</strong></p>`;
  state.results[state.qi] = correct;
  feedback(q, correct, extra);
}

render();
})();
</script>
</body>
</html>
