:root{
  --dc-bg:#100f0c;--dc-surface:#181713;--dc-surface-raised:#201f1b;--dc-line:#32302a;
  --dc-accent:#c9bb83;--dc-accent-hover:#dbce9f;--dc-accent-soft:#252215;--dc-accent-line:#60583b;--dc-on-accent:#16140c;
  --dc-text:#ebeaef;--dc-text-muted:#aaaab2;--dc-text-faint:#807f87;
  --dc-campus:#af9ee4;--dc-campus-soft:#231f2f;
  --dc-success:#8ec7a1;--dc-warning:#dcc188;--dc-danger:#dc8b88;
  --dc-font-fach:"Space Grotesk",system-ui,sans-serif;--dc-font-campus:"Outfit",system-ui,sans-serif;
  --dc-font-mono:"JetBrains Mono",ui-monospace,monospace;
  --code-bg:#0c0b09;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--dc-bg);color:var(--dc-text);font:400 16px/1.55 var(--dc-font-fach);-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--dc-accent)}
code,.mono{font-family:var(--dc-font-mono);font-size:.9em}
:not(pre)>code{background:var(--dc-surface-raised);border:1px solid var(--dc-line);border-radius:6px;padding:1px 5px}
h1,h2,h3{font-weight:600;line-height:1.25;margin:0}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}

/* Kopfzeile */
.kopf{position:sticky;top:0;z-index:20;background:rgba(16,15,12,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--dc-line)}
.kopf .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.logo{font-weight:600;font-size:1.05rem;line-height:1.1}
.logo small{display:block;font:500 .72rem/1.2 var(--dc-font-campus);color:var(--dc-text-muted)}
.kopf .platz{flex:1}
.zurueck{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 12px 0 8px;border:1px solid var(--dc-line);border-radius:999px;background:transparent;color:var(--dc-text-muted);cursor:pointer;font-size:.9rem;white-space:nowrap}
.zurueck:hover{color:var(--dc-text);border-color:var(--dc-accent-line)}
.dc-home{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:36px;padding:0 12px;border:1px solid var(--dc-line);border-radius:999px;background:transparent;color:var(--dc-campus);font:500 13px/1 var(--dc-font-campus);text-decoration:none;white-space:nowrap}
.dc-home:hover,.dc-home:focus-visible{border-color:var(--dc-campus)}
.dc-home svg{width:16px;height:16px;flex:none}
@media (max-width:520px){.dc-home{padding:0 10px}.dc-home span{display:none}.logo small{display:none}}

main{padding:24px 0 48px}
.lade{display:flex;align-items:center;justify-content:center;gap:10px;min-height:50vh;color:var(--dc-text-muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--dc-line);border-top-color:var(--dc-accent);border-radius:50%;animation:dreh 1s linear infinite;flex:none}
@keyframes dreh{to{transform:rotate(360deg)}}
.leise{color:var(--dc-text-muted)}
.klein{font-size:.85rem}
.quelle{color:var(--dc-text-faint);font-size:.8rem;margin-top:24px}

/* Übersicht */
.titel-gross{font-size:1.7rem;margin-bottom:4px}
.termin{display:flex;gap:12px;align-items:center;margin:20px 0 8px;padding:12px 14px;border:1px solid var(--dc-line);border-left:2px solid var(--dc-warning);border-radius:10px;background:var(--dc-surface)}
.termin b{font-weight:600}
.wochen{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.woche{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px;background:var(--dc-surface);border:1px solid var(--dc-line);border-radius:10px;cursor:pointer}
.woche:hover{border-color:var(--dc-accent-line);background:var(--dc-surface-raised)}
.sw{font:500 .85rem/1 var(--dc-font-mono);color:var(--dc-accent);border:1px solid var(--dc-accent-line);background:var(--dc-accent-soft);border-radius:6px;padding:6px 0;text-align:center}
.woche h3{font-size:1.05rem}
.woche .zahlen{font-size:.82rem;color:var(--dc-text-muted);margin-top:2px}
.ring{width:44px;height:44px}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--dc-line)}.ring .fg{stroke:var(--dc-accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{fill:var(--dc-text-muted);font:500 11px var(--dc-font-campus);text-anchor:middle;dominant-baseline:central}

/* Einheit */
.einheit-kopf{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px}
.einheit-kopf .sw{padding:8px 10px;margin-top:4px}
.tabs{display:flex;gap:4px;margin:22px 0 16px;border-bottom:1px solid var(--dc-line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--dc-text-muted);cursor:pointer;white-space:nowrap;font-weight:500}
.tab .n{font:500 .75rem var(--dc-font-campus);color:var(--dc-text-faint);margin-left:4px}
.tab.aktiv{color:var(--dc-text);border-bottom-color:var(--dc-accent)}
.tab:hover{color:var(--dc-text)}
.lektionen{display:flex;flex-direction:column;gap:8px}
.lektion{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px;background:var(--dc-surface);border:1px solid var(--dc-line);border-radius:10px;cursor:pointer}
.lektion:hover{border-color:var(--dc-accent-line);background:var(--dc-surface-raised)}
.lektion .nr{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid var(--dc-line);font:500 .8rem var(--dc-font-campus);color:var(--dc-text-muted)}
.lektion.fertig .nr{border-color:var(--dc-accent);color:var(--dc-accent)}
.lektion .txt{flex:1;min-width:0}
.lektion .meta{font-size:.8rem;color:var(--dc-text-faint)}
.lektion .status{font:500 .78rem var(--dc-font-campus);color:var(--dc-text-faint);white-space:nowrap}
.lektion.fertig .status{color:var(--dc-success)}
.stufe{letter-spacing:1px;color:var(--dc-accent)}
.leer{padding:24px;text-align:center;color:var(--dc-text-muted);border:1px dashed var(--dc-line);border-radius:10px}
[hidden]{display:none!important}
.lektion .themen{display:block;font-size:.78rem;color:var(--dc-text-faint);margin-top:2px}
.tabs.start{margin-top:18px}
.fehlerleiste{position:fixed;left:0;right:0;bottom:0;z-index:80;display:flex;gap:10px;align-items:flex-start;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#2a1a19;border-top:1px solid var(--dc-danger);color:var(--dc-text);font-size:.85rem}
.fehlerleiste span{flex:1;overflow-wrap:anywhere}

/* Theorie */
.lesen h1{font-size:1.5rem;margin-bottom:6px}
.lesen h3{font-size:1.15rem;margin:28px 0 8px}
.lesen p{margin:10px 0}
.lesen ul,.lesen ol{margin:8px 0;padding-left:22px}
.lesen li{margin:4px 0}
.lesen .listen-titel{font-weight:600;margin:16px 0 4px}
.merke,.hinweis{margin:16px 0;padding:12px 14px;border:1px solid var(--dc-line);border-radius:10px;background:var(--dc-surface)}
.merke{border-left:2px solid var(--dc-accent)}
.merke::before{content:"Merke";display:block;font:600 .72rem var(--dc-font-campus);letter-spacing:.06em;text-transform:uppercase;color:var(--dc-accent);margin-bottom:2px}
.hinweis{border-left:2px solid var(--dc-campus)}
.hinweis::before{content:"Hinweis";display:block;font:600 .72rem var(--dc-font-campus);letter-spacing:.06em;text-transform:uppercase;color:var(--dc-campus);margin-bottom:2px}
.formel{margin:14px 0;overflow-x:auto;text-align:center;font-size:1.1rem}
table.tab-inhalt{border-collapse:collapse;margin:14px 0;width:100%;font-size:.92rem;display:block;overflow-x:auto}
table.tab-inhalt th,table.tab-inhalt td{border:1px solid var(--dc-line);padding:7px 10px;text-align:left;vertical-align:top}
table.tab-inhalt th{background:var(--dc-surface-raised);font-weight:600}
.lesen img{max-width:100%;border-radius:10px}
.beispiel{margin:14px 0;border:1px solid var(--dc-line);border-radius:10px;overflow:hidden;background:var(--code-bg)}
.beispiel-kopf{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--dc-line);background:var(--dc-surface);font:500 .78rem var(--dc-font-campus);color:var(--dc-text-muted)}
.beispiel-kopf .platz{flex:1}
.beispiel .ausgabe{border-top:1px dashed var(--dc-line)}
.ausgabe-label{font:500 .7rem var(--dc-font-campus);color:var(--dc-text-faint);padding:6px 12px 0;text-transform:uppercase;letter-spacing:.05em}

/* Code */
pre.code{margin:0;padding:12px 0;overflow-x:auto;font:400 .86rem/1.55 var(--dc-font-mono);background:var(--code-bg);tab-size:4}
pre.code .ln{display:flex;padding:0 12px;min-height:1.55em}
pre.code .ln .zn{width:2.2em;flex:none;color:var(--dc-text-faint);user-select:none;text-align:right;padding-right:12px}
pre.code .ln span.t{white-space:pre}
pre.code .ln.klick{cursor:pointer}
pre.code .ln.klick:hover{background:var(--dc-surface-raised)}
pre.code .ln.sel{background:var(--dc-accent-soft)}
pre.code .ln.ok{background:rgba(142,199,161,.14)}
pre.code .ln.falsch{background:rgba(220,139,136,.14)}
.k{color:#d7a2c5}.s{color:#a9c98d}.n{color:#e2b07a}.c{color:var(--dc-text-faint);font-style:italic}.f{color:#8fb8dd}
pre.out{margin:0;padding:8px 12px 10px;font:400 .84rem/1.5 var(--dc-font-mono);white-space:pre-wrap;word-break:break-word;color:var(--dc-text)}
pre.out.fehler{color:var(--dc-danger)}
pre.out .wert{color:var(--dc-text-muted)}
pre.md-code{margin:10px 0;padding:10px 12px;border:1px solid var(--dc-line);border-radius:8px;background:var(--code-bg);overflow-x:auto;font:400 .86rem/1.5 var(--dc-font-mono)}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--dc-line);background:var(--dc-surface-raised);color:var(--dc-text);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--dc-accent-line)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primaer{background:var(--dc-accent);border-color:var(--dc-accent);color:var(--dc-on-accent);font-weight:600}
.btn.primaer:hover{background:var(--dc-accent-hover)}
.btn.klein{min-height:30px;padding:0 10px;font-size:.82rem;border-radius:8px}
.btn.geist{background:transparent}
.knopfzeile{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:20px}

/* Schnellfragen */
.fortschritt{height:4px;border-radius:4px;background:var(--dc-accent-line);overflow:hidden;margin:4px 0 22px}
.fortschritt>i{display:block;height:100%;background:var(--dc-accent);transition:width .3s}
.frage{font-size:1.12rem;font-weight:500;margin:14px 0 14px}
.optionen{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:12px 14px;border:1px solid var(--dc-line);border-radius:10px;background:var(--dc-surface);cursor:pointer;font-family:inherit}
.opt.mono{font-family:var(--dc-font-mono);white-space:pre-wrap;font-size:.9rem}
.opt:hover{border-color:var(--dc-accent-line)}
.opt.sel{border-color:var(--dc-accent);background:var(--dc-accent-soft)}
.opt.ok{border-color:var(--dc-success);background:rgba(142,199,161,.12)}
.opt.falsch{border-color:var(--dc-danger);background:rgba(220,139,136,.12)}
.zeile2{display:flex;gap:8px}.zeile2 .opt{flex:1;text-align:center;padding:18px}
.feld{width:100%;padding:10px 12px;border:1px solid var(--dc-line);border-radius:10px;background:var(--code-bg);outline:none}
.feld:focus{border-color:var(--dc-accent-line)}
textarea.feld{min-height:90px;resize:vertical;font-family:var(--dc-font-mono);font-size:.88rem}
input.luecke{width:7em;padding:1px 6px;border:0;border-bottom:1px solid var(--dc-accent);background:var(--dc-accent-soft);font-family:var(--dc-font-mono);font-size:.86rem;outline:none;border-radius:4px 4px 0 0}
input.luecke.ok{border-color:var(--dc-success)}input.luecke.falsch{border-color:var(--dc-danger)}
.paar{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.paar .links{padding:10px 12px;border:1px solid var(--dc-line);border-radius:10px;background:var(--dc-surface)}
.paar select{width:100%;padding:10px;border:1px solid var(--dc-line);border-radius:10px;background:var(--dc-surface-raised)}
.paar select.ok{border-color:var(--dc-success)}.paar select.falsch{border-color:var(--dc-danger)}
.ordnen{display:flex;flex-direction:column;gap:6px;min-height:46px;padding:8px;border:1px dashed var(--dc-line);border-radius:10px;margin-bottom:10px}
.ordnen .opt{padding:8px 12px}
.karte{min-height:150px;display:grid;place-items:center;text-align:center;padding:24px;border:1px solid var(--dc-line);border-radius:16px;background:var(--dc-surface);font-size:1.1rem}
.feedback{margin-top:16px;padding:12px 14px;border-radius:10px;border:1px solid var(--dc-line);background:var(--dc-surface)}
.feedback.ok{border-left:2px solid var(--dc-success)}.feedback.falsch{border-left:2px solid var(--dc-danger)}
.feedback b{display:block;margin-bottom:2px}
.feedback.ok b{color:var(--dc-success)}.feedback.falsch b{color:var(--dc-danger)}
.ai{margin-top:10px;color:var(--dc-text-muted);font-size:.92rem}
.ergebnis{text-align:center;padding:30px 10px}
.ergebnis .gross{font:600 3rem/1 var(--dc-font-fach);color:var(--dc-accent)}

/* Notebook */
.aufgabe-box{padding:4px 2px 8px}
.aufgabe-box h3{font-size:1.05rem;margin:18px 0 6px}
.unteraufgaben{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.unteraufgaben .tab{border:1px solid var(--dc-line);border-radius:999px;padding:6px 12px;font-size:.85rem}
.unteraufgaben .tab.aktiv{border-color:var(--dc-accent);color:var(--dc-text)}
.unteraufgaben .tab.ok::after{content:" ✓";color:var(--dc-success)}

<script type="text/x-python" id="py-runner">
import ast, builtins, io, json, linecache, sys, traceback

_NS = {}
_MAX = 30000


class _NeedInput(BaseException):
    def __init__(self, prompt):
        self.prompt = prompt


class _Stdin:
    vals = []
    pos = 0
    ask = True  # True: fehlende Eingabe erfragen (interaktiv), False: EOFError (Prüfen)
    echo = True  # Prompt und Wert in die Ausgabe schreiben (wie in Jupyter)


def _input(prompt=""):
    prompt = str(prompt)
    if _Stdin.pos < len(_Stdin.vals):
        v = str(_Stdin.vals[_Stdin.pos])
        _Stdin.pos += 1
        if _Stdin.echo:
            print(prompt + v)
        return v
    if _Stdin.ask:
        raise _NeedInput(prompt)
    raise EOFError("input() wurde öfter aufgerufen, als Eingaben vorgesehen sind")


builtins.input = _input


def _ns(name, neu=False):
    if neu or name not in _NS:
        _NS[name] = {"__name__": "__main__"}
    return _NS[name]


def _fmt(e, prefix="<Zelle"):
    if isinstance(e, SyntaxError):
        return "".join(traceback.format_exception_only(type(e), e)).rstrip()
    te = traceback.TracebackException.from_exception(e)
    te.stack = traceback.StackSummary.from_list([f for f in te.stack if f.filename.startswith(("<Zelle", "<Tests"))])
    return "".join(te.format()).rstrip()


def _exec(code, g, name):
    """Führt Code aus wie Jupyter: Wert des letzten Ausdrucks wird zurückgegeben."""
    linecache.cache[name] = (len(code), None, code.splitlines(True), name)
    buf = io.StringIO()
    alt_out, alt_err = sys.stdout, sys.stderr
    sys.stdout = sys.stderr = buf
    wert = fehler = need = None
    try:
        tree = ast.parse(code, name)
        last = None
        if tree.body and isinstance(tree.body[-1], ast.Expr):
            last = ast.Expression(tree.body.pop().value)
        exec(compile(tree, name, "exec"), g)
        if last is not None:
            r = eval(compile(last, name, "eval"), g)
            if r is not None:
                wert = repr(r)
    except _NeedInput as e:
        need = e.prompt
    except SystemExit:
        pass
    except BaseException as e:
        fehler = _fmt(e)
    finally:
        sys.stdout, sys.stderr = alt_out, alt_err
    out = buf.getvalue()
    if len(out) > _MAX:
        out = out[:_MAX] + "\n… (Ausgabe gekürzt)"
    return {"out": out, "wert": wert, "fehler": fehler, "need": need}


def _dc_ping(a):
    return json.dumps({"ok": True, "version": sys.version.split()[0]})


def _dc_reset(a):
    a = json.loads(a)
    _ns(a["ns"], neu=True)
    return json.dumps({"ok": True})


def _dc_run(a):
    a = json.loads(a)
    g = _ns(a["ns"], neu=a.get("frisch", False))
    _Stdin.vals, _Stdin.pos, _Stdin.ask, _Stdin.echo = a.get("stdin", []), a.get("pos", 0), True, True
    r = _exec(a["code"], g, a.get("name", "<Zelle>"))
    r["pos"] = _Stdin.pos
    return json.dumps(r)


def _dc_check(a):
    """Prüfen: Namensraum neu, alle Code-Zellen, _ausgabe, dann tests."""
    a = json.loads(a)
    g = _ns(a["ns"], neu=True)
    _Stdin.vals, _Stdin.pos, _Stdin.ask, _Stdin.echo = a.get("eingaben", []), 0, False, True
    zellen, gesamt = [], ""
    for i, code in enumerate(a["cells"]):
        r = _exec(code, g, f"<Zelle [{i + 1}]>")
        zellen.append(r)
        gesamt += r["out"]
        if r["fehler"]:
            return json.dumps({"zellen": zellen, "ok": False, "art": "zelle", "zelle": i,
                               "meldung": r["fehler"]})
    g["_ausgabe"] = gesamt
    tests = a.get("tests") or ""
    if not tests.strip():
        return json.dumps({"zellen": zellen, "ok": True, "art": "ohne", "meldung": ""})
    linecache.cache["<Tests>"] = (len(tests), None, tests.splitlines(True), "<Tests>")
    buf = io.StringIO()
    alt_out = sys.stdout
    sys.stdout = buf
    try:
        exec(compile(tests, "<Tests>", "exec"), g)
        return json.dumps({"zellen": zellen, "ok": True, "art": "tests", "meldung": ""})
    except AssertionError as e:
        return json.dumps({"zellen": zellen, "ok": False, "art": "assert",
                           "meldung": str(e) or "Ein Test ist fehlgeschlagen."})
    except BaseException as e:
        return json.dumps({"zellen": zellen, "ok": False, "art": "fehler", "meldung": _fmt(e)})
    finally:
        sys.stdout = alt_out


def _norm(s):
    s = str(s or "").replace("\r", "")
    return "\n".join(z.rstrip() for z in s.split("\n")).rstrip("\n")


def _dc_check_alt(a):
    """Ältere programmieraufgabe: jeder Test in frischem Namensraum, Ausgabe ohne Eingabe-Echo."""
    a = json.loads(a)
    erg = []
    for t in a["tests"]:
        g = {"__name__": "__main__"}
        ein = t.get("eingabe") or ""
        _Stdin.vals, _Stdin.pos, _Stdin.ask, _Stdin.echo = (ein.split("\n") if ein != "" else []), 0, False, False
        buf = io.StringIO()
        alt = sys.stdout
        sys.stdout = buf
        fehler = wert = None
        try:
            exec(compile(a["code"], "<Zelle [1]>", "exec"), g)
            if t.get("aufruf"):
                wert = repr(eval(t["aufruf"], g))
        except BaseException as e:
            fehler = _fmt(e)
        finally:
            sys.stdout = alt
        if t.get("aufruf"):
            erg.append({"ok": fehler is None and wert == t.get("erwartet"), "aufruf": t["aufruf"],
                        "erwartet": t.get("erwartet"), "erhalten": wert, "fehler": fehler})
        else:
            erwartet, erhalten = _norm(t.get("ausgabe")), _norm(buf.getvalue())
            erg.append({"ok": fehler is None and erhalten == erwartet, "eingabe": ein,
                        "erwartet": erwartet, "erhalten": erhalten, "fehler": fehler})
    _Stdin.echo = True
    return json.dumps({"tests": erg, "ok": all(e["ok"] for e in erg)})

function zeigeFehler(msg) {

function formel(tex, block) {
  try { if (window.katex) return katex.renderToString(tex, { displayMode: !!block, output: "mathml", throwOnError: false }); } catch (e) {}

/* Inline-Markdown: `code`, **fett**, *kursiv*, [Link](url), $Formel$ */
function inl(s) {
  const schutz = [];
  const merk = html => "\u0000" + (schutz.push(html) - 1) + "\u0000";
  s = String(s ?? "");
  s = s.replace(/`([^`]+)`/g, (_, c) => merk(`<code>${esc(c)}</code>`));
  s = s.replace(/\$\$([^$]+)\$\$/g, (_, t) => merk(formel(t, true)));
  s = s.replace(/\$([^$\n]+)\$/g, (_, t) => merk(formel(t, false)));
  s = esc(s);
  s = s.replace(/\*\*\*([^*]+)\*\*\*/g, "<b><i>$1</i></b>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<i>$2</i>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => schutz[+i]);

/* Block-Markdown für Aufgaben und Markdown-Zellen */
function md(text) {
  const zeilen = String(text ?? "").replace(/\r/g, "").split("\n");
  let html = "", i = 0;
  while (i < zeilen.length) {
    const z = zeilen[i];

      const sprache = z.slice(3).trim(); const code = []; i++;
      while (i < zeilen.length && !/^```/.test(zeilen[i])) code.push(zeilen[i++]);
      i++;

      continue;
    }
    if (/^\$\$/.test(z.trim())) {
      let tex = z.trim().replace(/^\$\$/, "");
      if (tex.endsWith("$$")) { tex = tex.slice(0, -2); i++; }
      else { i++; while (i < zeilen.length && !zeilen[i].includes("$$")) tex += "\n" + zeilen[i++]; if (i < zeilen.length) { tex += "\n" + zeilen[i].replace("$$", ""); i++; } }
      html += `<div class="formel">${formel(tex, true)}</div>`; continue;
    }
    const kopf = z.match(/^(#{1,4})\s+(.*)/);
    if (kopf) { html += `<h3>${inl(kopf[2])}</h3>`; i++; continue; }
    if (/^\s*[-*]\s+/.test(z)) {
      html += "<ul>";
      while (i < zeilen.length && /^\s*[-*]\s+/.test(zeilen[i])) html += `<li>${inl(zeilen[i++].replace(/^\s*[-*]\s+/, ""))}</li>`;
      html += "</ul>"; continue;
    }
    if (/^\s*\d+\.\s+/.test(z)) {
      html += "<ol>";
      while (i < zeilen.length && /^\s*\d+\.\s+/.test(zeilen[i])) {
        let li = zeilen[i++].replace(/^\s*\d+\.\s+/, "");
        while (i < zeilen.length && /^\s{2,}\S/.test(zeilen[i]) && !/^\s*\d+\.\s+/.test(zeilen[i])) li += " " + zeilen[i++].trim();
        html += `<li>${inl(li)}</li>`;
      }
      html += "</ol>"; continue;
    }
    if (!z.trim()) { i++; continue; }
    const absatz = [];
    while (i < zeilen.length && zeilen[i].trim() && !/^(```|#{1,4}\s|\s*[-*]\s+|\s*\d+\.\s+|\$\$)/.test(zeilen[i])) absatz.push(zeilen[i++]);
    html += `<p>${inl(absatz.join(" "))}</p>`;
  }
  return html;
}

/* Syntax-Hervorhebung für statischen Code */
const KW = new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" "));
const BI = new Set("print input len range int float str bool list dict set tuple type enumerate sum min max round sorted abs open help dir bin repr isinstance zip".split(" "));
function hl(zeile) {
  let out = "", m;
  const re = /(#.*$)|("""|''')|([rRfFbB]?"(?:\\.|[^"\\])*"|[rRfFbB]?'(?:\\.|[^'\\])*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|(\s+)|(.)/g;
  while ((m = re.exec(zeile))) {
    if (m[1]) out += `<span class="c">${esc(m[1])}</span>`;
    else if (m[2] || m[3]) out += `<span class="s">${esc(m[0])}</span>`;
    else if (m[4]) out += `<span class="n">${m[4]}</span>`;
    else if (m[5]) out += KW.has(m[5]) ? `<span class="k">${m[5]}</span>` : BI.has(m[5]) ? `<span class="f">${m[5]}</span>` : m[5];

  }

}

      if (!window.claude?.use) return null;
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return null;
      const id = await user.id();
      if (!id) return null;
      dbRef = db.doc("data/users/" + id + "/" + FACH_ID);
      return dbRef;
    } catch (e) { return null; }
  }
  function jetzt(stand) {
    try { localStorage.setItem(KEY, JSON.stringify(stand)); } catch (e) {}
    if (dbRef) { const kopie = JSON.parse(JSON.stringify(stand)); schreibt = schreibt.then(() => dbRef.set(kopie)).catch(() => {}); }
  }
  return {
    async laden() {
      let lokal = null;
      try { lokal = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
      const ref = await Promise.race([verbinden(), new Promise(r => setTimeout(() => r(null), 10000))]);
      if (ref) { try { const snap = await ref.get(); if (snap.exists) return Object.assign(leer(), JSON.parse(JSON.stringify(snap.data()))); } catch (e) {} }
      return Object.assign(leer(), lokal || {});
    },
    speichern(stand) { clearTimeout(timer); jetzt(stand); },
    spaeter(stand) { clearTimeout(timer); timer = setTimeout(() => jetzt(stand), 1500); },
    online: () => !!dbRef

})();

/* ============================================================
   PYTHON-KERNEL (Pyodide in einem Web Worker)
   ============================================================ */
const kernel = (() => {
  const WORKER = `
    let py = null, bereit = null;
    self.onmessage = async (ev) => {
      const m = ev.data;
      try {
        if (!bereit) bereit = (async () => {
          // 1. eigene Dateien (im Artifact nötig), 2. CDN als Rückfall (z. B. lokale Kopie ohne pyodide-Ordner)
          let fehler = null;
          for (const q of m.quellen) {
            try {
              const r = await fetch(q.url + "pyodide-lock.json", { method: "HEAD" });
              if (!r.ok) throw new Error("HTTP " + r.status + " bei " + q.url);
              if (!self.loadPyodide) importScripts(q.url + "pyodide.js");
              py = await loadPyodide({ indexURL: q.url, stdLibURL: q.url + q.stdlib });
              py.runPython(m.runner); return;
            } catch (e) { fehler = e; }
          }
          throw fehler;
        })();
        try { await bereit; } catch (e) { bereit = null; throw new Error("LADEN: " + (e && e.message || e)); }
        const f = py.globals.get("_dc_" + m.cmd);
        const r = f(JSON.stringify(m.args)); f.destroy();
        self.postMessage({ id: m.id, ok: true, r: JSON.parse(r) });
      } catch (e) {
        const t = String(e && e.message || e);
        self.postMessage({ id: m.id, ok: false, laden: t.startsWith("LADEN: "), fehler: t.replace(/^LADEN: /, "") });
      }
    };`;
  const LADE_LIMIT = 60000;
  let worker = null, nr = 0, geladen = false, ladeTimer = null;
  const offen = new Map();          // id -> { res, timer } – alle wartenden Aufrufe
  const hoerer = new Set();
  let zustand = "aus";
  const setze = z => { zustand = z; hoerer.forEach(f => f(z)); };
  const ladeFehler = t => "Python konnte nicht geladen werden (" + t + "). Prüfe die Internetverbindung und versuche es nochmals.";
  const status = () => setze(offen.size ? (geladen ? "laeuft" : "lädt") : (geladen ? "bereit" : "aus"));

  // Worker beenden und ALLE offenen Aufrufe beantworten (keine verwaisten Timer mehr)
  function beenden(antwort) {
    const w = worker; worker = null; geladen = false;
    clearTimeout(ladeTimer); ladeTimer = null;
    if (w) { w.onmessage = null; w.onerror = null; try { w.terminate(); } catch (x) {} }
    const alle = [...offen.values()]; offen.clear();
    alle.forEach(o => { clearTimeout(o.timer); o.res({ ok: false, ...antwort }); });
    setze("aus");
  }
  function starten() {
    const w = new Worker(URL.createObjectURL(new Blob([WORKER], { type: "text/javascript" })));
    worker = w; geladen = false;
    w.onmessage = ev => {
      if (w !== worker) return;
      const d = ev.data, o = offen.get(d.id);
      if (d.ok && !geladen) geladen = true;
      if (d.ok || d.laden) { clearTimeout(ladeTimer); ladeTimer = null; }
      if (o) {
        offen.delete(d.id); clearTimeout(o.timer);
        o.res(d.ok ? { ok: true, ...d.r } : { ok: false, fehler: d.laden ? ladeFehler(d.fehler) : d.fehler });
      }
      status();
    };
    w.onerror = ev => { if (w === worker) beenden({ fehler: ladeFehler(ev && ev.message || "Worker-Fehler") }); };
  }
  function senden(cmd, args = {}, zeitlimit) {
    if (!worker) {
      try { starten(); }
      catch (e) { setze("aus"); return Promise.resolve({ ok: false, fehler: ladeFehler(e && e.message || e) }); }
    }
    const w = worker, id = ++nr;
    if (!geladen && !ladeTimer) ladeTimer = setTimeout(() => {
      ladeTimer = null;
      if (w === worker && !geladen) beenden({ zeitlimit: true, fehler: ladeFehler("Zeitüberschreitung beim Laden") });
    }, LADE_LIMIT);
    const limit = (zeitlimit ?? 15000) + (geladen ? 0 : LADE_LIMIT);
    return new Promise(res => {
      const o = { res, timer: null };
      o.timer = setTimeout(() => {
        if (w === worker) beenden({ zeitlimit: true, fehler: "Zeitlimit überschritten – vielleicht eine Endlosschleife? Der Kernel wurde neu gestartet, alle Variablen sind weg." });
        else if (offen.get(id) === o) { offen.delete(id); res({ ok: false, fehler: "Der Kernel wurde neu gestartet." }); }
      }, limit);
      offen.set(id, o);
      status();
      w.postMessage({ id, cmd, args, quellen: PYODIDE_QUELLEN, runner: RUNNER_PY });
    });
  }
  return {
    vorwaermen() { if (!worker) senden("ping"); },
    run: (args) => senden("run", args),
    reset: (ns) => senden("reset", { ns }),
    check: (args) => senden("check", args, 30000),
    checkAlt: (args) => senden("check_alt", args, 30000),
    stopp() { if (worker && offen.size) beenden({ gestoppt: true, fehler: "Ausführung gestoppt. Der Kernel wurde neu gestartet, alle Variablen sind weg." }); },
    zustand: () => zustand,
    beobachte(f) { hoerer.add(f); f(zustand); return () => hoerer.delete(f); }
  };
})();
const RUNNER_PY = document.getElementById("py-runner").textContent;

/* ============================================================
   CODE-EDITOR (CodeMirror 5, sonst Textarea)
   ============================================================ */
function editor(el, wert, opt = {}) {
  if (window.CodeMirror) {
    const cm = CodeMirror(el, {
      value: wert, mode: opt.sprache === "markdown" ? "text/plain" : "python", theme: "dc", indentUnit: 4, tabSize: 4,
      lineNumbers: !!opt.zeilen, matchBrackets: true, autoCloseBrackets: true, viewportMargin: Infinity,
      readOnly: opt.gesperrt ? "nocursor" : false, lineWrapping: opt.sprache === "markdown",
      extraKeys: {
        Tab: c => c.somethingSelected() ? c.indentSelection("add") : c.replaceSelection("    ", "end"),
        "Shift-Tab": c => c.indentSelection("subtract"),
        "Shift-Enter": () => opt.tasten?.("shift"), "Ctrl-Enter": () => opt.tasten?.("ctrl"), "Cmd-Enter": () => opt.tasten?.("ctrl"),
        "Alt-Enter": () => opt.tasten?.("alt"),
        "Ctrl-/": c => kommentieren(c), "Cmd-/": c => kommentieren(c)
      }
    });
    if (opt.aenderung) cm.on("change", () => opt.aenderung(cm.getValue()));
    if (opt.fokus) cm.on("focus", opt.fokus);
    return { get: () => cm.getValue(), set: v => cm.setValue(v), focus: () => { cm.focus(); cm.setCursor(cm.lineCount(), 0); }, refresh: () => cm.refresh() };
  }
  const ta = h(`<textarea class="ersatz" spellcheck="false" autocapitalize="off"></textarea>`);
  ta.value = wert; ta.readOnly = !!opt.gesperrt;
  const passen = () => { ta.style.height = "auto"; ta.style.height = (ta.scrollHeight + 2) + "px"; };
  ta.addEventListener("input", () => { passen(); opt.aenderung?.(ta.value); });
  ta.addEventListener("focus", () => opt.fokus?.());
  ta.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.shiftKey || e.ctrlKey || e.metaKey || e.altKey)) { e.preventDefault(); opt.tasten?.(e.shiftKey ? "shift" : e.altKey ? "alt" : "ctrl"); }
    else if (e.key === "Tab") { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText("    ", s, ta.selectionEnd, "end"); opt.aenderung?.(ta.value); }
  });
  el.appendChild(ta); setTimeout(passen);
  return { get: () => ta.value, set: v => { ta.value = v; passen(); }, focus: () => ta.focus(), refresh: passen };
}
function kommentieren(cm) {
  const von = cm.getCursor("from").line, bis = cm.getCursor("to").line;
  const zeilen = []; for (let i = von; i <= bis; i++) zeilen.push(cm.getLine(i));
  const alle = zeilen.every(z => /^\s*#/.test(z) || !z.trim());
  cm.operation(() => { for (let i = von; i <= bis; i++) { const z = cm.getLine(i); if (!z.trim()) continue; const neu = alle ? z.replace(/^(\s*)# ?/, "$1") : z.replace(/^(\s*)/, "$1# "); cm.replaceRange(neu, { line: i, ch: 0 }, { line: i, ch: z.length }); } });
}

/* Ausgabe einer Ausführung als HTML */
function ausgabeHtml(r) {
  if (!r) return "";
  if (!r.ok && r.fehler && r.out === undefined) return `<pre class="out fehler">${esc(r.fehler)}</pre>`;
  let html = "";
  if (r.out) html += `<pre class="out">${esc(r.out.replace(/\n$/, ""))}</pre>`;
  if (r.wert != null) html += `<pre class="out"><span class="wert">${esc(r.wert)}</span></pre>`;
  if (r.fehler) html += `<pre class="out fehler">${esc(r.fehler)}</pre>`;
  return html;
}

    fertig(ok, { loesungHtml: alsCode ? `<pre class="md-code">${richtig.map(hl).join("\n")}</pre>` : `<ol>${richtig.map(r => `<li>${inl(r)}</li>`).join("")}</ol>`, loesung: "", antwort: gewaehlt.map(p => p.t).join(" | ") });
  });
  const zeichne = () => {
    const z = $("#ziel", box), p = $("#pool", box); z.innerHTML = ""; p.innerHTML = "";
    gewaehlt.forEach((it, k) => { const b = h(`<button class="opt${alsCode ? " mono" : ""}">${alsCode ? hl(it.t) : inl(it.t)}</button>`); b.onclick = () => { gewaehlt.splice(k, 1); pool.push(it); zeichne(); }; z.appendChild(b); });
    pool.forEach((it, k) => { const b = h(`<button class="opt${alsCode ? " mono" : ""}">${alsCode ? hl(it.t) : inl(it.t)}</button>`); b.onclick = () => { pool.splice(k, 1); gewaehlt.push(it); zeichne(); }; p.appendChild(b); });
    p.hidden = !pool.length;
    if (!pool.length) leiste.aktivieren(); else leiste.knopf.disabled = true;
  };
  zeichne();
}

/* ============================================================
   PROGRAMMIEREN – Notebook wie in Jupyter
   ============================================================ */
function programmierenSeite(s, e, l, naechste) {
  const alt = altAufgaben(l);
  s.innerHTML = `<h1 style="font-size:1.4rem">${esc(l.titel)}</h1>
    <p class="leise klein">${l.dauer_min ? l.dauer_min + " min · " : ""}${l.schwierigkeit ? `Schwierigkeit <span class="stufe">${"●".repeat(l.schwierigkeit)}${"○".repeat(3 - l.schwierigkeit)}</span> · ` : ""}${swLabel(e)} · Programmieren</p>
    <div id="unter"></div><div id="nb"></div>`;
  if (!alt.length) return notebook($("#nb", s), {
    key: l.id, aufgabe: l.aufgabe, zellen: l.zellen?.length ? l.zellen : [{ typ: "code", inhalt: "" }], eingaben: l.eingaben || [],
    hinweise: l.hinweise || [], loesung: l.loesung, quelle: l.quelle,
    pruefen: async (zellen) => {
      const r = await kernel.check({ ns: "nb", cells: zellen, eingaben: l.eingaben || [], tests: l.tests || "" });
      return r;
    }
  }, naechste, e);
  // ältere Lektion mit programmieraufgabe-Aufgaben: eine Unteraufgabe pro Notebook
  let aktiv = Math.max(0, alt.findIndex(a => !stand.nb[a.id]?.ok));
  const unter = $("#unter", s);
  const zeigeTabs = () => {
    unter.innerHTML = alt.length > 1 ? `<div class="unteraufgaben">${alt.map((a, i) => `<button class="tab${i === aktiv ? " aktiv" : ""}${stand.nb[a.id]?.ok ? " ok" : ""}" data-i="${i}">${i + 1} · ${esc(a.titel || "Aufgabe")}</button>`).join("")}</div>` : "";
    unter.querySelectorAll(".tab").forEach(b => b.onclick = () => { aktiv = +b.dataset.i; zeige(); });
  };
  const zeige = () => {
    zeigeTabs();
    const a = alt[aktiv];
    notebook($("#nb", s), {
      key: a.id, titel: alt.length > 1 ? a.titel : null, aufgabe: a.aufgabe, zellen: [{ typ: "code", inhalt: a.startcode || "" }], eingaben: [],
      hinweise: a.hinweise || [], loesung: a.musterloesung, quelle: a.quelle, kriterien: a.kriterien,
      pruefen: async (zellen) => {
        const r = await kernel.checkAlt({ code: zellen.join("\n\n"), tests: a.tests || [] });
        if (!r.ok && !r.tests) return r;
        const falsch = (r.tests || []).filter(t => !t.ok);
        let meldung = "";
        if (falsch.length) {
          const t = falsch[0];
          meldung = t.aufruf ? `${t.aufruf} sollte ${t.erwartet} ergeben, ergibt aber ${t.fehler ? "einen Fehler:\n" + t.fehler : t.erhalten}.`
            : `Mit der Eingabe ${t.eingabe ? JSON.stringify(t.eingabe.split("\n")) : "(keine)"} erwartet:\n${t.erwartet || "(keine Ausgabe)"}\n\nerhalten:\n${t.fehler || t.erhalten || "(keine Ausgabe)"}`;
        }
        return { ok: r.ok, art: falsch.length ? "assert" : "tests", meldung, anzahl: (r.tests || []).length, bestanden: (r.tests || []).filter(t => t.ok).length };
      },
      nachBestanden: () => { zeigeTabs(); if (aktiv < alt.length - 1) return { text: "Nächste Aufgabe", f: () => { aktiv++; zeige(); } }; }
    }, naechste, e);
  };
  zeige();
}

function notebook(ziel, cfg, naechste, e) {
  const gespeichert = stand.nb[cfg.key];
  let zellen = (gespeichert?.zellen?.length ? gespeichert.zellen : cfg.zellen).map(z => ({ typ: z.typ, inhalt: z.inhalt ?? "", gesperrt: !!z.gesperrt }));
  // gesperrte Zellen immer aus dem Original (falls Inhalt geändert wurde)
  const original = cfg.zellen.filter(z => z.gesperrt);
  zellen.forEach(z => { if (z.gesperrt) { const o = original.find(x => x.inhalt.split("\n")[0] === z.inhalt.split("\n")[0]); if (o) z.inhalt = o.inhalt; } });
  let aktivIdx = zellen.findIndex(z => z.typ === "code" && !z.gesperrt); if (aktivIdx < 0) aktivIdx = 0;
  let zaehler = 0, stdin = [], pos = 0, laeuft = false, tippsOffen = 0;
  const ansichten = []; // pro Zelle: { el, ed, ausg, prompt }

  ziel.innerHTML = `${cfg.titel ? `<h3 style="margin:4px 0 6px">${esc(cfg.titel)}</h3>` : ""}<div class="aufgabe-box lesen">${md(cfg.aufgabe || "")}</div>
    ${cfg.kriterien?.length ? `<p class="leise klein">Kriterien: ${cfg.kriterien.map(esc).join(" · ")}</p>` : ""}
    <div class="nb-leiste">
      <button class="btn klein" data-a="run" title="Zelle ausführen (Shift+Enter)">▶ Ausführen</button>
      <button class="btn klein geist" data-a="alle" title="Kernel neu starten und alle Zellen ausführen">⏩ Alle</button>
      <button class="btn klein geist" data-a="stopp" title="Ausführung abbrechen">■</button>
      <button class="btn klein geist" data-a="neu" title="Kernel neu starten (Variablen löschen)">⟳</button>
      <button class="btn klein geist" data-a="code" title="Code-Zelle unterhalb einfügen">+ Code</button>
      <button class="btn klein geist" data-a="text" title="Markdown-Zelle unterhalb einfügen">+ Text</button>
      <span class="platz"></span><span class="kernel" id="kz"><i></i><span>Python</span></span>
    </div>
    ${`<details class="stdin"><summary>Eingaben für <code>input()</code>${cfg.eingaben.length ? `: ${cfg.eingaben.map(x => `<code>${esc(x)}</code>`).join(" ")}` : " – fehlt eine, fragt das Notebook nach"}</summary><textarea class="feld" spellcheck="false" placeholder="ein Wert pro Zeile">${esc(cfg.eingaben.join("\n"))}</textarea></details>`}
    <div class="zellen" id="zellen"></div>
    <div class="knopfzeile"><button class="btn primaer" data-a="pruefen">Prüfen</button>
      ${cfg.hinweise?.length ? `<button class="btn" data-a="tipp">Hinweis <span class="leise klein">(${cfg.hinweise.length})</span></button>` : ""}
      ${cfg.loesung ? `<button class="btn geist" data-a="loesung">Lösung zeigen</button>` : ""}
      <button class="btn geist" data-a="reset" title="Alle Zellen auf den Anfang zurücksetzen">Zurücksetzen</button>
      <span id="frag-nb"></span></div>
    <div id="pruefung"></div><div class="tipps" id="tipps"></div><div id="loesung"></div>
    <p class="tasten"><kbd>Shift</kbd>+<kbd>Enter</kbd> ausführen und weiter · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> ausführen · <kbd>Alt</kbd>+<kbd>Enter</kbd> ausführen und neue Zelle · <kbd>Tab</kbd> einrücken · <kbd>Ctrl</kbd>+<kbd>/</kbd> kommentieren</p>
    ${cfg.quelle ? `<p class="quelle">Quelle: ${esc(quelleText(cfg.quelle))}</p>` : ""}`;

  const stdinFeld = $(".stdin textarea", ziel);
  const leseStdin = () => stdinFeld ? stdinFeld.value.replace(/\r/g, "").split("\n").filter((x, i, arr) => !(i === arr.length - 1 && x === "")) : [];
  stdin = leseStdin();
  stdinFeld?.addEventListener("input", () => { stdin = leseStdin(); pos = Math.min(pos, stdin.length); });

  const kz = $("#kz", ziel);
  const abmelden = kernel.beobachte(z => { kz.className = "kernel " + z; kz.lastChild.textContent = { aus: "Python (startet bei Bedarf)", "lädt": "Python wird geladen …", laeuft: "läuft …", bereit: "Python bereit" }[z]; });
  aufraeumen.push(abmelden);

  const speichern = () => { stand.nb[cfg.key] = { ...(stand.nb[cfg.key] || {}), zellen: zellen.map(z => ({ typ: z.typ, inhalt: z.inhalt, ...(z.gesperrt ? { gesperrt: true } : {}) })), zuletzt: heute() }; storage.spaeter(stand); };

  function setzeAktiv(i, fokus) {
    aktivIdx = Math.max(0, Math.min(i, zellen.length - 1));
    ansichten.forEach((v, k) => v.el.classList.toggle("aktiv", k === aktivIdx));
    if (fokus) { const v = ansichten[aktivIdx]; if (v?.ed && !zellen[aktivIdx].gesperrt) v.ed.focus(); else if (v?.mdEdit) v.mdEdit(); v?.el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
  }
  function zeichneZellen() {
    const box = $("#zellen", ziel); box.innerHTML = ""; ansichten.length = 0;
    zellen.forEach((z, i) => box.appendChild(zelleEl(z, i)));
    setzeAktiv(aktivIdx);
    setTimeout(() => ansichten.forEach(v => v.ed?.refresh()));
  }
  function zelleEl(z, i) {
    const el = h(`<div class="zelle${z.gesperrt ? " gesperrt" : ""}"><div class="prompt">${esc(promptText(z))}</div><div class="zelle-inhalt"><div class="zelle-werkzeug"></div><div class="hier"></div><div class="ausg">${z.typ === "code" ? z._ausg || "" : ""}</div></div></div>`);
    const v = { el, ausg: $(".ausg", el), prompt: $(".prompt", el) };
    ansichten[i] = v;
    el.addEventListener("mousedown", () => setzeAktiv(ansichten.indexOf(v)));
    const wz = $(".zelle-werkzeug", el);
    const knopf = (t, title, f) => { const b = h(`<button title="${title}">${t}</button>`); b.onclick = ev => { ev.stopPropagation(); f(ansichten.indexOf(v)); }; wz.appendChild(b); };
    if (z.typ === "code") knopf("▶", "Ausführen", k => ausfuehren(k, "ctrl"));
    if (!z.gesperrt) {
      knopf("↑", "Nach oben", k => { if (k > 0 && !zellen[k - 1].gesperrt) { [zellen[k - 1], zellen[k]] = [zellen[k], zellen[k - 1]]; aktivIdx = k - 1; speichern(); zeichneZellen(); } });
      knopf("↓", "Nach unten", k => { if (k < zellen.length - 1 && !zellen[k + 1].gesperrt) { [zellen[k + 1], zellen[k]] = [zellen[k], zellen[k + 1]]; aktivIdx = k + 1; speichern(); zeichneZellen(); } });
      knopf(z.typ === "code" ? "M" : "Py", z.typ === "code" ? "In Markdown-Zelle umwandeln" : "In Code-Zelle umwandeln", k => { zellen[k].typ = zellen[k].typ === "code" ? "markdown" : "code"; speichern(); zeichneZellen(); });
      knopf("✕", "Zelle löschen", k => { if (zellen.length <= 1) return; zellen.splice(k, 1); aktivIdx = Math.min(k, zellen.length - 1); speichern(); zeichneZellen(); });
    }
    const hier = $(".hier", el);
    if (z.typ === "code") {
      hier.classList.add("editor");
      v.ed = editor(hier, z.inhalt, {
        gesperrt: z.gesperrt,
        aenderung: wert => { z.inhalt = wert; speichern(); },
        fokus: () => setzeAktiv(ansichten.indexOf(v)),
        tasten: art => ausfuehren(ansichten.indexOf(v), art)
      });
    } else {
      const zeigeMd = () => {
        hier.innerHTML = ""; hier.classList.remove("editor");
        const d = h(`<div class="md-zelle lesen" title="Doppelklick zum Bearbeiten">${z.inhalt.trim() ? md(z.inhalt) : `<span class="leise">Leere Textzelle – Doppelklick zum Bearbeiten</span>`}</div>`);
        if (!z.gesperrt) d.ondblclick = () => bearbeiteMd();
        hier.appendChild(d);
      };
      const bearbeiteMd = () => {
        hier.innerHTML = ""; hier.classList.add("editor");
        v.ed = editor(hier, z.inhalt, { sprache: "markdown", aenderung: w => { z.inhalt = w; speichern(); }, fokus: () => setzeAktiv(ansichten.indexOf(v)), tasten: art => ausfuehren(ansichten.indexOf(v), art) });
        setTimeout(() => { v.ed.refresh(); v.ed.focus(); });
        v.mdZeigen = () => { v.ed = null; zeigeMd(); };
      };
      v.mdEdit = z.gesperrt ? null : bearbeiteMd;
      zeigeMd();
    }
    return el;
  }
  function promptText(z) { return z.typ === "code" ? (z.gesperrt ? "🔒 " : "") + `[${z._nr ?? " "}]:` : ""; }
  function zeige(i, nr, html) {
    const z = zellen[i], v = ansichten[i]; if (!z) return;
    z._nr = nr; if (html !== undefined) z._ausg = html;
    if (v) { v.prompt.textContent = promptText(z); if (html !== undefined) v.ausg.innerHTML = html; }
  }
  function neueZelle(nach, typ = "code") {
    zellen.splice(nach + 1, 0, { typ, inhalt: "" }); aktivIdx = nach + 1; speichern(); zeichneZellen(); setzeAktiv(aktivIdx, true);
  }
  async function ausfuehren(i, art = "shift") {
    const z = zellen[i], v = ansichten[i]; if (!z) return;
    if (z.typ === "markdown") { v.mdZeigen?.(); }
    else {
      if (laeuft) return;
      laeuft = true; zeige(i, "*", "");
      const start = pos;
      let r;
      while (true) {
        r = await kernel.run({ ns: "nb", code: z.inhalt, name: `<Zelle [${zaehler + 1}]>`, stdin, pos: start });
        if (r.ok && r.need != null) {
          // input() braucht einen Wert: im Notebook fragen, dann die Zelle neu ausführen
          const wert = await frageEingabe(v, r.need, r.out);
          if (wert == null) { r = { ok: true, out: r.out, fehler: "Eingabe abgebrochen." }; break; }
          stdin = stdin.slice(0, start + (r.pos - start)); stdin.push(wert);
          if (stdinFeld) stdinFeld.value = stdin.join("\n");
          continue;
        }
        break;
      }
      if (r.ok) pos = r.pos ?? pos;
      if (!r.ok) { zaehler = 0; pos = 0; }
      zaehler++;
      zeige(i, r.ok ? zaehler : " ", ausgabeHtml(r));
      laeuft = false;
    }
    if (art === "shift") { if (i === zellen.length - 1) neueZelle(i); else setzeAktiv(i + 1, true); }
    else if (art === "alt") neueZelle(i);
  }
  function frageEingabe(v, prompt, bisher) {
    return new Promise(res => {
      v.ausg.innerHTML = (bisher ? `<pre class="out">${esc(bisher.replace(/\n$/, ""))}</pre>` : "");
      const f = h(`<div class="eingabe-frage"><label>${esc(prompt || "Eingabe:")}</label><input autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="Wert eingeben und Enter"><button class="btn klein geist">Abbrechen</button></div>`);
      v.ausg.appendChild(f);
      const inp = $("input", f); setTimeout(() => inp.focus());
      inp.onkeydown = ev => { if (ev.key === "Enter") { ev.preventDefault(); f.remove(); res(inp.value); } };
      $("button", f).onclick = () => { f.remove(); res(null); };
    });
  }
  async function neustart(stumm) {
    kernel.stopp(); zaehler = 0; pos = 0; stdin = leseStdin();
    zellen.forEach((z, k) => { if (z.typ === "code") zeige(k, undefined, stumm ? undefined : ""); });
    await kernel.reset("nb");
  }
  async function alleAusfuehren() {
    await neustart();
    for (let i = 0; i < zellen.length; i++) {
      if (zellen[i].typ !== "code") continue;
      await ausfuehren(i, "keine");
      if ((zellen[i]._ausg || "").includes("fehler")) { setzeAktiv(i, true); return; }
    }
  }
  async function pruefen() {
    const box = $("#pruefung", ziel);
    box.innerHTML = `<div class="pruef"><span class="spin"></span> ${kernel.zustand() === "bereit" ? "Kernel neu starten, alle Zellen ausführen, Tests laufen lassen …" : "Python wird geladen …"}</div>`;
    const codeIdx = zellen.map((z, i) => z.typ === "code" ? i : -1).filter(i => i >= 0);
    const r = await cfg.pruefen(codeIdx.map(i => zellen[i].inhalt));
    zaehler = 0; pos = 0;
    if (r.zellen) {
      // Ausgaben der Prüfung unter die Zellen schreiben (wie «Restart & Run All»)
      r.zellen.forEach((zr, k) => { zaehler++; zeige(codeIdx[k], zaehler, ausgabeHtml({ ok: true, ...zr })); });
      for (let k = r.zellen.length; k < codeIdx.length; k++) zeige(codeIdx[k], undefined, "");
    }
    if (!r.ok && r.fehler && !r.art) { box.innerHTML = `<div class="pruef falsch"><b>Prüfen nicht möglich</b><pre>${esc(r.fehler)}</pre></div>`; return; }
    if (r.ok) {
      stand.nb[cfg.key] = { ...(stand.nb[cfg.key] || {}), ok: true, zuletzt: heute() };
      speichern(); stand.nb[cfg.key].ok = true; stand.xp = (stand.xp || 0) + 10; streak(); storage.speichern(stand);
      box.innerHTML = `<div class="pruef ok"><b>Bestanden ✓</b>${r.anzahl ? `<div>${r.bestanden} von ${r.anzahl} Tests erfüllt.</div>` : r.art === "ohne" ? "<div>Alle Zellen laufen ohne Fehler.</div>" : "<div>Alle Tests erfüllt.</div>"}</div>`;
      const weiter = cfg.nachBestanden?.();
      const z = h(`<div class="knopfzeile"></div>`);
      if (weiter) { const b = h(`<button class="btn primaer">${esc(weiter.text)} ›</button>`); b.onclick = weiter.f; z.appendChild(b); }
      else z.appendChild(weiterKnopf(naechste, e));
      box.appendChild(z);
    } else {
      const titel = r.art === "zelle" ? `Fehler in Zelle [${r.zelle + 1}]` : r.art === "assert" ? "Noch nicht ganz" : "Fehler beim Testen";
      box.innerHTML = `<div class="pruef falsch"><b>${titel}</b><pre>${esc(r.meldung)}</pre>${r.anzahl ? `<div class="leise klein" style="margin-top:6px">${r.bestanden} von ${r.anzahl} Tests erfüllt.</div>` : ""}</div>`;
      if (r.art === "zelle") setzeAktiv(codeIdx[r.zelle], true);
    }
    box.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  ziel.querySelector("[data-a=run]").onclick = () => ausfuehren(aktivIdx, "shift");
  ziel.querySelector("[data-a=alle]").onclick = alleAusfuehren;
  ziel.querySelector("[data-a=stopp]").onclick = () => kernel.stopp();
  ziel.querySelector("[data-a=neu]").onclick = () => neustart();
  ziel.querySelector("[data-a=code]").onclick = () => neueZelle(aktivIdx, "code");
  ziel.querySelector("[data-a=text]").onclick = () => neueZelle(aktivIdx, "markdown");
  ziel.querySelector("[data-a=pruefen]").onclick = pruefen;
  ziel.querySelector("[data-a=reset]").onclick = function () {
    if (this.dataset.sicher !== "1") { this.dataset.sicher = "1"; this.textContent = "Wirklich zurücksetzen?"; setTimeout(() => { this.dataset.sicher = ""; this.textContent = "Zurücksetzen"; }, 3000); return; }
    zellen = cfg.zellen.map(z => ({ typ: z.typ, inhalt: z.inhalt ?? "", gesperrt: !!z.gesperrt })); aktivIdx = 0;
    const ok = stand.nb[cfg.key]?.ok; stand.nb[cfg.key] = ok ? { ok } : undefined; if (!ok) delete stand.nb[cfg.key];
    storage.speichern(stand); neustart(); zeichneZellen(); $("#pruefung", ziel).innerHTML = "";
    this.dataset.sicher = ""; this.textContent = "Zurücksetzen";
  };
  const tipp = ziel.querySelector("[data-a=tipp]");
  if (tipp) tipp.onclick = () => {
    if (tippsOffen >= cfg.hinweise.length) return;
    $("#tipps", ziel).insertAdjacentHTML("beforeend", `<div class="tipp"><span class="leise klein">Hinweis ${tippsOffen + 1}</span><div>${inl(cfg.hinweise[tippsOffen])}</div></div>`);
    tippsOffen++; tipp.innerHTML = tippsOffen < cfg.hinweise.length ? `Nächster Hinweis <span class="leise klein">(${cfg.hinweise.length - tippsOffen})</span>` : "Alle Hinweise offen"; if (tippsOffen >= cfg.hinweise.length) tipp.disabled = true;
  };
  const loes = ziel.querySelector("[data-a=loesung]");
  if (loes) loes.onclick = function () {
    const box = $("#loesung", ziel);
    if (box.innerHTML) { box.innerHTML = ""; this.textContent = "Lösung zeigen"; return; }
    if (this.dataset.sicher !== "1") { this.dataset.sicher = "1"; this.textContent = "Sicher? Erst selbst versuchen!"; setTimeout(() => { if (!box.innerHTML) { this.dataset.sicher = ""; this.textContent = "Lösung zeigen"; } }, 3000); return; }
    this.dataset.sicher = ""; this.textContent = "Lösung ausblenden";
    box.innerHTML = `<div class="loesung"><div class="beispiel-kopf"><span>Musterlösung</span><span class="platz"></span><button class="btn klein" data-a="kopie">Als neue Zelle einfügen</button></div>${codeBlock(cfg.loesung)}</div>`;
    $("[data-a=kopie]", box).onclick = () => { zellen.push({ typ: "code", inhalt: cfg.loesung }); aktivIdx = zellen.length - 1; speichern(); zeichneZellen(); setzeAktiv(aktivIdx, true); };
  };
  let letztePruefung = "";
  claudeKontext = () => ({
    stufe: `${e.woche ? "SW" + String(e.woche).padStart(2, "0") + " · " : ""}Programmieren · ${cfg.titel || $("h1")?.textContent || ""}`,
    text: `Aufgabe:\n${cfg.aufgabe || ""}\n\nMein Notebook (Zellen):\n` + zellen.map((z, i) => `--- Zelle ${i + 1} (${z.typ}) ---\n${z.inhalt}${z._ausg ? "\n[Ausgabe] " + (h("<div>" + z._ausg + "</div>").textContent || "").slice(0, 800) : ""}`).join("\n") + (letztePruefung ? "\n\nLetzte Prüfung: " + letztePruefung : "")
  });
  const fk = fragKnopf("Ich komme bei dieser Programmieraufgabe nicht weiter. Gib mir bitte einen Hinweis zum nächsten Schritt, aber noch nicht die ganze Lösung.", "Claude fragen");
  if (fk) $("#frag-nb", ziel).appendChild(h(fk));
  const altPruefen = cfg.pruefen;

function neu(){if(ctl)ctl.abort();chatId=null;turns=[];if(SC)aktivPro[SC.schluessel]=null;seite(false);zeigen();document.getElementById("dc-cin").focus();}
function zeigen(){const box=document.getElementById("dc-cmsgs");
  if(!turns.length){const v=(api.vorschlaege&&api.vorschlaege(SC))||["Erklär mir das hier nochmals einfacher","Gib mir eine Übungsfrage zu diesem Thema","Was muss ich dazu für den Test können?"];
    box.innerHTML=`<div class="dc-cleer"><p style="margin:0">Ich sehe, was gerade auf dem Bildschirm ist, und kann in den Inhalten von «${esc(NAME)}» nachschlagen. Frag zum Beispiel:</p><div class="dc-cchips">${v.map(s=>`<button type="button">${esc(s)}</button>`).join("")}</div></div>`;
    box.querySelectorAll(".dc-cchips button").forEach(b=>b.onclick=()=>senden(b.textContent));return;}
  box.innerHTML=turns.map(t=>`<div class="dc-cmsg ${t.role==="user"?"me":"ai"}">${t.role==="user"?esc(t.content):md(t.content)}</div>`).join("");mathe(box);box.scrollTop=box.scrollHeight;}
function fehlerText(c){return({rate_limited:"Gerade zu viele Anfragen oder dein Nutzungslimit ist erreicht. Versuch es später nochmals.",not_granted:"Du hast der App den Zugriff auf Claude nicht erlaubt.",sampling_disabled:"Claude ist für dieses Konto hier nicht verfügbar.",session_expired:"Bitte melde dich neu an.",prompt_too_large:"Der Verlauf ist zu lang. Starte mit «Neu» einen neuen Chat.",refused:"Diese Frage kann ich so nicht beantworten. Formuliere sie anders."})[c]||"Die Verbindung zu Claude ist abgebrochen. Versuch es nochmals.";}
async function senden(text){if(busy||!sample)return;busy=true;const btn=document.getElementById("dc-csend");btn.textContent="Stopp";seite(false);
  turns.push({role:"user",content:text});zeigen();
  const box=document.getElementById("dc-cmsgs");const b=document.createElement("div");b.className="dc-cmsg ai warte";b.textContent="Denke nach …";box.appendChild(b);box.scrollTop=box.scrollHeight;
  ctl=new AbortController();let tools=false;try{const lim=await sample.limits();tools=!!(lim&&lim.tools);}catch(e){}
  const k=kontext();const hist=turns.slice(-12);
  const input=[{role:"user",content:regeln(k,tools)},{role:"assistant",content:"Verstanden."},...(hist[0]&&hist[0].role==="assistant"?hist.slice(1):hist)];
  const opts={signal:ctl.signal,cache:false,onText:({text})=>{b.classList.remove("warte");b.textContent=text;box.scrollTop=box.scrollHeight;}};if(tools)opts.tools=TOOLS;
  try{const r=await sample(input,opts);turns.push({role:"assistant",content:r.text+(r.truncated?"\n\n*(Antwort gekürzt – frag nach dem Rest.)*":"")});}
  catch(e){const c=e&&e.code;if(e&&e.text)turns.push({role:"assistant",content:e.text+(c==="cancelled"?"\n\n*(abgebrochen)*":"")});
    if(c!=="cancelled")turns.push({role:"assistant",content:"⚠ "+fehlerText(c)});
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c))H.classList.remove("dc-claude-ok");}
  busy=false;btn.textContent="Senden";status("");sichern();zeigen();}
let zurueckSperre=false;
function oeffnen(vorgabe){if(!sample)return;ui();const p=document.getElementById("dc-cpanel");const k=kontext();
  if(!SC||SC.schluessel!==k.schluessel){if(ctl)ctl.abort();SC=k;const a=aktivPro[k.schluessel];const c=a&&chatsVon(k.schluessel).find(x=>x.id===a);chatId=c?c.id:null;turns=c?c.turns.slice():[];}
  document.getElementById("dc-cctx").textContent="Stufe: "+SC.stufe;seite(false);zeigen();
  if(p.hidden){p.hidden=false;document.body.classList.add("dc-chat-offen");try{history.pushState(Object.assign({},history.state,{dcChat:1}),"");}catch(e){}}
  const ta=document.getElementById("dc-cin");if(vorgabe){ta.value=vorgabe;ta.dispatchEvent(new Event("input"));}setTimeout(()=>{ta.focus();if(vorgabe)ta.setSelectionRange(ta.value.length,ta.value.length);},50);}
function schliessen(vonPop){const p=document.getElementById("dc-cpanel");if(!p||p.hidden)return;p.hidden=true;document.body.classList.remove("dc-chat-offen");
  const f=document.getElementById("dc-cfab");if(f)f.focus({preventScroll:true});if(vonPop!==true){zurueckSperre=true;try{history.back();}catch(e){zurueckSperre=false;}}}
window.addEventListener("popstate",e=>{if(zurueckSperre){zurueckSperre=false;e.stopImmediatePropagation();return;}
  const p=document.getElementById("dc-cpanel");if(p&&!p.hidden){schliessen(true);e.stopImmediatePropagation();}},true);

/* ---------- öffentliche Schnittstelle ---------- */
const api=window.dcClaude=Object.assign(window.dcClaude||{},{
  version:1,
  oeffnen,
  knopf(text,label){return `<button type="button" class="dc-ask" data-dc-ask="${esc(text)}">${ICON}<span>${esc(label||"Claude fragen")}</span></button>`;},
  frageText(frage,extra){return "Ich verstehe diese Frage bzw. die Lösung noch nicht ganz. Kannst du es mir Schritt für Schritt erklären?\n\nFrage: "+String(frage||"").replace(/\s+/g," ").trim()+(extra?"\n"+extra:"");}
});
async function start(){ui();if(!window.claude||!window.claude.use)return;
  try{sample=await claude.use("sample");}catch(e){sample=null;}
  if(sample){H.classList.add("dc-claude-ok");window.__sampleOK=true;}}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);else start();
})();
</script>
<!-- ===== Ende Frag Claude ===== -->
</body>
</html>
