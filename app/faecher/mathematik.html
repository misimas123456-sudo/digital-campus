  if(rs.length)parts.push({v:rs.reduce((s,x)=>s+(x.r-1)/3,0)/rs.length,w:rs.length});
  const qs=QUICK.filter(q=>q.b===b).map(q=>S.quiz[q.id]).filter(Boolean);
  const qr=qs.reduce((s,x)=>s+x.r,0),qw=qs.reduce((s,x)=>s+x.w,0);
  if(qr+qw)parts.push({v:qr/(qr+qw),w:Math.min(6,(qr+qw)/2)});
  const u=LEKTIONEN[b]?null:unitOfBlock(b);
  const ls=(LEKTIONEN[b]||(u?u.lektionen:[])).map(l=>S.lessons[l.id]).filter(x=>x&&x.of);
  if(ls.length)parts.push({v:ls.reduce((s,x)=>s+x.score/x.of,0)/ls.length,w:ls.length});
  if(u){let r=0,w=0;u.lektionen.forEach(l=>(l.aufgaben||[]).forEach(a=>{const t=S.aufg[a.id];if(t){r+=t.r;w+=t.w;}}));if(r+w)parts.push({v:r/(r+w),w:Math.min(6,(r+w)/2)});}
  if(!parts.length)return null;const W=parts.reduce((s,p)=>s+p.w,0);return parts.reduce((s,p)=>s+p.v*p.w,0)/W;}
const INTERVAL={1:1,2:3,3:7,4:21};
// Themenabdeckung: Thema gilt als abgedeckt, sobald eine Aufgabe dazu mit "Mit Mühe" oder "Sicher" bewertet ist
function coverage(b){const ts=taskList(b).filter(t=>t.th);const th={};
  ts.forEach(t=>{const o=th[t.th]=th[t.th]||{name:t.th,tasks:[],best:0,last:0,good:0,hard:false,kernN:0};o.tasks.push(t);if(t.kern)o.kernN++;const lr=lastRating(t.nr);if(lr){o.best=Math.max(o.best,lr.r);if(lr.r>=3)o.good++;else o.hard=true;if(lr.ts>(o.lastTs||0)){o.lastTs=lr.ts;o.last=lr.r;}}});
  const out=Object.values(th);out.forEach(o=>{o.ok=o.good>=Math.min(2,o.kernN||2);});return out;}
function suggestions(n,o){
  o=o||{};const now=Date.now();const out=[];
  for(const t of ALL_TASKS){
    if(o.blocks){if(!o.blocks.includes(t.b))continue;}else if(!taught(t.b))continue;
    if(o.cover&&THEMEN_AUFG[t.b]&&!t.th)continue;
    const rel=NOT_RELEVANT.includes(t.b);const lr=lastRating(t.nr);const m=mastery(t.b);
    let score,why,grp=o.cover?(t.kern===false?t.b+"|x|"+t.th:t.b+"|"+t.nr):t.b+"|"+(t.th||t.nr);
    if(t.th&&!lr){ // Block mit Kernset: Thema statt einzelner Aufgabe planen
      const th=coverage(t.b).find(x=>x.name===t.th);
      const base=o.blocks?100:NOW_BLOCKS.includes(t.b)?100:t.b>=(EX_WEEK[0]||THIS_WEEK[0])-4?75:45;
      if(t.kern){
        if(th.ok)continue;                            // Thema schon geübt (mind. 2 Aufgaben sicher)
        score=base+10;why="Kernaufgabe · "+t.th;
      }else{
        if(!(th.hard&&!th.ok))continue;                // Zusatzaufgabe nur, wenn das Thema noch nicht sitzt
        score=base+15;why="Mehr Übung · "+t.th;
      }
    }else if(!lr){
      if(o.blocks){score=100;why="Noch nicht bearbeitet";}
      else if(NOW_BLOCKS.includes(t.b)){score=100;why="Stoff dieser Woche";}
      else if(t.b>=(EX_WEEK[0]||THIS_WEEK[0])-4){score=70;why="Letzte Wochen";}
      else{score=35;why="Noch nicht bearbeitet";}
      if(m!==null&&m<0.6){score+=(0.6-m)*80;why="Schwäche in Block "+t.b;}
      score-=parseFloat(t.nr.split(".")[1])*0.4;
    }else{
      const days=(now-lr.ts)/DAY;const due=days/INTERVAL[lr.r];
      if(lr.r>=4&&due<1)continue;
      if(due<0.5&&lr.r>=3)continue;
      score=(5-lr.r)*22*Math.min(2,due);why=due>=1?(lr.r<=2?"Nochmals versuchen":"Wiederholen"):"Kürzlich schwierig";
      if(t.th)why+=" · "+t.th;
    }
    if(rel&&!(o.blocks&&o.blocks.length===1))score*=0.15;
    score-=parseFloat(t.nr.split(".")[1])*0.05;

  const pick=[],usedGrp=new Set(),perB={};const cap=o.cover||(o.blocks&&o.blocks.length===1)?Infinity:Math.ceil(n/2);

    if(usedGrp.has(s.grp))continue;if(pass&&(perB[s.t.b]||0)>=cap)continue;pick.push(s);usedGrp.add(s.grp);perB[s.t.b]=(perB[s.t.b]||0)+1;}}
  return pick.sort((a,b)=>a.t.b-b.t.b||parseFloat(a.t.nr.split(".")[1])-parseFloat(b.t.nr.split(".")[1]));
}

function quickPool(scope){
  if(scope==="week")return QUICK.filter(q=>THIS_WEEK.includes(q.b));
  if(scope==="weak")return QUICK.filter(q=>S.quiz[q.id]&&S.quiz[q.id].w>0&&S.quiz[q.id].w>=S.quiz[q.id].r-1);
  const b=+scope.slice(1);return QUICK.filter(q=>q.b===b);}
function pickRound(pool,n){

  const arr=pool.map(q=>({q,k:Math.random()*w(q)})).sort((a,b)=>b.k-a.k).slice(0,n).map(x=>x.q);return arr;}

// ---------- Einheiten (Inhaltsformat v2.2): content/mathematik/fach.json + einheiten/<id>.json ----------
const EINH={state:"lade",fach:null,list:[],byId:{}};
const E_BASEN=["content/mathematik/","../../content/mathematik/"];
async function eHole(p){for(const b of E_BASEN){try{const r=await fetch(b+p,{cache:"no-cache"});if(r.ok)return await r.json();}catch(e){}}return null;}

const E_ART={verstaendnis:"theorie",code:"schnellfragen",programmieren:"programmieren",rechnen:"ueben",aufgabe:"ueben",rechnung:"ueben",anwendung:"ueben"};
const E_SEK={theorie:"Theorie",schnellfragen:"Schnellfragen",programmieren:"Programmieren",ueben:"Üben"};

// Text mit $…$ (KaTeX, wird von typeset() gesetzt), **fett**, `code`
function eMd(s){s=String(s==null?"":s);const M=[];

function eShuffle(n){const id=[...Array(n).keys()];if(n<2)return id;let a;for(let t=0;t<20;t++){a=shuffle(id);if(a.some((v,i)=>v!==i))break;}return a;}
function eKind(a){return ({multiple_choice:"Multiple Choice",wahr_falsch:"Wahr oder falsch?",rechnung:"Rechnung",zuordnen:"Zuordnen",reihenfolge:"Reihenfolge",lueckentext:"Lückentext",freitext:"Freitext",karteikarte:"Karteikarte"})[a.typ]||"Aufgabe";}
function eFrage(a){return a.typ==="wahr_falsch"?(a.aussage||a.frage||""):(a.frage||a.text||a.vorne||"");}
function eFmt(x){return String(+(+x).toPrecision(8));}
function eTolText(t){return "±"+String(+(t*100).toPrecision(3))+" %";}
// Zahl aus der Eingabe lesen: Komma/Punkt, −, Brüche (3/7); eine mitgetippte Einheit hinter der Zahl wird ignoriert
function eParse(t,einheit){t=String(t).trim();if(einheit)t=t.split(einheit).join(" ");
  let v=parseNum(t);if(!isNaN(v))return v;
  const m=t.match(/^([−-]?\s*[\d'’.,]+(?:\s*\/\s*\d+)?(?:[eE][−+-]?\d+)?)\s*([^\d]*)$/);
  return m?parseNum(m[1]):NaN;}

    <div class="row" style="margin-top:8px;justify-content:space-between"><span class="small muted">Toleranz ${eTolText(a.toleranz||0)} vom Resultat · Dezimalpunkt oder -komma</span><button type="button" class="btn ghost small" id="giveup">Lösung zeigen</button></div>`;}
  else if(typ==="zuordnen"){inner=`<div class="zl">${a.paare.map((p,i)=>`<button type="button" class="zrow" data-i="${i}"><span class="zlk">${eMd(p[0])}</span><span class="zr"></span></button>`).join("")}</div>
    <p class="small muted" style="margin:10px 0 6px">Tippe links eine Zeile an, dann rechts die passende Antwort. Zeile nochmals antippen löscht die Zuordnung.</p>

  else if(typ==="reihenfolge"){inner=`<div class="rlist">${eShuffle(a.elemente.length).map(i=>`<button type="button" class="rchip" data-i="${i}"><b class="rn"></b><span>${eMd(a.elemente[i])}</span></button>`).join("")}</div>

  const fin=(right,sol,extra)=>{if(done)return;done=true;
    el.querySelectorAll(".opt,.zchip,.zrow,.rchip,#ni,#giveup,#zchk,#rchk,#rreset,#reveal").forEach(b=>b.disabled=true);

      ${extra||""}
      ${weg&&weg.length?`<div class="weg"><span class="lab">Lösungsweg</span><ol>${weg.map(x=>`<li>${eMd(x)}</li>`).join("")}</ol></div>`:""}

    typeset(el);fb.querySelector("#nxt").onclick=cb.onNext;
    const ak=fb.querySelector("#askc");if(ak)ak.onclick=()=>window.__askClaude("Ich verstehe diese Aufgabe bzw. die Lösung noch nicht ganz. Kannst du es mir Schritt für Schritt erklären?\n\nAufgabe: "+eFrage(a));
    fb.querySelector("#nxt").focus({preventScroll:true});cb.onAnswer(right);};
  if(typ==="multiple_choice")el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;const right=i===a.richtig;b.classList.add(right?"right":"wrong");

  else if(typ==="zuordnen"){
    const P=a.paare,asg=P.map(()=>-1);let act=0;
    const rows=[...el.querySelectorAll(".zrow")],chips=[...el.querySelectorAll(".zchip")],chk=el.querySelector("#zchk");

        r.classList.toggle("act",i===act);r.classList.toggle("has",j>=0);

      chips.forEach(c=>{c.classList.toggle("used",asg.includes(+c.dataset.j));});

      rows.forEach((r,i)=>{const ok=P[asg[i]][1]===P[i][1];all=all&&ok;r.classList.remove("act");r.classList.add(ok?"right":"wrong");

      fin(all,"");};}
  else if(typ==="reihenfolge"){
    const E=a.elemente,pick=[];const chips=[...el.querySelectorAll(".rchip")],chk=el.querySelector("#rchk");
    const upd=()=>{chips.forEach(c=>{const i=+c.dataset.i,k=pick.indexOf(i);c.classList.toggle("on",k>=0);c.querySelector(".rn").textContent=k>=0?k+1:"";});chk.disabled=pick.length<E.length;};

  let body="";
  if(el.step<0){
    body=`<div class="card"><div class="row"><span class="pill acc">Lektion ${pos+1}/${secIdx.length}</span><span class="small muted">${eLabel(u)} · ${E_SEK[sec]||sec}</span><span class="small muted">ca. ${L.dauer_min||4} min</span></div>
      <h2 style="margin:10px 0 12px">${eMd(L.titel)}</h2>${explain}${nb}
      ${L.quelle?`<p class="small muted quelle">Quelle: ${eMd(eQuelle(L.quelle))}</p>`:""}
      <div class="row actions" style="margin-top:16px"><button class="btn primary" id="go">${n?`Zu den Aufgaben (${n})`:"Lektion abschliessen"}</button></div></div>`;
  }else if(el.step<n){
    body=`<div class="card" id="qc"></div>
      <details class="card recap"><summary>Erklärung nochmals ansehen</summary><div style="margin-top:10px">${explain}</div></details>`;
  }else{
    const ok=n?el.score/n:1;
    body=`<div class="card result"><span class="pill acc">${eMd(L.titel)}</span>${n?`<div class="bignum">${el.score}/${n}</div>
      <p style="margin:0">${ok===1?"Alles richtig.":ok>=.75?"Gut gemacht – fast alles sitzt.":ok>=.5?"Solide. Schau dir die Erklärungen der Fehler nochmals an.":"Lies die Erklärung nochmals und wiederhole die Lektion."}</p>
      <p class="small muted" style="margin:0">+${el.score*10} XP</p>`:`<p style="margin:0">Lektion gelesen.</p>`}
      <div class="row" style="justify-content:center;margin-top:8px">
        <button class="btn" id="rep">${n?"Wiederholen":"Nochmals lesen"}</button>
        ${nextI!==undefined?'<button class="btn primary" id="nx">Nächste Lektion</button>':'<button class="btn primary" id="fin">Zur Einheit</button>'}
      </div></div>`;
  }
  app.innerHTML=`<div class="row" style="justify-content:space-between"><button class="back" id="bk">← ${eLabel(u)}</button><span class="small muted">${el.step<0?"Erklärung":el.step<n?"Aufgabe "+(el.step+1)+" von "+n:"Fertig"}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>${body}`;
  app.querySelector("#bk").onclick=up;
  const finish=()=>{S.lessons[L.id]={done:true,score:el.score,of:n,date:Date.now()};S.xp=(S.xp||0)+el.score*10;touchDay();save();};
  const g=app.querySelector("#go");if(g)g.onclick=()=>{el.step=0;el.answered=false;if(!n){el.step=n;finish();}render();};
  if(el.step>=0&&el.step<n){
    const a=A[el.step];
    eAufgabe(app.querySelector("#qc"),a,{nextLabel:el.step+1<n?"Nächste Aufgabe":"Auswertung",
      onAnswer:right=>{el.answered=true;if(right)el.score++;const s=S.aufg[a.id]||{r:0,w:0};S.aufg[a.id]={r:s.r+(right?1:0),w:s.w+(right?0:1),last:Date.now()};touchDay();save();
        const p=app.querySelector(".progress>i");if(p)p.style.width=(100*(el.step+1)/n)+"%";},
      onNext:()=>{el.step++;el.answered=false;if(el.step>=n)finish();render();window.scrollTo(0,0);}});
  }
  const rp=app.querySelector("#rep");if(rp)rp.onclick=()=>startELektion(u,el.i,sec);
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>startELektion(u,nextI,sec);
  const fi=app.querySelector("#fin");if(fi)fi.onclick=()=>go({tab:"theorie",einheit:u.id,von:view.von,abschnitt:sec});
}
// Kontext für «Frag Claude»
window.__dcScope=v=>{const u=EINH.byId[v.einheit];if(!u)return {k:"einheit",label:"Einheit"};
  if(v.el){const L=u.lektionen[v.el.i];return {k:"einheit~"+u.id+"~"+L.id,label:eLabel(u)+" · Lektion „"+L.titel+"“"};}
  return {k:"einheit~"+u.id,label:eLabel(u)+" · "+u.titel};};
window.__dcCtx=v=>{const u=EINH.byId[v.einheit];let c="Ansicht: Theorie/Üben, Einheit "+(u?eLabel(u)+" („"+u.titel+"“)":"");
  if(u&&v.el){const L=u.lektionen[v.el.i];c+=", Lektion „"+L.titel+"“";const A=L.aufgaben||[];if(v.el.step>=0&&v.el.step<A.length)c+=", aktuelle Aufgabe: "+eFrage(A[v.el.step]);}return c;};

// ---------- Start ----------
{const h=location.hash.slice(1);if(TABS.includes(h))view={tab:h};try{history.replaceState({n:0},"","#"+view.tab);}catch(e){}}
render();
initSync();
eLoad();
</script>
</body>
</html>
