<meta charset="utf-8">

<title>Mechanik und Werkstoffkunde – Digital Campus</title>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: Kopfzeile mit Tabs → Dashboard (Termine | Fächer | Zuletzt) oder Fachansicht (Einheiten → Lektionen). Single theme: dark. */
:root, [data-theme="mechanik-werkstoffkunde"] {
  --dc-bg: #131211;
  --dc-surface: #1b1918;
  --dc-surface-2: #24211f;
  --dc-line: #322d2a;
  --dc-text: #ede7e3;
  --dc-muted: #9d938e;
  --dc-accent: #daa198;
  --dc-on-accent: #1d1311;
  --dc-warn: #d8b86a;
  --dc-ok: #8fbf9a;
  --dc-font: "Bricolage Grotesque", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --dc-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --dc-radius: 10px;
  --dc-gap: 16px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--dc-bg); color: var(--dc-text);
  font-family: var(--dc-font); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: 1.75rem; line-height: 1.2; }
h2 { font-size: 1.05rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
a { color: var(--dc-accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--dc-accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--dc-mono); font-size: 0.85em; }
.muted { color: var(--dc-muted); }
.num { font-variant-numeric: tabular-nums; }

/* Kopfzeile */
.top {
  position: sticky; top: 0; z-index: 5;
  background: var(--dc-bg); border-bottom: 1px solid var(--dc-line);
}
.top-inner {
  max-width: 1080px; margin: 0 auto; padding: 0 20px;
  display: flex; align-items: center; gap: 24px; min-height: 56px;
}
.brand { display: flex; align-items: baseline; gap: 8px; font-weight: 600; white-space: nowrap; }
.brand .mono { color: var(--dc-muted); font-weight: 400; }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tab {
  background: none; border: 0; padding: 16px 12px 14px; cursor: pointer;
  color: var(--dc-muted); border-bottom: 2px solid transparent; font-weight: 500;
}
.tab:hover { color: var(--dc-text); }
.tab[aria-current="page"] { color: var(--dc-text); border-bottom-color: var(--dc-accent); }

main { max-width: 1080px; margin: 0 auto; padding: 28px 20px 64px; display: grid; gap: 28px; }

/* Bausteine */
.panel {
  background: var(--dc-surface); border: 1px solid var(--dc-line);
  border-radius: var(--dc-radius); padding: 20px; display: grid; gap: 14px; align-content: start;
}
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.btn {
  border: 1px solid var(--dc-line); background: var(--dc-surface-2);
  padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500;
}
.btn:hover { border-color: var(--dc-muted); }
.btn-primary { background: var(--dc-accent); color: var(--dc-on-accent); border-color: var(--dc-accent); }
.btn-primary:hover { filter: brightness(1.06); border-color: var(--dc-accent); }
.btn-ghost { background: none; border-color: transparent; color: var(--dc-muted); padding: 6px 8px; }
.btn-ghost:hover { color: var(--dc-text); border-color: transparent; }
.link-btn { background: none; border: 0; padding: 0; color: var(--dc-accent); cursor: pointer; font-weight: 500; }
.empty {
  border: 1px dashed var(--dc-line); border-radius: 8px; padding: 18px;
  color: var(--dc-muted); font-size: 0.95rem;
}
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px;
  border-radius: 999px; font-size: 0.78rem; border: 1px solid var(--dc-line); color: var(--dc-muted);
  white-space: nowrap;
}
.chip.warn { color: var(--dc-warn); border-color: color-mix(in srgb, var(--dc-warn) 45%, transparent); }
.chip.ok { color: var(--dc-ok); border-color: color-mix(in srgb, var(--dc-ok) 45%, transparent); }
.bar { height: 4px; background: var(--dc-surface-2); border-radius: 4px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--dc-accent); border-radius: 4px; }

/* Dashboard */
.hello { display: grid; gap: 4px; }
.dash { display: grid; grid-template-columns: 1.15fr 1fr; gap: var(--dc-gap); align-items: start; }
.dash .col { display: grid; gap: var(--dc-gap); }
.termine { list-style: none; margin: 0; padding: 0; display: grid; }
.termin {
  display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center;
  padding: 12px 0; border-top: 1px solid var(--dc-line);
}
.termin:first-child { border-top: 0; padding-top: 0; }
.date { text-align: center; line-height: 1.1; }
.date b { display: block; font-size: 1.35rem; font-weight: 600; }
.date span { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dc-muted); }
.termin-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 0.85rem; color: var(--dc-muted); }
form.add { display: grid; grid-template-columns: 1fr 150px; gap: 10px; }
form.add .full { grid-column: 1 / -1; }
form.add .actions { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; }
label.f { display: grid; gap: 4px; font-size: 0.82rem; color: var(--dc-muted); }
input, select {
  background: var(--dc-bg); border: 1px solid var(--dc-line); border-radius: 8px;
  padding: 8px 10px; min-width: 0; width: 100%;
}
input:focus, select:focus { border-color: var(--dc-accent); outline: none; }

.fach-card {
  display: grid; gap: 10px; padding: 16px; border: 1px solid var(--dc-line);
  border-radius: 8px; background: var(--dc-surface-2); text-align: left; cursor: pointer; width: 100%;
}
.fach-card:hover { border-color: var(--dc-muted); }
.fach-card .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.fach-card.placeholder { cursor: default; background: none; border-style: dashed; color: var(--dc-muted); }
.fach-card.placeholder:hover { border-color: var(--dc-line); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { border: 1px solid var(--dc-line); border-radius: 8px; padding: 12px; }
.stat b { display: block; font-size: 1.3rem; font-weight: 600; }
.stat span { font-size: 0.8rem; color: var(--dc-muted); }

/* Fachansicht */
.crumbs { display: flex; gap: 8px; align-items: center; font-size: 0.9rem; color: var(--dc-muted); flex-wrap: wrap; }
.crumbs button { background: none; border: 0; padding: 0; color: var(--dc-muted); cursor: pointer; }
.crumbs button:hover { color: var(--dc-text); }
.fach-head { display: grid; gap: 12px; }
.fach-head .bar { max-width: 420px; }
.einheiten { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.einheit {
  display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center;
  padding: 14px 16px; background: var(--dc-surface); border: 1px solid var(--dc-line);
  border-radius: 8px; width: 100%; text-align: left; cursor: pointer;
}
.einheit:hover { border-color: var(--dc-muted); }
.einheit.leer { background: none; border-style: dashed; }
.einheit .sw { font-family: var(--dc-mono); font-size: 0.85rem; color: var(--dc-muted); }
.einheit .titel { font-weight: 500; }
.einheit.leer .titel { color: var(--dc-muted); font-weight: 400; }
.einheit .mini { width: 72px; }

.lektionen { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.arten { display: flex; flex-wrap: wrap; gap: 8px; }
.legend { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.legend > div { border: 1px solid var(--dc-line); border-radius: 8px; padding: 12px; display: grid; gap: 4px; }
.legend .mono { color: var(--dc-accent); }

.foot { font-size: 0.8rem; color: var(--dc-muted); border-top: 1px solid var(--dc-line); padding-top: 16px; }

@media (max-width: 760px) {
  .dash { grid-template-columns: 1fr; }
  .top-inner { gap: 12px; }
  .brand .mono { display: none; }
  h1 { font-size: 1.45rem; }
}
@media (max-width: 420px) {
  form.add { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr 1fr 1fr; }
  .einheit { grid-template-columns: 48px 1fr; }
  .einheit .mini, .einheit .chip { grid-column: 2; justify-self: start; }
  .termin { grid-template-columns: 44px 1fr auto; gap: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.dc-home:hover,.dc-home:focus-visible{border-color:var(--dc-campus,#af9ee4)}

/* ---------- Einheit, Lektion, Aufgaben ---------- */
.subtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--dc-line); overflow-x: auto; }

.lesson-head { display: grid; gap: 8px; }
.lesson-head .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .85rem; color: var(--dc-muted); }

.box { border: 1px solid var(--dc-line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; }
.box.merke { border-left: 3px solid var(--dc-accent); }
.box .lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--dc-muted); font-weight: 600; }
.formel { overflow-x: auto; padding: 6px 0; text-align: center; font-size: 1.1rem; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--dc-line); border-radius: 8px; }

code { font-family: var(--dc-mono); font-size: .88em; }

      <button class="tab" id="tab-fach" data-go="fach"><span class="lang">Mechanik &amp; Werkstoffe</span><span class="kurz">Fach</span></button>
    </nav>
      <a class="dc-home" href="https://claude.ai/artifact/3nucn1BNbLGW39vSE3pUGQ" title="Zurück zum Dashboard – Digital Campus" aria-label="Zurück zum Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span>Dashboard</span></a>
  </div>
</header>
<main id="app" aria-live="polite"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js" defer></script>
<script>
"use strict";
/* ---------- Daten ---------- */
const FACH_ID = "mechanik-werkstoffkunde";
const FACH_FALLBACK = { id: FACH_ID, name: "Mechanik und Werkstoffkunde", wochen: 14, einheiten: [] };
let FACH = FACH_FALLBACK;
let BASIS = "content/" + FACH_ID + "/";
const EINHEITEN = {};            // id → Inhalt der Einheit (v2)
let BEREIT = false;

const ART_NAME = { verstaendnis: "Theorie", rechnen: "Rechnen", aufgabe: "Aufgabe", code: "Code", programmieren: "Programmieren", rechnung: "Rechnen", anwendung: "Aufgabe" };
const ABSCHNITT_VON_ART = { verstaendnis: "theorie", code: "schnellfragen", programmieren: "programmieren", rechnen: "ueben", aufgabe: "ueben", rechnung: "ueben", anwendung: "ueben" };
const ABSCHNITT_NAME = { theorie: "Theorie", schnellfragen: "Schnellfragen", programmieren: "Programmieren", ueben: "Üben" };
const ABSCHNITT_REIHE = ["theorie", "schnellfragen", "programmieren", "ueben"];

/* ---------- Lokaler Speicher (mit Fallback) ---------- */
const mem = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : (k in mem ? mem[k] : d); } catch (e) { return k in mem ? mem[k] : d; } },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const K_TERMINE = "dc-termine";
const K_PROGRESS = "dc-progress-" + FACH_ID;     // { "<einheit>/<lektion>": true }
const K_ANTW = "dc-antworten-" + FACH_ID;        // { aufgabeId: { ok: bool } }
const K_LAST = "dc-last-" + FACH_ID;
const K_TAB = "dc-tab-" + FACH_ID;

/* ---------- Hilfen ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MONATE = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const daysUntil = iso => Math.round((new Date(iso + "T00:00:00") - today()) / 864e5);
const swId = n => "sw" + String(n).padStart(2, "0");

function tex(s, disp) {
  if (window.katex) { try { return katex.renderToString(s, { displayMode: !!disp, throwOnError: false, output: "mathml" }); } catch (e) {} }
  return `<code>${esc(s)}</code>`;
}
/* Inline-Markdown: **fett**, `code`, $…$, $$…$$ */
function md(s) {
  const parts = [];
  let h = String(s == null ? "" : s)
    .replace(/\$\$([\s\S]+?)\$\$/g, (m, c) => { parts.push(tex(c, true)); return "\u0001" + (parts.length - 1) + "\u0001"; })
    .replace(/\$([^$\n]+?)\$/g, (m, c) => { parts.push(tex(c, false)); return "\u0001" + (parts.length - 1) + "\u0001"; });
  h = esc(h).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
  return h.replace(/\u0001(\d+)\u0001/g, (m, i) => parts[i]);
}
function quelleText(q) {
  if (!q) return [];
  if (typeof q === "string") return [q];
  return q.map(x => typeof x === "string" ? x : [x.text, x.stellen].filter(Boolean).join(" – "));
}
/* stabile Durchmischung pro Aufgabe (immer gleich, damit die Reihenfolge nicht springt) */
function seeded(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; }; }
function mischen(arr, key) { const r = seeded(key), a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const norm = s => String(s).toLowerCase().normalize("NFC").replace(/[’']/g, "").replace(/,/g, ".").replace(/\s+/g, " ").trim();
const zahl = s => { const t = String(s).replace(/[’'\s]/g, "").replace(",", "."); return t === "" ? NaN : Number(t); };

/* ---------- Fortschritt ---------- */
const lektionenVon = e => (e && e.lektionen) || [];
const aufgabenVon = l => l.aufgaben || (l.schritte || []).filter(s => s.typ !== "theorie");
const istFertig = (e, l) => !!store.get(K_PROGRESS, {})[e.id + "/" + l.id];
function setFertig(e, l, v) { const p = store.get(K_PROGRESS, {}); if (v) p[e.id + "/" + l.id] = true; else delete p[e.id + "/" + l.id]; store.set(K_PROGRESS, p); }
const antworten = () => store.get(K_ANTW, {});
function setAntwort(id, ok) { const a = antworten(); a[id] = { ok: !!ok, t: Date.now() }; store.set(K_ANTW, a); }
function alleEinheiten() { return (FACH.einheiten || []).map(x => EINHEITEN[x.id]).filter(Boolean); }
function fortschritt() {
  let done = 0, total = 0;
  for (const e of alleEinheiten()) for (const l of lektionenVon(e)) { total++; if (istFertig(e, l)) done++; }
  return { done, total, pct: total ? Math.round(done / total * 100) : 0 };
}
function einheitFortschritt(e) { const l = lektionenVon(e); const d = l.filter(x => istFertig(e, x)).length; return { done: d, total: l.length, pct: l.length ? Math.round(d / l.length * 100) : 0 }; }
function abschnittVon(l) { return l.abschnitt || ABSCHNITT_VON_ART[l.art] || "theorie"; }
function findeLektion(id) {
  for (const e of alleEinheiten()) { const i = lektionenVon(e).findIndex(l => l.id === id); if (i >= 0) return { e, l: e.lektionen[i], i }; }
  return null;
}
function naechsteOffene(e) { return lektionenVon(e).find(l => !istFertig(e, l)) || null; }

/* ---------- Routing (#dashboard, #fach, #<einheit>, #<lektion>) ---------- */
function go(view) { if (location.hash.slice(1) === view) render(); else location.hash = view; }
document.addEventListener("click", ev => { const b = ev.target.closest("[data-go]"); if (b) { ev.preventDefault(); go(b.dataset.go); } });
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

function render() {
  if (window.dcClaude) window.dcClaude.kontext = null;
  const h = location.hash.slice(1) || "dashboard";
  const isFach = h !== "dashboard";
  $("#tab-dashboard").toggleAttribute("aria-current", !isFach);
  $("#tab-fach").toggleAttribute("aria-current", isFach);
  if (isFach) $("#tab-fach").setAttribute("aria-current", "page"); else $("#tab-dashboard").setAttribute("aria-current", "page");
  if (h === "dashboard") return renderDashboard();
  if (h === "fach") return renderFach();
  if (EINHEITEN[h]) return renderEinheit(h);
  const f = findeLektion(h);
  if (f) return renderLektion(f);
  if (/^sw\d{2}/.test(h)) return renderLeereWoche(h);
  renderDashboard();
}

/* ---------- Dashboard ---------- */
function renderDashboard() {
  const d = new Date();
  const datum = d.toLocaleDateString("de-CH", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const f = fortschritt();
  const termine = store.get(K_TERMINE, []).filter(t => daysUntil(t.datum) >= 0).sort((a, b) => a.datum.localeCompare(b.datum));
  const last = store.get(K_LAST, null);
  const bereit = (FACH.einheiten || []).filter(x => EINHEITEN[x.id]).length;

  $("#app").innerHTML = `
    <section class="hello">
      <p class="muted">${esc(datum)}</p>
      <h1>Dein Lernüberblick</h1>
    </section>
    <div class="dash">
      <div class="col">
        <section class="panel" aria-labelledby="h-termine">
          <div class="panel-head">
            <h2 id="h-termine">Nächste Termine</h2>
            <button class="btn" id="btn-add">Termin hinzufügen</button>
          </div>
          <div id="add-slot"></div>
          ${termine.length ? `<ul class="termine">${termine.map(terminHtml).join("")}</ul>`
            : `<div class="empty">Noch keine Termine. Trag Tests, Abgaben und Fristen ein, dann erscheinen sie hier nach Datum sortiert.</div>`}
        </section>
      </div>
      <div class="col">
        <section class="panel" aria-labelledby="h-faecher">
          <div class="panel-head"><h2 id="h-faecher">Fach</h2><span class="muted num">${f.pct} %</span></div>
          <button class="fach-card" data-go="fach">
            <div class="row"><h3>${esc(FACH.name)}</h3><span class="mono muted">${esc(FACH.kurz || "")}</span></div>
            <div class="bar" role="progressbar" aria-label="Fortschritt" aria-valuenow="${f.pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${f.pct}%"></span></div>
            <div class="row"><span class="muted">${bereit} ${bereit === 1 ? "Einheit" : "Einheiten"} bereit · ${f.done}/${f.total} Lektionen</span><span class="link-btn">Öffnen</span></div>
          </button>
        </section>
        <section class="panel" aria-labelledby="h-stand">
          <h2 id="h-stand">Weitermachen</h2>
          ${last ? `<p>Zuletzt: <button class="link-btn" data-go="${esc(last.id)}">${esc(last.titel)}</button></p>`
            : `<div class="empty">Sobald du eine Lektion startest, kannst du hier direkt weitermachen.</div>`}
          ${last ? `<div><button class="btn btn-primary" data-go="${esc(last.id)}">Weiterlernen</button></div>` : ""}
        </section>
      </div>
    </div>
    <p class="foot">Fortschritt und Termine werden nur in diesem Browser gespeichert.</p>`;

  $("#btn-add").addEventListener("click", showAddForm);
  $("#app").querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    store.set(K_TERMINE, store.get(K_TERMINE, []).filter(t => t.id !== b.dataset.del)); renderDashboard();
  }));
}
function terminHtml(t) {
  const d = new Date(t.datum + "T00:00:00");
  const n = daysUntil(t.datum);
  const wann = n === 0 ? "heute" : n === 1 ? "morgen" : `in ${n} Tagen`;
  return `<li class="termin">
    <div class="date"><b class="num">${d.getDate()}</b><span>${MONATE[d.getMonth()]}</span></div>
    <div style="display:grid;gap:2px;min-width:0">
      <span style="overflow-wrap:anywhere">${esc(t.titel)}</span>
      <div class="termin-meta"><span class="chip ${n <= 3 ? "warn" : ""}">${wann}</span><span>${esc(t.art)}</span></div>
    </div>
    <button class="btn btn-ghost" data-del="${esc(t.id)}" aria-label="Termin ${esc(t.titel)} löschen">Löschen</button>
  </li>`;
}
function showAddForm() {
  const slot = $("#add-slot");
  if (slot.firstChild) { slot.innerHTML = ""; return; }
  const iso = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);
  slot.innerHTML = `<form class="add" id="form-termin">
    <label class="f full" for="t-titel">Titel<input id="t-titel" required placeholder="z. B. Zwischentest Werkstoffe"></label>
    <label class="f" for="t-art">Art<select id="t-art"><option>Test</option><option>Abgabe</option><option>Vorlesung</option><option>Sonstiges</option></select></label>
    <label class="f" for="t-datum">Datum<input id="t-datum" type="date" required value="${iso}"></label>
    <div class="actions"><button type="button" class="btn btn-ghost" id="t-cancel">Abbrechen</button><button class="btn" type="submit">Speichern</button></div>
  </form>`;
  $("#t-titel").focus();
  $("#t-cancel").addEventListener("click", () => slot.innerHTML = "");
  $("#form-termin").addEventListener("submit", ev => {
    ev.preventDefault();
    const t = { id: String(Date.now()), titel: $("#t-titel").value.trim(), art: $("#t-art").value, datum: $("#t-datum").value };
    if (!t.titel || !t.datum) return;
    store.set(K_TERMINE, [...store.get(K_TERMINE, []), t]);
    renderDashboard();
  });
}

/* ---------- Fachansicht ---------- */
function wochenSlots() {
  const slots = [];
  for (let i = 1; i <= (FACH.wochen || 14); i++) {
    const eintraege = (FACH.einheiten || []).filter(x => x.woche === i || (x.woche == null && x.id.startsWith(swId(i) + "-")));
    if (eintraege.length) eintraege.forEach(x => slots.push({ nr: i, eintrag: x }));
    else slots.push({ nr: i, eintrag: null });
  }
  return slots;
}
function renderFach() {
  const f = fortschritt();
  const weiter = alleEinheiten().find(e => naechsteOffene(e));
  $("#app").innerHTML = `
    <nav class="crumbs" aria-label="Pfad"><button data-go="dashboard">Übersicht</button><span>/</span><span>${esc(FACH.name)}</span></nav>
    <section class="fach-head">
      <h1>${esc(FACH.name)}</h1>
      <p class="muted">Statik, Festigkeitslehre und Werkstoffe. Eine Einheit pro Semesterwoche, Lektionen à 3–5 Minuten.</p>
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
        <div class="bar" style="flex:1;min-width:180px" role="progressbar" aria-label="Fortschritt im Fach" aria-valuenow="${f.pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${f.pct}%"></span></div>
        <span class="muted num">${f.done}/${f.total} Lektionen · ${f.pct} %</span>
        ${weiter ? `<button class="btn btn-primary" data-go="${esc(naechsteOffene(weiter).id)}">Weiterlernen</button>` : ""}
      </div>
    </section>
    <section class="panel" aria-labelledby="h-einheiten">
      <div class="panel-head"><h2 id="h-einheiten">Semesterwochen</h2><span class="muted num">${alleEinheiten().length} bereit</span></div>
      <ul class="einheiten">${wochenSlots().map(einheitHtml).join("")}</ul>
    </section>
    ${BEREIT ? "" : `<p class="muted">Inhalte werden geladen …</p>`}`;
}
function einheitHtml(s) {
  const sw = swId(s.nr).toUpperCase();
  if (!s.eintrag) {
    return `<li><div class="einheit leer"><span class="sw">${sw}</span><span class="titel">Thema folgt</span><span class="chip">noch kein Inhalt</span></div></li>`;
  }
  const x = s.eintrag, e = EINHEITEN[x.id];
  if (!e) {
    return `<li><div class="einheit geplant"><span class="sw">${sw}</span><span class="titel">${esc(x.titel)}</span><span class="chip">${esc(x.status === "geplant" ? "geplant" : x.status)}</span></div></li>`;
  }
  const p = einheitFortschritt(e);
  return `<li><button class="einheit" data-go="${esc(e.id)}">
    <span class="sw">${sw}</span>
    <span style="display:grid;gap:2px"><span class="titel">${esc(e.titel || e.id)}</span><span class="muted" style="font-size:.85rem">${p.total} Lektionen · ca. ${lektionenVon(e).reduce((a, l) => a + (l.dauer_min || 4), 0)} min</span></span>
    <span style="display:grid;gap:6px;justify-items:end">${p.pct === 100 ? `<span class="chip ok">fertig</span>` : `<span class="muted num">${p.pct} %</span>`}<span class="bar mini"><span style="width:${p.pct}%"></span></span></span>
  </button></li>`;
}
function renderLeereWoche(id) {
  $("#app").innerHTML = `
    <nav class="crumbs" aria-label="Pfad"><button data-go="dashboard">Übersicht</button><span>/</span><button data-go="fach">${esc(FACH.name)}</button><span>/</span><span class="mono">${esc(id.slice(0, 4).toUpperCase())}</span></nav>
    <div class="empty">Für diese Woche gibt es noch keine Lektionen. Sie werden aus dem Schulmaterial erstellt und erscheinen dann hier.</div>
    <div><button class="btn" data-go="fach">Zurück zur Übersicht</button></div>`;
}

/* ---------- Einheit ---------- */
function renderEinheit(id) {
  const e = EINHEITEN[id];
  const lekt = lektionenVon(e);
  const vorhanden = ABSCHNITT_REIHE.filter(a => lekt.some(l => abschnittVon(l) === a));
  const tabs = store.get(K_TAB, {});
  let aktiv = vorhanden.includes(tabs[id]) ? tabs[id] : vorhanden[0];
  const p = einheitFortschritt(e);
  const weiter = naechsteOffene(e);
  const quellen = quelleText(e.quelle);
  $("#app").innerHTML = `
    <nav class="crumbs" aria-label="Pfad"><button data-go="dashboard">Übersicht</button><span>/</span><button data-go="fach">${esc(FACH.name)}</button><span>/</span><span class="mono">SW${esc(String(e.woche || "").padStart(2, "0"))}</span></nav>
    <section class="fach-head">
      ${e.untertitel ? `<p class="muted">${esc(e.untertitel)}</p>` : ""}
      <h1>${esc(e.titel)}</h1>
      ${e.beschreibung ? `<p>${esc(e.beschreibung)}</p>` : ""}
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
        <div class="bar" style="flex:1;min-width:180px" role="progressbar" aria-label="Fortschritt in der Einheit" aria-valuenow="${p.pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${p.pct}%"></span></div>
        <span class="muted num">${p.done}/${p.total} Lektionen · ${p.pct} %</span>
        ${weiter ? `<button class="btn btn-primary" data-go="${esc(weiter.id)}">${p.done ? "Weiterlernen" : "Starten"}</button>` : `<span class="chip ok">alles erledigt</span>`}
      </div>
    </section>
    <section class="panel" aria-label="Lektionen">
      <div class="subtabs" role="tablist">${vorhanden.map(a => {
        const n = lekt.filter(l => abschnittVon(l) === a);
        const d = n.filter(l => istFertig(e, l)).length;
        return `<button class="subtab" role="tab" data-tab="${a}" aria-selected="${a === aktiv}">${ABSCHNITT_NAME[a]}<span class="num">${d}/${n.length}</span></button>`;
      }).join("")}</div>
      <ul class="lektionen" id="lek-liste"></ul>
    </section>
    ${quellen.length ? `<section class="panel"><h2>Quellen</h2><ul class="quellen">${quellen.map(q => `<li>${esc(q)}</li>`).join("")}</ul></section>` : ""}
    <div><button class="btn" data-go="fach">Zurück zur Übersicht</button></div>`;
  const liste = () => {
    $("#lek-liste").innerHTML = lekt.map((l, i) => ({ l, i })).filter(x => abschnittVon(x.l) === aktiv).map(({ l, i }) => {
      const fertig = istFertig(e, l);
      const n = aufgabenVon(l).length;
      return `<li><button class="lek" data-go="${esc(l.id)}">
        <span class="nr ${fertig ? "done" : ""}" aria-label="${fertig ? "erledigt" : "offen"}">${fertig ? "✓" : i + 1}</span>
        <span style="display:grid;gap:2px;min-width:0"><span>${esc(l.titel)}</span><span class="meta"><span>${esc(ART_NAME[l.art] || l.art)}</span>${n ? `<span>${n} ${n === 1 ? "Übung" : "Übungen"}</span>` : ""}</span></span>
        <span class="muted num" style="font-size:.85rem">${l.dauer_min ? l.dauer_min + " min" : ""}</span>
      </button></li>`;
    }).join("");
  };
  liste();
  $("#app").querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => {
    aktiv = b.dataset.tab; const t = store.get(K_TAB, {}); t[id] = aktiv; store.set(K_TAB, t);
    $("#app").querySelectorAll("[data-tab]").forEach(x => x.setAttribute("aria-selected", x === b));
    liste();
  }));
}

/* ---------- Lektion ---------- */
function bildSrc(src) { return /^(https?:|data:|blob:|\/)/.test(src) ? src : BASIS + src; }
function bausteinHtml(b) {
  switch (b.typ) {
    case "titel": return `<h3>${md(b.text)}</h3>`;
    case "text": return `<p>${md(b.text)}</p>`;
    case "liste": return `<div>${b.titel ? `<p class="listentitel">${md(b.titel)}</p>` : ""}<ul>${(b.punkte || []).map(p => `<li>${md(p)}</li>`).join("")}</ul></div>`;
    case "formel": return `<div class="formel">${tex(b.tex || b.text || "", true)}</div>`;
    case "merke": return `<div class="box merke"><span class="lbl">Merke</span><p>${md(b.text)}</p></div>`;
    case "hinweis": return `<div class="box"><span class="lbl">Hinweis</span><p>${md(b.text)}</p></div>`;
    case "tabelle": return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${(b.kopf || []).map(k => `<th>${md(k)}</th>`).join("")}</tr></thead><tbody>${(b.zeilen || []).map(z => `<tr>${z.map(c => `<td>${md(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    case "bild": return `<figure class="bild"><img src="${esc(bildSrc(b.src))}" alt="${esc(b.alt || "")}" loading="lazy" data-src="${esc(b.src)}"><figcaption>${esc(b.alt || "")}</figcaption></figure>`;
    case "code": return `<pre class="box"><code>${esc(b.code)}</code></pre>`;
    default: return b.text ? `<p>${md(b.text)}</p>` : "";
  }
}
/* Bilder der Lektion notfalls als Blob laden (falls die Seite Pfade anders auflöst) */
function bilderNachladen(root) {
  root.querySelectorAll("img[data-src]").forEach(img => {
    img.addEventListener("error", async () => {
      if (img.dataset.versucht) return; img.dataset.versucht = "1";
      for (const b of ["content/" + FACH_ID + "/", "../../content/" + FACH_ID + "/"]) {
        try { const r = await fetch(b + img.dataset.src); if (r.ok) { img.src = URL.createObjectURL(await r.blob()); return; } } catch (e) {}
      }
    }, { once: false });
  });
}

function renderLektion({ e, l, i }) {
  store.set(K_LAST, { id: l.id, titel: l.titel });
  const lekt = lektionenVon(e);
  const vor = lekt[i - 1], nach = lekt[i + 1];
  const auf = aufgabenVon(l);
  const q = quelleText(l.quelle);
  $("#app").innerHTML = `
    <nav class="crumbs" aria-label="Pfad"><button data-go="fach">${esc(FACH.name)}</button><span>/</span><button data-go="${esc(e.id)}">SW${esc(String(e.woche || "").padStart(2, "0"))} ${esc(e.titel.split(":")[0])}</button><span>/</span><span class="mono">L${i + 1}/${lekt.length}</span></nav>
    <article class="lesson">
      <header class="lesson-head">
        <div class="meta"><span class="chip">${esc(ABSCHNITT_NAME[abschnittVon(l)])}</span>${l.dauer_min ? `<span>ca. ${l.dauer_min} min</span>` : ""}<span id="fertig-chip">${istFertig(e, l) ? `<span class="chip ok">erledigt</span>` : ""}</span></div>
        <h1>${esc(l.titel)}</h1>
        ${q.length ? `<p class="muted" style="font-size:.85rem">Quelle: ${esc(q.join("; "))}</p>` : ""}
      </header>
      ${(l.inhalt || []).length ? `<section class="theorie">${l.inhalt.map(bausteinHtml).join("")}</section>` : ""}
      ${auf.length ? `
        <div class="uebungen-head"><h2>${(l.inhalt || []).length ? "Kurz üben" : "Übungen"}</h2><span class="score" id="score"></span></div>
        <div class="aufgaben">${auf.map((a, k) => aufgabeHtml(a, k, auf.length)).join("")}</div>` : ""}
      <footer class="lesson-foot">
        <div class="aktionen">
          ${vor ? `<button class="btn" data-go="${esc(vor.id)}">‹ Zurück</button>` : `<button class="btn" data-go="${esc(e.id)}">‹ Einheit</button>`}
          ${auf.length ? `<button class="btn btn-ghost" id="reset">Übungen zurücksetzen</button>` : ""}
        </div>
        <div class="aktionen">
          ${!auf.length ? `<button class="btn" id="gelesen">${istFertig(e, l) ? "Als ungelesen markieren" : "Als gelesen markieren"}</button>` : ""}
          ${nach ? `<button class="btn btn-primary" data-go="${esc(nach.id)}">Nächste Lektion ›</button>` : `<button class="btn btn-primary" data-go="${esc(e.id)}">Einheit abschliessen</button>`}
        </div>
      </footer>
    </article>`;
  bilderNachladen($("#app"));
  auf.forEach(a => aufgabeVerdrahten(a, () => lektionPruefen(e, l)));
  lektionPruefen(e, l);
  const g = $("#gelesen");
  if (g) g.addEventListener("click", () => { setFertig(e, l, !istFertig(e, l)); renderLektion({ e, l, i }); });
  const r = $("#reset");
  if (r) r.addEventListener("click", () => {
    const a = antworten(); auf.forEach(x => delete a[x.id]); store.set(K_ANTW, a); setFertig(e, l, false); renderLektion({ e, l, i });
  });
  window.dcClaude = Object.assign(window.dcClaude || {}, { kontext: () => ({ stufe: `${e.titel.split(":")[0]} · ${l.titel}`, schluessel: l.id }) });
}
function lektionPruefen(e, l) {
  const auf = aufgabenVon(l); if (!auf.length) return;
  const a = antworten();
  const beantwortet = auf.filter(x => a[x.id]).length, richtig = auf.filter(x => a[x.id] && a[x.id].ok).length;
  const s = $("#score"); if (s) s.textContent = `${beantwortet}/${auf.length} gelöst · ${richtig} richtig`;
  if (beantwortet === auf.length && !istFertig(e, l)) { setFertig(e, l, true); const c = $("#fertig-chip"); if (c) c.innerHTML = `<span class="chip ok">erledigt</span>`; }
}

/* ---------- Aufgaben ---------- */
const TYP_NAME = { multiple_choice: "Auswahl", wahr_falsch: "Wahr oder falsch", lueckentext: "Lückentext", zuordnen: "Zuordnen", reihenfolge: "Reihenfolge", rechnung: "Rechnen", freitext: "Selbst beantworten", karteikarte: "Karteikarte" };
function aufgabeHtml(a, k, n) {
  return `<section class="aufgabe" id="a-${esc(a.id)}" aria-label="Übung ${k + 1}">
    <div class="kopf"><span>${k + 1}/${n} · ${esc(TYP_NAME[a.typ] || a.typ)}</span></div>
    <div class="koerper"></div>
    <div class="rm" hidden></div>
  </section>`;
}
function rueckmeldung(box, a, ok, extra) {
  const rm = box.querySelector(".rm");
  const verdikt = ok === null ? "" : `<p class="verdikt ${ok ? "ok" : "falsch"}">${ok ? "Richtig." : "Noch nicht ganz."}</p>`;
  const weg = a.loesungsweg ? (Array.isArray(a.loesungsweg) ? `<ol>${a.loesungsweg.map(s => `<li>${md(s)}</li>`).join("")}</ol>` : `<p>${md(a.loesungsweg)}</p>`) : "";
  const q = quelleText(a.quelle);
  const frage = (a.frage || a.aussage || a.text || a.vorne || "").replace(/\*\*/g, "");
  rm.innerHTML = verdikt + (extra || "") + weg + (a.erklaerung ? `<p>${md(a.erklaerung)}</p>` : "") +
    `<div class="aktionen">${q.length ? `<span class="q">Quelle: ${esc(q.join("; "))}</span>` : ""}
     <button type="button" class="dc-ask" data-dc-ask="${esc("Ich verstehe diese Übung bzw. die Lösung noch nicht ganz. Kannst du es mir Schritt für Schritt erklären?\n\nÜbung: " + frage)}">Claude fragen</button></div>`;
  rm.hidden = false;
  box.classList.remove("ok", "falsch");
  if (ok !== null) box.classList.add(ok ? "ok" : "falsch");
}
function aufgabeVerdrahten(a, fertig) {
  const box = document.getElementById("a-" + a.id);
  const k = box.querySelector(".koerper");
  const alt = antworten()[a.id];
  const melden = (ok, extra) => { setAntwort(a.id, ok); rueckmeldung(box, a, ok, extra); fertig(); };

  if (a.typ === "multiple_choice") {
    const reihe = mischen(a.optionen.map((o, idx) => ({ o, idx })), a.id);
    k.innerHTML = `<p class="frage">${md(a.frage)}</p><div class="opts">${reihe.map(x => `<button type="button" class="opt" data-i="${x.idx}">${md(x.o)}</button>`).join("")}</div>`;
    const zeigen = gew => {
      k.querySelectorAll(".opt").forEach(b => { b.disabled = true; const idx = +b.dataset.i; if (idx === a.richtig) b.classList.add("richtig"); else if (idx === gew) b.classList.add("gewaehlt-falsch"); });
    };
    k.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => { const g = +b.dataset.i; zeigen(g); melden(g === a.richtig); }));
    if (alt) { zeigen(-1); rueckmeldung(box, a, alt.ok); }
  }
  else if (a.typ === "wahr_falsch") {
    k.innerHTML = `<p class="frage">${md(a.aussage)}</p><div class="wf"><button type="button" class="opt" data-v="1">Wahr</button><button type="button" class="opt" data-v="0">Falsch</button></div>`;
    const zeigen = gew => k.querySelectorAll(".opt").forEach(b => { b.disabled = true; const v = b.dataset.v === "1"; if (v === a.richtig) b.classList.add("richtig"); else if (v === gew) b.classList.add("gewaehlt-falsch"); });
    k.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => { const v = b.dataset.v === "1"; zeigen(v); melden(v === a.richtig); }));
    if (alt) { zeigen(null); rueckmeldung(box, a, alt.ok); }
  }
  else if (a.typ === "lueckentext") {
    let n = 0;
    const html = md(a.text).replace(/___/g, () => `<input class="luecke" data-n="${n++}" aria-label="Lücke ${n}" autocomplete="off" autocapitalize="off" spellcheck="false">`);
    k.innerHTML = `<p class="frage" style="font-weight:400;line-height:2.1">${html}</p><div class="aktionen"><button type="button" class="btn pruefen">Prüfen</button></div>`;
    const pruefen = () => {
      let alle = true;
      k.querySelectorAll(".luecke").forEach(inp => {
        const soll = [].concat(a.antworten[+inp.dataset.n] || []);
        const ok = soll.some(s => norm(s) === norm(inp.value));
        inp.classList.toggle("ok", ok); inp.classList.toggle("falsch", !ok); alle = alle && ok;
      });
      const loes = `<p>Lösung: ${a.antworten.map(x => `<b>${esc([].concat(x)[0])}</b>`).join(", ")}</p>`;
      melden(alle, alle ? "" : loes);
    };
    k.querySelector(".pruefen").addEventListener("click", pruefen);
    k.querySelectorAll(".luecke").forEach(inp => inp.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); pruefen(); } }));
    if (alt) rueckmeldung(box, a, alt.ok, `<p>Lösung: ${a.antworten.map(x => `<b>${esc([].concat(x)[0])}</b>`).join(", ")}</p>`);
  }
  else if (a.typ === "zuordnen") {
    const rechts = mischen([...new Set(a.paare.map(p => p[1]))], a.id + "r");
    const links = mischen(a.paare.map((p, idx) => ({ p, idx })), a.id + "l");
    k.innerHTML = `<p class="frage">${md(a.frage || "Ordne zu.")}</p><div style="display:grid;gap:8px">${links.map(({ p, idx }) => `
      <label class="zu-row"><span class="l">${md(p[0])}</span><select data-i="${idx}"><option value="">– wählen –</option>${rechts.map(r => `<option>${esc(r)}</option>`).join("")}</select></label>`).join("")}</div>
      <div class="aktionen"><button type="button" class="btn pruefen">Prüfen</button></div>`;
    const loes = `<ul>${a.paare.map(p => `<li>${md(p[0])} → <b>${md(p[1])}</b></li>`).join("")}</ul>`;
    k.querySelector(".pruefen").addEventListener("click", () => {
      let alle = true;
      k.querySelectorAll("select").forEach(s => { const ok = s.value === a.paare[+s.dataset.i][1]; s.classList.toggle("ok", ok); s.classList.toggle("falsch", !ok); alle = alle && ok; });
      melden(alle, alle ? "" : loes);
    });
    if (alt) rueckmeldung(box, a, alt.ok, alt.ok ? "" : loes);
  }
  else if (a.typ === "reihenfolge") {
    let ord = mischen(a.elemente.map((t, idx) => idx), a.id);
    if (ord.every((v, idx) => v === idx) && ord.length > 1) ord = ord.slice().reverse();
    const zeichnen = (markieren) => {
      k.innerHTML = `<p class="frage">${md(a.frage || "Bring in die richtige Reihenfolge.")}</p><ol class="rf">${ord.map((idx, pos) => `
        <li class="${markieren ? (idx === pos ? "ok" : "falsch") : ""}"><span class="pos">${pos + 1}</span><span>${md(a.elemente[idx])}</span>
        <button type="button" class="btn" data-up="${pos}" aria-label="nach oben" ${pos === 0 ? "disabled" : ""}>↑</button>
        <button type="button" class="btn" data-down="${pos}" aria-label="nach unten" ${pos === ord.length - 1 ? "disabled" : ""}>↓</button></li>`).join("")}</ol>
        <div class="aktionen"><button type="button" class="btn pruefen">Prüfen</button></div>`;
      k.querySelectorAll("[data-up]").forEach(b => b.addEventListener("click", () => { const p = +b.dataset.up; [ord[p - 1], ord[p]] = [ord[p], ord[p - 1]]; zeichnen(false); k.querySelector(`[data-up="${p - 1}"]`)?.focus() || k.querySelector(`[data-down="${p - 1}"]`)?.focus(); }));
      k.querySelectorAll("[data-down]").forEach(b => b.addEventListener("click", () => { const p = +b.dataset.down; [ord[p + 1], ord[p]] = [ord[p], ord[p + 1]]; zeichnen(false); k.querySelector(`[data-down="${p + 1}"]`)?.focus() || k.querySelector(`[data-up="${p + 1}"]`)?.focus(); }));
      k.querySelector(".pruefen").addEventListener("click", () => {
        const ok = ord.every((idx, pos) => idx === pos); zeichnen(true);
        melden(ok, ok ? "" : `<ol>${a.elemente.map(t => `<li>${md(t)}</li>`).join("")}</ol>`);
      });
    };
    zeichnen(false);
    if (alt) rueckmeldung(box, a, alt.ok, alt.ok ? "" : `<ol>${a.elemente.map(t => `<li>${md(t)}</li>`).join("")}</ol>`);
  }
  else if (a.typ === "rechnung" || a.typ === "rechnen") {
    const ein = a.einheit ? `<span>${md(a.einheit)}</span>` : "";
    k.innerHTML = `<p class="frage">${md(a.frage)}</p><div class="re"><input type="text" inputmode="decimal" aria-label="Ergebnis" placeholder="Ergebnis" autocomplete="off">${ein}<button type="button" class="btn pruefen">Prüfen</button><button type="button" class="btn btn-ghost zeigen">Lösung zeigen</button></div>`;
    const inp = k.querySelector("input");
    const soll = Number(a.loesung), tol = a.toleranz != null ? Number(a.toleranz) : 0.01;
    const loes = `<p>Lösung: <b>${esc(String(a.loesung).replace(".", "."))}${a.einheit ? " " + esc(a.einheit) : ""}</b></p>`;
    const pruefen = () => {
      const x = zahl(inp.value); if (isNaN(x)) { inp.focus(); return; }
      const ok = Math.abs(x - soll) <= Math.max(Math.abs(soll) * tol, soll === 0 ? tol : 0) + 1e-9;
      inp.classList.toggle("ok", ok); inp.classList.toggle("falsch", !ok);
      melden(ok, ok ? "" : loes);
    };
    k.querySelector(".pruefen").addEventListener("click", pruefen);
    inp.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); pruefen(); } });
    k.querySelector(".zeigen").addEventListener("click", () => melden(false, loes));
    if (alt) rueckmeldung(box, a, alt.ok, loes);
  }
  else if (a.typ === "freitext") {
    k.innerHTML = `<div class="frage">${md(a.frage)}</div><textarea class="ft" aria-label="Deine Antwort" placeholder="Deine Antwort in Stichworten …"></textarea>
      <div class="aktionen"><button type="button" class="btn zeigen">Musterantwort zeigen</button></div>`;
    const ta = k.querySelector("textarea");
    const kEntwurf = "dc-ft-" + a.id;
    ta.value = store.get(kEntwurf, "");
    ta.addEventListener("input", () => store.set(kEntwurf, ta.value));
    const muster = () => `<p><b>Musterantwort:</b> ${md(a.musterantwort)}</p>${(a.kriterien || []).length ? `<p class="muted" style="font-size:.85rem">Darauf kommt es an:</p><ul>${a.kriterien.map(c => `<li>${md(c)}</li>`).join("")}</ul>` : ""}`;
    const selbst = () => {
      rueckmeldung(box, a, null, muster() + `<div class="aktionen"><span class="muted" style="font-size:.85rem">Wie war deine Antwort?</span><button type="button" class="btn" data-s="1">Hatte ich</button><button type="button" class="btn" data-s="0">Noch unsicher</button></div>`);
      box.querySelectorAll("[data-s]").forEach(b => b.addEventListener("click", () => melden(b.dataset.s === "1", muster())));
    };
    k.querySelector(".zeigen").addEventListener("click", selbst);
    if (alt) rueckmeldung(box, a, alt.ok, muster());
  }
  else if (a.typ === "karteikarte") {
    const zeigen = (hinten) => {
      k.innerHTML = `<div class="karte ${hinten ? "hinten" : ""}"><div>${md(hinten ? a.hinten : a.vorne)}</div></div>
        <div class="aktionen">${hinten ? `<button type="button" class="btn" data-s="1">Gewusst</button><button type="button" class="btn" data-s="0">Nochmals üben</button><button type="button" class="btn btn-ghost umdrehen">Vorderseite</button>` : `<button type="button" class="btn umdrehen">Umdrehen</button>`}</div>`;
      k.querySelector(".umdrehen").addEventListener("click", () => zeigen(!hinten));
      k.querySelectorAll("[data-s]").forEach(b => b.addEventListener("click", () => melden(b.dataset.s === "1", `<p><b>${md(a.vorne)}</b></p>`)));
    };
    zeigen(false);
    if (alt) rueckmeldung(box, a, alt.ok);
  }
  else {
    k.innerHTML = `<p class="frage">${md(a.frage || "")}</p><p class="muted">Dieser Übungstyp wird hier noch nicht angezeigt.</p>`;
  }
}

/* ---------- Start ---------- */
async function holeJson(pfad) {
  for (const b of ["content/" + FACH_ID + "/", "../../content/" + FACH_ID + "/"]) {
    try { const r = await fetch(b + pfad, { cache: "no-cache" }); if (r.ok) { const d = await r.json(); return { d, b }; } } catch (e) {}
  }
  return null;
}
async function init() {
  const f = await holeJson("fach.json");
  if (f) { FACH = Object.assign({}, FACH_FALLBACK, f.d); BASIS = f.b; }
  await Promise.all((FACH.einheiten || []).filter(x => x.status === "bereit" || x.status === "entwurf").map(async x => {
    const r = await holeJson(x.datei || ("einheiten/" + x.id + ".json"));
    if (r) EINHEITEN[x.id] = r.d;
  }));
  BEREIT = true;
  render();
}
render();
init();
/* KaTeX lädt asynchron – danach einmal neu zeichnen, damit Formeln erscheinen */
(function warteAufKatex(n) { if (window.katex) { if (BEREIT) render(); return; } if (n > 0) setTimeout(() => warteAufKatex(n - 1), 150); })(60);
</script>

.dc-citem.cur .dc-copen{border-color:var(--dc-accent-line,#4c4c55)}
.dc-citem .dc-copen b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc-citem .dc-copen span{font-size:.78rem;color:var(--dc-text-faint,#807f87)}
.dc-citem .dc-cdel{border:1px solid var(--dc-line,#2a2a30);background:transparent;color:var(--dc-text-muted,#aaaab2);border-radius:10px;padding:0 10px;cursor:pointer;font:inherit;font-size:.8rem}
.dc-citem .dc-cdel.scharf{color:var(--dc-danger,#dc8b88);border-color:var(--dc-danger,#dc8b88)}
.dc-cstatus{min-height:1.2em;padding:0 14px;font-size:.8rem;color:var(--dc-text-muted,var(--dc-muted,#aaaab2))}
.dc-cform{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--dc-line,#2a2a30);align-items:flex-end}
.dc-cform textarea{flex:1;resize:none;min-height:42px;max-height:140px;padding:10px 12px;border-radius:12px;border:1px solid var(--dc-line,#2a2a30);background:var(--dc-bg,#0e0e10);color:var(--dc-text,#ebeaef);font:inherit;font-size:16px;line-height:1.4}
@media (max-width:720px){.dc-cfab{right:12px;padding:12px}.dc-cfab span{display:none}.dc-cpanel{width:100%;border-left:0}}
</style>
<script id="dc-claude">
/* Frag Claude – Digital Campus, Modul v1. Beschreibung: docs/frag-claude.md
   Öffentlich: dcClaude.oeffnen(text?), dcClaude.knopf(text, label?), dcClaude.kontext = () => ({stufe, text}) (optional, von der Seite gesetzt). */
(function(){
"use strict";
const H=document.documentElement;
const FACH=H.dataset.theme||"campus";
const NAME=(document.title||"Digital Campus").replace(/\s*[–-]\s*Digital Campus\s*$/,"");
const BASEN=["content/"+FACH+"/","../../content/"+FACH+"/"];
const LKEY="dc-claude-"+FACH+"-v1",MAX_CHATS=20,MAX_BYTES=150000;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9 10h6M9 14h4"/></svg>';

/* ---------- Fach-Inhalte (nur lesen) ---------- */
let FACHJSON=null;const DATEIEN={};
async function hole(p){for(const b of BASEN){try{const r=await fetch(b+p,{cache:"no-cache"});if(r.ok)return await r.json();}catch(e){}}throw new Error(p+" nicht gefunden");}
async function fach(){if(!FACHJSON){try{FACHJSON=await hole("fach.json");}catch(e){FACHJSON={einheiten:[]};}}return FACHJSON;}
function dateiVon(e){return e.datei||("einheiten/"+e.id+".json");}
async function einheit(id){const f=await fach();const e=(f.einheiten||[]).find(x=>x.id===id)||{id};const p=dateiVon(e);if(!DATEIEN[p])DATEIEN[p]=await hole(p);return DATEIEN[p];}
function textAus(o,out){if(o==null)return out;if(typeof o==="string"){out.push(o);return out;}if(Array.isArray(o)){o.forEach(x=>textAus(x,out));return out;}
  if(typeof o==="object")for(const k in o){if(["id","farbe","schrift","typ","status","sprache"].includes(k))continue;textAus(o[k],out);}return out;}
const TOOLS=[
 {name:"inhaltsverzeichnis",description:"Listet alle Einheiten dieses Fachs (ID, Titel, Woche, Bereich). Nutze das zuerst, wenn du nicht weisst, wo etwas steht.",
  async execute(){status("Schaue ins Inhaltsverzeichnis …");const f=await fach();const l=(f.einheiten||[]).map(e=>`${e.id} · ${e.titel||""}${e.woche?" · SW"+e.woche:""}${e.bereich?" · "+e.bereich:""}${e.status&&e.status!=="bereit"?" · "+e.status:""}`);
   return l.length?l.join("\n"):"Für dieses Fach sind noch keine Einheiten erfasst.";}},
 {name:"lies_einheit",description:"Liest den Inhalt einer Einheit (Lektionen, Theorie, Aufgaben mit Lösungen und Erklärungen, Quellenangaben) als JSON-Text, gekürzt auf 30000 Zeichen.",
  inputSchema:{type:"object",properties:{id:{type:"string",description:"Einheiten-ID, z. B. sw03-schleifen"}},required:["id"]},
  async execute(inp){status("Lese "+inp.id+" …");const d=await einheit(String(inp.id||""));return JSON.stringify(d).slice(0,30000);}},
 {name:"suche",description:"Volltextsuche in allen Einheiten dieses Fachs. Liefert bis zu 8 Treffer mit Einheit und kurzem Auszug. Suche mit einzelnen Fachbegriffen.",
  inputSchema:{type:"object",properties:{begriff:{type:"string",description:"Suchbegriff"}},required:["begriff"]},
  async execute(inp){const q=norm(inp.begriff||"").trim();if(!q)throw new Error("Leerer Suchbegriff");status("Suche „"+inp.begriff+"“ …");
   const f=await fach();const hits=[];
   for(const e of f.einheiten||[]){let d;try{d=await einheit(e.id);}catch(x){continue;}
     for(const t of textAus(d,[])){const p=norm(t).indexOf(q);if(p>=0){hits.push({einheit:e.id,auszug:t.slice(Math.max(0,p-150),p+250)});if(hits.length>=8)return hits;}}}
   return hits.length?hits:"Keine Treffer für „"+inp.begriff+"“.";}}
];

/* ---------- Kontext der aktuellen Ansicht ---------- */
function wurzel(){return document.getElementById("app")||document.querySelector("main")||document.body;}
function kontext(){
  let k=null;try{if(typeof api.kontext==="function")k=api.kontext();}catch(e){}
  const w=wurzel();
  if(!k||!k.stufe){const sicht=x=>x&&x.offsetParent!==null&&x.textContent.trim();const t=s=>s.textContent.trim().replace(/\s+/g," ").slice(0,60);
    const tab=[...document.querySelectorAll('[aria-selected="true"],[aria-current="page"],[aria-current="true"],nav .active,nav .aktiv,nav .on,.tabs .active,.tabs .aktiv,.tabs .on')].find(x=>sicht(x)&&!x.closest(".dc-cpanel"));
    const h=[...w.querySelectorAll("h1,h2,h3")].find(sicht);const teile=[tab&&t(tab),h&&t(h)].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i);
    k=Object.assign({stufe:teile.join(" · ")||"Übersicht"},k||{});}
  if(!k.text){const c=w.cloneNode(true);c.querySelectorAll("script,style,svg,.dc-cpanel,.dc-cfab,button,nav").forEach(x=>x.remove());k.text=(c.innerText||c.textContent||"").replace(/\n{3,}/g,"\n\n").trim().slice(0,6000);}
  k.schluessel=k.schluessel||norm(k.stufe).replace(/[^a-z0-9]+/g,"-").slice(0,60)||"start";
  return k;}
function regeln(k,mitTools){const d=new Date();
  return `Du bist der Lern-Tutor in der Lern-App «Digital Campus» von Alain (HSLU, Bachelor Digital Engineer) im Fach «${NAME}». Heute ist ${d.toLocaleDateString("de-CH",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}.
${mitTools?"Über Werkzeuge kannst du die Inhalte dieses Fachs nachschlagen (inhaltsverzeichnis, lies_einheit, suche). Schlage nach, bevor du zu Stoff, Aufgaben oder Lösungen antwortest, und halte dich an Begriffe und Notation des Kursmaterials.":"Werkzeuge sind hier nicht verfügbar; stütze dich auf den Bildschirminhalt unten."}
Antwortstil: Deutsch in Schweizer Rechtschreibung (ss statt ß), kurz und direkt, Erklärungen in kleinen Schritten. Formeln in LaTeX mit $…$ bzw. $$…$$, Code in \`\`\`-Blöcken. Nenne die Quelle knapp, wenn sie im Material steht. Bei Übungsaufgaben zuerst einen Hinweis oder den nächsten Schritt geben, die ganze Lösung nur auf ausdrücklichen Wunsch. Wenn etwas nicht aus dem Kursstoff hervorgeht, sag das.

Aktuelle Stufe in der App: ${k.stufe}.
Bildschirminhalt dieser Ansicht (gekürzt):
"""
${k.text}
"""`;}

/* ---------- Verlauf: pro Stufe, lokal im Browser ---------- */
let STORE={};try{STORE=JSON.parse(localStorage.getItem(LKEY)||"{}");}catch(e){STORE={};}
function speichernLokal(){try{localStorage.setItem(LKEY,JSON.stringify(STORE));}catch(e){}}
const chatsVon=k=>(STORE[k]&&STORE[k].chats)||[];
function kuerzen(l){l.sort((a,b)=>b.upd-a.upd);while(l.length>MAX_CHATS)l.pop();while(l.length>1&&JSON.stringify(STORE).length>MAX_BYTES)l.pop();return l;}
let SC=null,chatId=null,turns=[],busy=false,ctl=null,sample=null;const aktivPro={};
function sichern(){if(!SC||!turns.length)return;const k=SC.schluessel;STORE[k]=STORE[k]||{label:SC.stufe,chats:[]};const l=STORE[k].chats;
  let ch=l.find(x=>x.id===chatId);if(!ch){chatId="c"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);ch={id:chatId};l.push(ch);}
  const f=turns.find(t=>t.role==="user");ch.titel=(f?f.content:"Chat").replace(/\s+/g," ").slice(0,70);ch.turns=turns.slice(-30);ch.upd=Date.now();aktivPro[k]=chatId;kuerzen(l);speichernLokal();}
function wann(t){const d=new Date(t);return d.toDateString()===new Date().toDateString()?"heute "+d.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"}):d.toLocaleDateString("de-CH",{day:"2-digit",month:"2-digit",year:"2-digit"});}

/* ---------- Darstellung ---------- */
function mathe(el){try{if(typeof api.mathe==="function"){api.mathe(el);return;}
  if(window.renderMathInElement){renderMathInElement(el,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],throwOnError:false});return;}
  if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([el]).catch(()=>{});}catch(e){}}
function tex(s,disp){if(window.katex&&!window.renderMathInElement){try{return katex.renderToString(s,{displayMode:disp,throwOnError:false,output:"mathml"});}catch(e){}}return esc(disp?"$$"+s+"$$":"$"+s+"$");}
function md(s){const blocks=[];let h=String(s||"").replace(/```[a-z]*\n?([\s\S]*?)```/g,(m,c)=>{blocks.push("<pre>"+esc(c.replace(/\n$/,""))+"</pre>");return "\u0000"+(blocks.length-1)+"\u0000";});
  const math=[];h=h.replace(/\$\$([\s\S]+?)\$\$/g,(m,c)=>{math.push(tex(c,true));return "\u0001"+(math.length-1)+"\u0001";}).replace(/\$([^\$\n]+?)\$/g,(m,c)=>{math.push(tex(c,false));return "\u0001"+(math.length-1)+"\u0001";});
  h=esc(h).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");
  let out="",list=null;for(const l of h.split("\n")){const ul=/^\s*[-•*]\s+(.*)/.exec(l),ol=/^\s*\d+[.)]\s+(.*)/.exec(l),hd=/^#{1,4}\s+(.*)/.exec(l);
    if(ul||ol){const t=ul?"ul":"ol";if(list!==t){if(list)out+="</"+list+">";out+="<"+t+">";list=t;}out+="<li>"+(ul||ol)[1]+"</li>";continue;}
    if(list){out+="</"+list+">";list=null;}if(hd)out+="<p><b>"+hd[1]+"</b></p>";else if(l.trim())out+=/^\u0000\d+\u0000$/.test(l.trim())?l:"<p>"+l+"</p>";}
  if(list)out+="</"+list+">";
  return out.replace(/\u0000(\d+)\u0000/g,(m,i)=>blocks[i]).replace(/\u0001(\d+)\u0001/g,(m,i)=>math[i]);}
let statusEl=null;function status(t){if(statusEl)statusEl.textContent=t||"";}

function ui(){if(document.getElementById("dc-cfab"))return;
  const fab=document.createElement("button");fab.id="dc-cfab";fab.className="dc-cfab";fab.type="button";fab.setAttribute("aria-label","Frag Claude");fab.innerHTML=ICON+"<span>Frag Claude</span>";document.body.appendChild(fab);
  const p=document.createElement("section");p.id="dc-cpanel";p.className="dc-cpanel";p.hidden=true;p.setAttribute("role","dialog");p.setAttribute("aria-label","Frag Claude");
  p.innerHTML=`<div class="dc-chead"><button class="dc-cbtn" type="button" id="dc-czu" aria-label="Chat schliessen">‹ Zurück</button><div class="dc-ctit"><b>Frag Claude</b><div class="dc-cctx" id="dc-cctx"></div></div><button class="dc-cbtn" type="button" id="dc-chist" aria-expanded="false">Verlauf</button><button class="dc-cbtn" type="button" id="dc-cneu">Neu</button></div>
  <div class="dc-cbody"><div class="dc-cside" id="dc-cside" hidden></div><div class="dc-cmsgs" id="dc-cmsgs" aria-live="polite"></div></div>
  <div class="dc-cstatus" id="dc-cstatus"></div>
  <form class="dc-cform" id="dc-cform"><textarea id="dc-cin" rows="1" placeholder="Deine Frage …" aria-label="Deine Frage"></textarea><button class="dc-cbtn prim" id="dc-csend" type="submit">Senden</button></form>`;
  document.body.appendChild(p);statusEl=p.querySelector("#dc-cstatus");
  fab.onclick=()=>oeffnen();p.querySelector("#dc-czu").onclick=()=>schliessen();
  p.querySelector("#dc-cneu").onclick=neu;p.querySelector("#dc-chist").onclick=()=>seite();
  const ta=p.querySelector("#dc-cin");ta.addEventListener("input",()=>{ta.style.height="auto";ta.style.height=Math.min(140,ta.scrollHeight)+"px";});
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!matchMedia("(max-width:720px)").matches){e.preventDefault();p.querySelector("#dc-cform").requestSubmit();}});
  p.querySelector("#dc-cform").onsubmit=e=>{e.preventDefault();if(busy){if(ctl)ctl.abort();return;}const v=ta.value.trim();if(!v)return;ta.value="";ta.style.height="auto";senden(v);};
  p.addEventListener("keydown",e=>{if(e.key==="Escape")schliessen();});
  document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-dc-ask]");if(b){e.preventDefault();oeffnen(b.getAttribute("data-dc-ask"));}});}
function seite(on){const s=document.getElementById("dc-cside");on=on===undefined?s.hidden:on;s.hidden=!on;document.getElementById("dc-chist").setAttribute("aria-expanded",on);if(!on)return;
  const l=chatsVon(SC.schluessel);
  s.innerHTML=`<p class="dc-cleer" style="margin:0 0 10px"><b>Vergangene Chats</b> · ${esc(SC.stufe)}</p>`+(l.length?l.map(c=>`<div class="dc-citem ${c.id===chatId?"cur":""}"><button class="dc-copen" type="button" data-id="${c.id}"><b>${esc(c.titel)}</b><span>${wann(c.upd)} · ${c.turns.length} Nachrichten</span></button><button class="dc-cdel" type="button" data-del="${c.id}" aria-label="Chat löschen">✕</button></div>`).join(""):'<p class="dc-cleer">Noch keine Chats auf dieser Stufe.</p>')+'<p class="dc-cleer" style="font-size:.78rem">Nur auf diesem Gerät gespeichert, höchstens 20 Chats pro Stufe.</p>';
  s.querySelectorAll(".dc-copen").forEach(b=>b.onclick=()=>{const c=chatsVon(SC.schluessel).find(x=>x.id===b.dataset.id);if(!c)return;if(ctl)ctl.abort();chatId=c.id;aktivPro[SC.schluessel]=c.id;turns=c.turns.slice();seite(false);zeigen();});
  s.querySelectorAll(".dc-cdel").forEach(b=>b.onclick=()=>{if(!b.dataset.scharf){b.dataset.scharf=1;b.textContent="Löschen?";b.classList.add("scharf");setTimeout(()=>{if(b.isConnected){delete b.dataset.scharf;b.textContent="✕";b.classList.remove("scharf");}},3000);return;}
    const k=SC.schluessel;STORE[k].chats=chatsVon(k).filter(x=>x.id!==b.dataset.del);speichernLokal();if(chatId===b.dataset.del){chatId=null;turns=[];zeigen();}seite(true);});}
function neu(){if(ctl)ctl.abort();chatId=null;turns=[];if(SC)aktivPro[SC.schluessel]=null;seite(false);zeigen();document.getElementById("dc-cin").focus();}
function zeigen(){const box=document.getElementById("dc-cmsgs");
  if(!turns.length){const v=(api.vorschlaege&&api.vorschlaege(SC))||["Erklär mir das hier nochmals einfacher","Gib mir eine Übungsfrage zu diesem Thema","Was muss ich dazu für den Test können?"];
    box.innerHTML=`<div class="dc-cleer"><p style="margin:0">Ich sehe, was gerade auf dem Bildschirm ist, und kann in den Inhalten von «${esc(NAME)}» nachschlagen. Frag zum Beispiel:</p><div class="dc-cchips">${v.map(s=>`<button type="button">${esc(s)}</button>`).join("")}</div></div>`;
    box.querySelectorAll(".dc-cchips button").forEach(b=>b.onclick=()=>senden(b.textContent));return;}
  box.innerHTML=turns.map(t=>`<div class="dc-cmsg ${t.role==="user"?"me":"ai"}">${t.role==="user"?esc(t.content):md(t.content)}</div>`).join("");mathe(box);box.scrollTop=box.scrollHeight;}
function fehlerText(c){return({rate_limited:"Gerade zu viele Anfragen oder dein Nutzungslimit ist erreicht. Versuch es später nochmals.",not_granted:"Du hast der App den Zugriff auf Claude nicht erlaubt.",sampling_disabled:"Claude ist für dieses Konto hier nicht verfügbar.",session_expired:"Bitte melde dich neu an.",prompt_too_large:"Der Verlauf ist zu lang. Starte mit «Neu» einen neuen Chat.",refused:"Diese Frage kann ich so nicht beantworten. Formuliere sie anders."})[c]||"Die Verbindung zu Claude ist abgebrochen. Versuch es nochmals.";}
async function senden(text){if(busy||!sample)return;busy=true;const btn=document.getElementById("dc-csend");btn.textContent="Stopp";seite(false);
  turns.push({role:"user",content:text});zeigen();
  const box=document.getElementById("dc-cmsgs");const b=document.createElement("div");b.className="dc-cmsg ai warte";b.textContent="Denke nach …";box.appendChild(b);box.scrollTop=box.scrollHeight;
  ctl=new AbortController();let tools=false;try{const lim=await sample.limits();tools=!!(lim&&lim.tools);}catch(e){}
  const k=kontext();const hist=turns.slice(-12);
  const input=[{role:"user",content:regeln(k,tools)},{role:"assistant",content:"Verstanden."},...(hist[0]&&hist[0].role==="assistant"?hist.slice(1):hist)];
  const opts={signal:ctl.signal,cache:false,onText:({text})=>{b.classList.remove("warte");b.textContent=text;box.scrollTop=box.scrollHeight;}};if(tools)opts.tools=TOOLS;
  try{const r=await sample(input,opts);turns.push({role:"assistant",content:r.text+(r.truncated?"\n\n*(Antwort gekürzt – frag nach dem Rest.)*":"")});}
  catch(e){const c=e&&e.code;if(e&&e.text)turns.push({role:"assistant",content:e.text+(c==="cancelled"?"\n\n*(abgebrochen)*":"")});
    if(c!=="cancelled")turns.push({role:"assistant",content:"⚠ "+fehlerText(c)});
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c))H.classList.remove("dc-claude-ok");}
  busy=false;btn.textContent="Senden";status("");sichern();zeigen();}
let zurueckSperre=false;
function oeffnen(vorgabe){if(!sample)return;ui();const p=document.getElementById("dc-cpanel");const k=kontext();
  if(!SC||SC.schluessel!==k.schluessel){if(ctl)ctl.abort();SC=k;const a=aktivPro[k.schluessel];const c=a&&chatsVon(k.schluessel).find(x=>x.id===a);chatId=c?c.id:null;turns=c?c.turns.slice():[];}
  document.getElementById("dc-cctx").textContent="Stufe: "+SC.stufe;seite(false);zeigen();
  if(p.hidden){p.hidden=false;document.body.classList.add("dc-chat-offen");try{history.pushState(Object.assign({},history.state,{dcChat:1}),"");}catch(e){}}
  const ta=document.getElementById("dc-cin");if(vorgabe){ta.value=vorgabe;ta.dispatchEvent(new Event("input"));}setTimeout(()=>{ta.focus();if(vorgabe)ta.setSelectionRange(ta.value.length,ta.value.length);},50);}
function schliessen(vonPop){const p=document.getElementById("dc-cpanel");if(!p||p.hidden)return;p.hidden=true;document.body.classList.remove("dc-chat-offen");
  const f=document.getElementById("dc-cfab");if(f)f.focus({preventScroll:true});if(vonPop!==true){zurueckSperre=true;try{history.back();}catch(e){zurueckSperre=false;}}}
window.addEventListener("popstate",e=>{if(zurueckSperre){zurueckSperre=false;e.stopImmediatePropagation();return;}
  const p=document.getElementById("dc-cpanel");if(p&&!p.hidden){schliessen(true);e.stopImmediatePropagation();}},true);

/* ---------- öffentliche Schnittstelle ---------- */
const api=window.dcClaude=Object.assign(window.dcClaude||{},{
  version:1,
  oeffnen,
  knopf(text,label){return `<button type="button" class="dc-ask" data-dc-ask="${esc(text)}">${ICON}<span>${esc(label||"Claude fragen")}</span></button>`;},
  frageText(frage,extra){return "Ich verstehe diese Frage bzw. die Lösung noch nicht ganz. Kannst du es mir Schritt für Schritt erklären?\n\nFrage: "+String(frage||"").replace(/\s+/g," ").trim()+(extra?"\n"+extra:"");}
});
async function start(){ui();if(!window.claude||!window.claude.use)return;
  try{sample=await claude.use("sample");}catch(e){sample=null;}
  if(sample){H.classList.add("dc-claude-ok");window.__sampleOK=true;}}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);else start();
})();
</script>
<!-- ===== Ende Frag Claude ===== -->
