<title>Digitaltechnik – Digital Campus</title>

<style>
/* Digital Campus Design System: Theme digitaltechnik */
:root{
  --dc-bg:#0d100e;
  --dc-surface:#151815;
  --dc-surface-raised:#1c201d;
  --dc-line:#2d322d;
  --dc-accent:#9dc7a5;
  --dc-accent-hover:#b5d9bb;
  --dc-accent-soft:#1b241d;
  --dc-accent-line:#495e4d;
  --dc-on-accent:#0f1610;
  --dc-text:#ebeaef;
  --dc-text-muted:#aaaab2;
  --dc-text-faint:#807f87;
  --dc-campus:#af9ee4;
  --dc-campus-soft:#231f2f;
  --dc-success:#8ec7a1;
  --dc-warning:#dcc188;
  --dc-danger:#dc8b88;
  --dc-font-fach:"Chakra Petch", system-ui, sans-serif;
  --dc-font-campus:"Outfit", system-ui, sans-serif;
  --dc-font-mono:"JetBrains Mono", ui-monospace, monospace;
}
/* Digital Campus – Digitaltechnik
   Inhalte kommen aus content/digitaltechnik/*.json (fach.json, themen.json, termine.json, einheiten/<id>.json).
   Design: Digital Campus Design System, Theme digitaltechnik. */
:root{
  --bg:#0d100e; --panel:#151815; --panel2:#1c201d; --line:#2d322d;
  --ink:#ebeaef; --muted:#aaaab2; --accent:#9dc7a5; --accent2:#495e4d; --accentInk:#0f1610;
  --ok:#8ec7a1; --bad:#dc8b88; --warn:#dcc188; --info:#aaaab2;
  --display:"Chakra Petch", system-ui, sans-serif;
  --body:"Chakra Petch", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body{min-height:100vh;padding-bottom:84px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.8rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
p{margin:0}
header.top{position:sticky;top:0;z-index:10;background:rgba(13,16,14,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.upbtn{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 12px 7px 8px;font-weight:600;font-size:.9rem;color:var(--ink);min-height:40px;text-decoration:none;white-space:nowrap}
.upbtn svg{width:18px;height:18px}
.upbtn:hover{border-color:var(--accent)}
.upbtn[hidden]{display:none}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.05rem;white-space:nowrap;min-width:0}
.brand .logo{width:30px;height:30px;border-radius:8px;flex:none}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:.72rem;color:var(--muted);margin-top:-2px}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:.92rem;display:flex;align-items:center;gap:6px}
nav.tabs button[aria-current="page"]{background:var(--panel2);color:var(--ink)}
nav.tabs svg{width:18px;height:18px}
.sync{font-size:.72rem;color:var(--muted);white-space:nowrap}
.sync i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:1px}
.sync.on i{background:var(--ok)}
main{max-width:980px;margin:0 auto;padding:20px 16px;display:grid;gap:18px}
main>*{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--panel2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.acc{background:rgba(157,199,165,.16);color:#b5d9bb;border-color:rgba(157,199,165,.35)}
.pill.ok{background:rgba(142,199,161,.13);color:#8ec7a1;border-color:rgba(142,199,161,.3)}
.pill.bad{background:rgba(220,139,136,.13);color:#dc8b88;border-color:rgba(220,139,136,.3)}
.pill.warn{background:rgba(220,193,136,.13);color:#dcc188;border-color:rgba(220,193,136,.3)}
.pill.info{background:rgba(170,170,178,.1);color:#ebeaef;border-color:rgba(170,170,178,.3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:10px 16px;font-weight:600;border:1px solid var(--line);background:var(--panel2);min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.btn.primary:hover{background:#b5d9bb}
.btn.ghost{background:none}
.btn[disabled]{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;color:#b5d9bb;font-weight:600;padding:4px 0;font-size:.9rem}
.linkbtn:hover{color:var(--ink)}
/* Übersicht */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.count{background:linear-gradient(160deg,#151815,#151815 70%);border-color:#2d322d}
.bignum{font-family:var(--display);font-weight:800;font-size:3.2rem;line-height:1;color:#ebeaef}
.next{border-left:3px solid var(--accent);background:var(--panel2);border-radius:12px;padding:12px 14px;margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:1.4rem;line-height:1.1}
.stat span{font-size:.75rem;color:var(--muted)}
.list{display:grid}
.list .it{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.date{font-family:var(--mono);font-size:.78rem;color:var(--muted);line-height:1.25}
.date b{display:block;font-family:var(--display);font-size:1.15rem;color:var(--ink)}
.it .t{font-weight:600}
.it .s{font-size:.85rem;color:var(--muted)}
.it .h{font-size:.85rem;margin-top:4px}
.it.vorbei{opacity:.5}
.themenkarte{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.tk{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px;align-content:start;min-height:96px}
.tk:hover{border-color:var(--accent)}
.tk .kn{font-family:var(--mono);font-size:.75rem;color:var(--accent)}
.tk .tt{font-weight:600;font-size:.9rem;line-height:1.3}
.tk.mep{border-color:rgba(220,139,136,.4)}
.bar{height:6px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.fokus{display:grid;gap:10px;margin-top:12px}
/* Themen */
.thema{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.thema:hover{border-color:var(--accent)}
.thema .no{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--accent);text-align:center}
.thema .rt{text-align:right;min-width:64px}
.stack{display:grid;gap:10px}
ul.ziele{margin:10px 0 0;padding-left:20px;display:grid;gap:6px}
.unterl{display:grid;gap:8px;margin-top:10px}
.unterl div{display:grid;grid-template-columns:70px 1fr;gap:10px;font-size:.92rem}
.unterl b{color:var(--muted);font-weight:600}
.unterl code{font-family:var(--mono);font-size:.82rem;word-break:break-word}
.leer{border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.leer h3{color:var(--ink);margin-bottom:6px}
.les{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
.les:hover{border-color:var(--accent)}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--panel);border:2px solid var(--line)}
.dot.done{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.88rem;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.gruppe{font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.75rem;margin:6px 0 -4px}
details summary{cursor:pointer;color:var(--muted);font-size:.9rem;font-weight:600}
/* Lektion */
.lektop{display:flex;align-items:center;gap:12px}
.x{background:none;border:0;font-size:1.4rem;color:var(--muted);padding:4px 8px;min-height:44px}
.progress{flex:1;height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .3s}
.typ{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.q{font-size:1.15rem;font-weight:600;margin:6px 0 16px;max-width:70ch;overflow-x:auto}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);min-height:48px;overflow-x:auto}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:rgba(157,199,165,.14)}
.opt.right{border-color:var(--ok);background:rgba(142,199,161,.12)}
.opt.wrong{border-color:var(--bad);background:rgba(220,139,136,.12)}
.opt.weg{visibility:hidden}
.opt[disabled]{cursor:default}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfrow .opt{text-align:center;padding:20px}
.paar{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eingabe{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eingabe input,textarea.frei{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font:500 1.05rem var(--mono);min-width:140px;flex:1}
textarea.frei{width:100%;min-height:140px;font-family:var(--body);font-size:1rem}
.lt{font-size:1.05rem;line-height:2.4}
.lt input{background:var(--panel2);border:1px solid var(--line);border-bottom:2px solid var(--accent);border-radius:8px;padding:4px 8px;color:var(--ink);font:500 1rem var(--mono);width:9ch}
input.ok{border-color:var(--ok)!important}input.falsch{border-color:var(--bad)!important}
.zone{border:1px dashed var(--line);border-radius:14px;padding:10px;min-height:56px;display:grid;gap:8px;margin-bottom:12px}
.karte{background:var(--panel2);border:1px solid var(--line);border-radius:16px;min-height:170px;padding:22px;display:grid;place-items:center;text-align:center;font-size:1.1rem;font-weight:600}
.karte.hinten{border-color:var(--accent);background:rgba(157,199,165,.1)}
.fb{margin-top:16px;border-radius:12px;padding:12px 14px;border:1px solid}
.fb.ok{border-color:rgba(142,199,161,.4);background:rgba(142,199,161,.08)}
.fb.bad{border-color:rgba(220,139,136,.4);background:rgba(220,139,136,.08)}
.fb h3{margin-bottom:4px}
.fb p{margin-top:4px}
.quelle{font-size:.78rem;color:var(--muted);margin-top:8px}
.aktion{margin-top:16px}
.aktion .btn{width:100%}
.result{text-align:center;display:grid;gap:10px;justify-items:center;padding:30px 18px}
.result .bignum{font-size:4rem}
.lade{min-height:50vh;display:grid;place-items:center;color:var(--muted)}
@keyframes wackel{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.wackel{animation:wackel .25s 2}
mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
/* Tabellen, Zustandsdiagramme, Widgets K07/K08 */
.tabwrap{overflow-x:auto}
.fig table,table.mini{border-collapse:collapse;margin:0 auto;font-size:.92rem}
.fig th,.fig td,table.mini th,table.mini td{border:1px solid var(--line);padding:6px 10px;text-align:center;min-width:34px}
.fig th,table.mini th{background:var(--panel);color:#b5d9bb;font-weight:600}
.fig td.hv,.fig th.hv,table.mini tr.hv td{background:rgba(157,199,165,.22);color:var(--ink)}
table.kv td{font-family:var(--mono);min-width:44px}
.zdg .zk{fill:var(--panel);stroke:#807f87;stroke-width:2}
.zdg .zk.an{fill:rgba(157,199,165,.35);stroke:var(--accent);stroke-width:3}
.zdg .zkt{fill:var(--ink);font:700 13px var(--body)}
.zdg .zka{fill:#b5d9bb;font:500 11px var(--mono)}
.zdg .zkl{stroke:#807f87;stroke-width:1}
.zdg .zt{font-size:11.5px;fill:#aaaab2}
.chip.tg{font-family:var(--body)}
.chip.tg[aria-pressed="true"]{background:var(--accent);color:var(--accentInk)}
.lampen{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.lampe{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px 5px 10px;font-weight:600}
.lampe b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#1c201d;color:var(--muted);font-family:var(--mono)}
.lampe.an b{background:#dcc188;color:#0f1610;box-shadow:0 0 14px rgba(255,215,106,.7)}
.lampe.unb b{background:rgba(220,193,136,.25);color:var(--warn)}
.ffrow{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.tabbox{display:flex;justify-content:center}
/* Übungen */
.check{background:linear-gradient(160deg,#151815,#151815 70%);border-color:#2d322d}
.aufg{display:grid;gap:10px}
.anr{font-family:var(--mono);font-size:.8rem;color:var(--accent)}
.atext{display:grid;gap:8px;max-width:72ch}
.teile{display:grid;gap:6px;margin-top:2px}
.teile div{display:grid;grid-template-columns:28px 1fr;gap:6px}
.tipps{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.tipps summary{color:var(--ink)}
.tipps ol{margin:10px 0;padding-left:22px;display:grid;gap:8px}

<script>
"use strict";
/* ============================================================
   KONFIGURATION
   ============================================================ */
const FACH_ID = "digitaltechnik";
// Als Artifact liegen die Inhalte unter content/…; als lokale Kopie in app/faecher/ unter ../../content/…
const BASIS_PFADE = ["content/" + FACH_ID + "/", "../../content/" + FACH_ID + "/"];
const SEM_START = new Date(2026, 8, 14);   // Montag SW01 HS26
const SEM_WOCHEN = 14;
const DAY = 864e5;

/* ============================================================
   HILFEN
   ============================================================ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Text mit `code`, **fett** und LaTeX ($…$) – LaTeX setzt MathJax danach
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
const mischen = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const heute = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const tag = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const WT = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const MON = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
const fmt = d => String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + ".";
const tageBis = s => Math.round((tag(s) - heute()) / DAY);
function swVon(d) { const n = Math.floor((d - SEM_START) / DAY / 7) + 1; return n; }
function typeset(el) { if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetClear && MathJax.typesetClear([el]); MathJax.typesetPromise([el]).catch(() => {}); } else setTimeout(() => typeset(el), 300); }
const kn = n => "K" + String(n).padStart(2, "0");

/* ============================================================
   INHALTE
   ============================================================ */
const I = { fach: null, themen: [], termine: [], einheiten: {}, basis: null, quellen: "", stand: "" };
async function holen(pfad) { const r = await fetch(I.basis + pfad, { cache: "no-cache" }); if (!r.ok) throw new Error(pfad + " fehlt"); return r.json(); }
async function inhalteLaden() {
  for (const b of BASIS_PFADE) {
    try { const r = await fetch(b + "fach.json", { cache: "no-cache" }); if (!r.ok) continue; I.fach = await r.json(); I.basis = b; break; } catch (e) {}
  }
  if (!I.fach) throw new Error("fach.json nicht gefunden");
  const [th, te] = await Promise.all([holen("themen.json").catch(() => ({ themen: [] })), holen("termine.json").catch(() => ({ termine: [] }))]);
  I.themen = (th.themen || []).slice().sort((a, b) => a.nr - b.nr);
  I.termine = (te.termine || []).slice().sort((a, b) => a.von.localeCompare(b.von));
  I.quellen = te.quellen || ""; I.stand = te.stand || "";
  const ids = I.fach.einheiten || [];
  const geladen = await Promise.all(ids.map(id => holen("einheiten/" + id + ".json").catch(() => null)));
  geladen.forEach(e => { if (e && e.id) I.einheiten[e.id] = e; });
}
// Lektionen eines Themas: aus den Einheiten, die das Thema nennt
const lektionenVon = t => (t.einheiten || []).flatMap(id => (I.einheiten[id]?.lektionen || []).map(l => ({ ...l, einheit: id })));
const alleLektionen = () => I.themen.flatMap(lektionenVon);
// Eine Lektion hat entweder «schritte» (Theorie-Karten und Fragen gemischt) oder nur «aufgaben»
const schritteVon = l => l.schritte || l.aufgaben || [];
const fragenVon = l => schritteVon(l).filter(s => s.typ !== "theorie");
const alleAufgaben = () => alleLektionen().flatMap(fragenVon).concat(I.themen.flatMap(t => uebungenVon(t).kurz));
// Übungen pro Thema: kurz = Schnell-Check-Fragen, lang = Aufgaben aus dem Übungsblatt
const uebungenVon = t => {
  const r = { kurz: [], lang: [] };
  (t.einheiten || []).forEach(id => { const u = I.einheiten[id]?.uebungen; if (u && !Array.isArray(u)) { r.kurz.push(...(u.kurz || [])); r.lang.push(...(u.lang || [])); } });
  return r;
};

/* ============================================================
   FORTSCHRITT (localStorage + Konto, wie Digital Campus Mathe)
   ============================================================ */
const KEY = "digital-campus-" + FACH_ID;
let S = { v: 1, lektionen: {}, fehler: {}, xp: 0, tage: {}, streak: 0, letzterTag: null, updated: 0, aufg: {}, chats: {}, chatsGeloescht: {} };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
["aufg", "chats", "chatsGeloescht"].forEach(k => { if (!S[k] || typeof S[k] !== "object") S[k] = {}; });
let dbRef = null, schreibt = false, nochmal = false, timer = null;
function speichern() {
  S.updated = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  clearTimeout(timer); timer = setTimeout(hochladen, 1200);
}
async function hochladen() {
  if (!dbRef) return; if (schreibt) { nochmal = true; return; } schreibt = true;
  try { await dbRef.set({ state: JSON.parse(JSON.stringify(S)), updated: S.updated }); setSync(true); } catch (e) { setSync(false, "nicht gespeichert"); }
  schreibt = false; if (nochmal) { nochmal = false; hochladen(); }
}
function mergen(r) {
  if (!r) return;
  for (const k in r.lektionen || {}) { const a = S.lektionen[k], b = r.lektionen[k]; if (!a || (b.ts || 0) > (a.ts || 0)) S.lektionen[k] = b; }
  for (const k in r.fehler || {}) if (!(k in S.fehler)) S.fehler[k] = r.fehler[k];
  for (const k in r.aufg || {}) { const a = S.aufg[k], b = r.aufg[k]; if (!a || (b.ts || 0) > (a.ts || 0)) S.aufg[k] = b; }
  for (const k in r.chatsGeloescht || {}) S.chatsGeloescht[k] = Math.max(S.chatsGeloescht[k] || 0, r.chatsGeloescht[k]);
  const zuletzt = m => (m && m.length ? m[m.length - 1].ts || 0 : 0);
  for (const k in r.chats || {}) { const b = r.chats[k]; if (zuletzt(b) > zuletzt(S.chats[k])) S.chats[k] = b; }
  for (const k in S.chats) if ((S.chatsGeloescht[k] || 0) >= zuletzt(S.chats[k])) delete S.chats[k];
  for (const k in r.tage || {}) S.tage[k] = Math.max(S.tage[k] || 0, r.tage[k]);
  S.xp = Math.max(S.xp || 0, r.xp || 0);
  if ((r.letzterTag || "") > (S.letzterTag || "")) { S.letzterTag = r.letzterTag; S.streak = r.streak; }
}
function setSync(on, txt) {
  const el = $("#sync"); el.className = "sync" + (on ? " on" : "");
  el.innerHTML = "<i></i>" + (txt || (on ? "synchronisiert" : "lokal"));
  el.title = on ? "Fortschritt wird in deinem Konto gespeichert (Handy & PC)" : "Fortschritt nur in diesem Browser gespeichert";
}
async function syncStart() {
  if (!window.claude || !window.claude.use) { setSync(false); return; }
  try {
    const [user, db] = await Promise.all([claude.use("user"), claude.use("db")]);
    if (!user || !db) { setSync(false); return; }
    const id = await user.id(); if (!id) { setSync(false); return; }
    dbRef = db.collection("data/users/" + id).doc(FACH_ID);
    const snap = await Promise.race([dbRef.get(), new Promise((_, rej) => setTimeout(() => rej("timeout"), 10000))]);
    if (snap && snap.exists) { mergen(JSON.parse(JSON.stringify(snap.data().state))); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} if (!sitzung) render(); }
    setSync(true); hochladen();
  } catch (e) { dbRef = null; setSync(false); }
}
const fertig = id => !!(S.lektionen[id] && S.lektionen[id].done);
function themaStand(t) { const L = lektionenVon(t); return { done: L.filter(l => fertig(l.id)).length, total: L.length }; }
function streak() {
  const t = iso(heute()); if (S.letzterTag === t) return;
  const g = iso(new Date(heute() - DAY));
  S.streak = S.letzterTag === g ? (S.streak || 0) + 1 : 1; S.letzterTag = t;
}

/* ============================================================
   NAVIGATION (#start, #themen, #termine, #k04 …)
   ============================================================ */
const TABS = ["start", "themen", "termine"];
let view = { tab: "start" };
let sitzung = null;
function ausHash() {
  const h = location.hash.slice(1);
  if (TABS.includes(h)) return { tab: h };
  const m = h.match(/^(k\d\d)(?:-(aufgaben|lesen))?$/);
  if (m && I.themen.some(t => t.id === m[1])) return { tab: "themen", thema: m[1], reiter: m[2] || "theorie" };
  return { tab: "start" };
}
function go(v) { sitzung = null; view = v; const h = v.thema ? v.thema + (v.reiter === "aufgaben" || v.reiter === "lesen" ? "-" + v.reiter : "") : v.tab; try { if (location.hash.slice(1) !== h) history.pushState(null, "", "#" + h); } catch (e) { location.hash = h; } render(); if (v.anker) { const z = document.getElementById(v.anker); if (z) { z.scrollIntoView(); return; } } window.scrollTo(0, 0); }
window.addEventListener("popstate", () => { sitzung = null; view = ausHash(); render(); });
window.addEventListener("hashchange", () => { const v = ausHash(); if (v.tab !== view.tab || v.thema !== view.thema || (v.reiter || "theorie") !== (view.reiter || "theorie")) { sitzung = null; view = v; render(); } });
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => go({ tab: b.dataset.tab })));
$("#upbtn").addEventListener("click", () => { if (sitzung) { const t = sitzung.thema, r = sitzung.reiter; sitzung = null; go(t ? { tab: "themen", thema: t, reiter: r } : { tab: "themen" }); } else if (view.thema && view.reiter === "lesen") go({ tab: "themen", thema: view.thema, reiter: "theorie" }); else go({ tab: "themen" }); });

const app = $("#app");
function render() {
  GRAFIKEN = [];
  const zurueck = !!(sitzung || view.thema);
  $("#upbtn").hidden = !zurueck;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === view.tab ? "page" : "false"));

function pillArt(t) { const p = ART_PILL[(t.art || "").toLowerCase()] || ["", t.art || ""]; return `<span class="pill ${p[0]}">${esc(p[1])}</span>`; }
function terminStatus(t) {
  const a = tageBis(t.von), e = tageBis(t.bis);
  if (e < 0) return null;
  if (a <= 0) return t.von === t.bis ? "heute" : "läuft";
  if (a === 1) return "morgen";
  return "in " + a + " Tagen";
}
const kommend = () => I.termine.filter(t => tageBis(t.bis) >= 0);
function terminZeile(t, mitHinweis) {

function fehlerWiederholen() {

/* ============================================================
   THEORIE-KARTEN, GRAFIKEN UND INTERAKTIVE TEILE
   Blöcke einer Theorie-Karte: text, liste, merke, hinweis, formel,

   ============================================================ */
let GRAFIKEN = [];
let rzTimer = null;
window.addEventListener("resize", () => { clearTimeout(rzTimer); rzTimer = setTimeout(() => GRAFIKEN.forEach(f => { try { f(); } catch (e) {} }), 120); });
function grafik(fn) { GRAFIKEN.push(fn); fn(); }

// "t_Eingangsstufe" → t mit tiefgestelltem Index (SVG)
// mehrere Indizes möglich, z. B. "D_1 → Q_1" oder "T_clk,min"
const SUB_RE = /_(\{[^}]*\}|[A-Za-z0-9,.]+)/g;
const ohneKl = x => x.replace(/^\{|\}$/g, "");
function subText(t) { return esc(t).replace(SUB_RE, (_, x) => `<tspan baseline-shift="sub" font-size="78%">${ohneKl(x)}</tspan>`); }
// dasselbe für HTML
function subHTML(t) { return esc(t).replace(SUB_RE, (_, x) => `<sub>${ohneKl(x)}</sub>`); }
const SVG_DEFS = `<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#807f87" stroke-width="2"/></pattern>
  <marker id="pe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#b5d9bb"/></marker>
  <marker id="pw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#dc8b88"/></marker>
  <marker id="pn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#aaaab2"/></marker></defs>`;

/* ---------- Zeitdiagramm ----------
   signale: [{name, wellen}] – ein Zeichen pro Zeiteinheit:
   0 / 1 Pegel, x darf sich ändern (schraffiert), m metastabil, . wie vorher, Leerzeichen: noch nicht sichtbar
   fenster: [{von, bis, text, art: setup|hold|warn}], marken: [{t, text}], pfeile: [{signal, von, bis, text}] */
function zeitSVG(d, W) {
  W = Math.max(260, Math.floor(W));
  const sig = d.signale || [];
  const n = Math.max(1, ...sig.map(s => s.wellen.length));
  const LW = W < 420 ? 64 : 92, R = 12;
  const top = (d.fenster || []).length ? 24 : 8;
  const mitPfeil = new Set((d.pfeile || []).map(p => p.signal));
  let y = top;
  const rows = sig.map((s, i) => { const r = { y, h: 40 + (mitPfeil.has(i) ? 22 : 0) }; y += r.h; return r; });
  const H = y + ((d.marken || []).length ? 24 : 6);
  const u = (W - LW - R) / n, X = t => LW + t * u;
  let o = `<svg class="zd" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(d.titel || "Zeitdiagramm")}">${SVG_DEFS}`;
  const FARBE = { setup: "#aaaab2", hold: "#9dc7a5", warn: "#dc8b88" };
  (d.fenster || []).forEach(f => {
    const c = FARBE[f.art] || "#9dc7a5";
    o += `<rect x="${X(f.von)}" y="${top - 4}" width="${Math.max(1, X(f.bis) - X(f.von))}" height="${y - top + 4}" fill="${c}" opacity=".17" rx="3"/>
      <text x="${(X(f.von) + X(f.bis)) / 2}" y="${top - 9}" text-anchor="middle" class="zl" fill="${c}" style="fill:${c}">${subText(f.text)}</text>`;
  });
  sig.forEach((s, i) => {
    const r = rows[i], yH = r.y + 6, yL = r.y + 30, yM = (yH + yL) / 2;
    o += `<text x="${LW - 8}" y="${yM + 5}" text-anchor="end" class="zn">${subText(s.name)}</text>`;
    const runs = [];
    for (let t = 0; t < s.wellen.length; t++) {
      let c = s.wellen[t];
      if (c === ".") c = runs.length ? runs[runs.length - 1].c : "0";
      if (runs.length && runs[runs.length - 1].c === c) runs[runs.length - 1].b = t + 1; else runs.push({ c, a: t, b: t + 1 });
    }
    let prev = null;
    runs.forEach(rn => {
      const x0 = X(rn.a), x1 = X(rn.b);
      if (rn.c === "0" || rn.c === "1") {
        const yy = rn.c === "1" ? yH : yL;
        if (prev && (prev.c === "0" || prev.c === "1") && prev.c !== rn.c) o += `<line x1="${x0}" y1="${yH}" x2="${x0}" y2="${yL}" class="zw"/>`;
        if (prev && prev.c === "m") o += `<line x1="${x0}" y1="${yM}" x2="${x0}" y2="${yy}" class="zw zm"/>`;
        o += `<line x1="${x0}" y1="${yy}" x2="${x1}" y2="${yy}" class="zw"/>`;

      <line x1="${x0 + 1}" y1="${yy}" x2="${x1 - 1}" y2="${yy}" class="zp" marker-start="url(#pe)" marker-end="url(#pe)"/>

}

/* ---------- Blockbild als Kette ----------
   elemente: [{text, sub} | {stapel: [{text, sub}, …]}], pfeile: [Beschriftung zwischen i und i+1],
   takt: "Beschriftung" (Takt an alle Blöcke ausser dem ersten), warnung: Index, warntext,
   zeiten: [{von, bis, text}] Klammer unter Blöcken */
function umbrechen(t, max) {
  const w = String(t).split(/\s+/), z = []; let l = "";
  w.forEach(x => { if ((l + " " + x).trim().length > max && l) { z.push(l); l = x; } else l = (l + " " + x).trim(); });
  if (l) z.push(l); return z;
}
function boxSVG(x, y, w, h, e, warn) {
  const max = Math.max(6, Math.floor((w - 12) / 7.2));
  const z = umbrechen(e.text, max).map(subText), sub = e.sub ? subText(e.sub) : "";
  const zeilen = z.length + (sub ? 1 : 0), y0 = y + h / 2 - (zeilen - 1) * 8 + 4;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9" class="kb${warn ? " kw" : ""}"/>` +
    z.map((t, i) => `<text x="${x + w / 2}" y="${y0 + i * 16}" text-anchor="middle" class="kt">${t}</text>`).join("") +
    (sub ? `<text x="${x + w / 2}" y="${y0 + z.length * 16}" text-anchor="middle" class="ks">${sub}</text>` : "");
}
function ketteSVG(d, W) {
  W = Math.max(260, Math.floor(W));
  const el = d.elemente || [], n = el.length, warnI = d.warnung ?? -1;
  if (W < 560) return ketteVertikal(d, W);
  const G = 54, bw = (W - (n - 1) * G) / n, bh = 58, sh = 46, sg = 12;
  const colH = el.map(e => e.stapel ? e.stapel.length * sh + (e.stapel.length - 1) * sg : bh);
  const HC = Math.max(...colH), top = (d.pfeile || []).some(Boolean) || d.warntext ? 26 : 8;
  const xs = el.map((_, i) => i * (bw + G));
  let o = "", unten = top + HC;
  // Ankerpunkte
  const anker = el.map((e, i) => {
    if (e.stapel) { const y0 = top + (HC - colH[i]) / 2; return e.stapel.map((_, k) => ({ y: y0 + k * (sh + sg), h: sh })); }
    return [{ y: top + (HC - bh) / 2, h: bh }];
  });
  el.forEach((e, i) => {
    const items = e.stapel || [e];
    items.forEach((it, k) => { const a = anker[i][k]; o += boxSVG(xs[i], a.y, bw, a.h, it, false); });
  });
  for (let i = 0; i < n - 1; i++) {
    const warn = i === warnI, cls = warn ? "kpw" : "kp", mk = warn ? "pw" : "pn";
    const zielY = anker[i + 1][0].y + anker[i + 1][0].h / 2, x0 = xs[i] + bw, x1 = xs[i + 1];
    anker[i].forEach(a => {
      const yA = a.y + a.h / 2, xm = x0 + G / 2;
      o += yA === zielY ? `<line x1="${x0}" y1="${yA}" x2="${x1 - 2}" y2="${zielY}" class="${cls}" marker-end="url(#${mk})"/>`
        : `<polyline points="${x0},${yA} ${xm},${yA} ${xm},${zielY} ${x1 - 2},${zielY}" class="${cls}" fill="none" marker-end="url(#${mk})"/>`;
    });
    const lab = (d.pfeile || [])[i];
    if (lab) o += `<text x="${x0 + G / 2}" y="${zielY - 8}" text-anchor="middle" class="ks">${subText(lab)}</text>`;
    if (warn && d.warntext) o += `<text x="${x0 + G / 2}" y="${top - 10}" text-anchor="middle" class="kwt">${esc(d.warntext)}</text>`;
  }
  if (d.takt) {
    const yT = unten + 26; const xa = xs[1] + bw / 2, xb = xs[n - 1] + bw / 2;
    o += `<line x1="${xa - 30}" y1="${yT}" x2="${W - 2}" y2="${yT}" class="kp"/>`;
    for (let i = 1; i < n; i++) { const a = anker[i][anker[i].length - 1]; o += `<line x1="${xs[i] + bw / 2}" y1="${yT}" x2="${xs[i] + bw / 2}" y2="${a.y + a.h + 2}" class="kp" marker-end="url(#pn)"/>`; }
    o += `<text x="${W - 4}" y="${yT + 17}" text-anchor="end" class="ks">${subText(d.takt)}</text>`;
    unten = yT + 22;
  }
  (d.zeiten || []).forEach(z => {
    const yZ = unten + 24, xa = xs[z.von] + 4, xb = xs[z.bis] + bw - 4;
    o += `<polyline points="${xa},${yZ - 6} ${xa},${yZ} ${xb},${yZ} ${xb},${yZ - 6}" class="kp" fill="none"/><text x="${(xa + xb) / 2}" y="${yZ + 16}" text-anchor="middle" class="ks">${subText(z.text)}</text>`;
  });
  if ((d.zeiten || []).length) unten += 44;
  const H = unten + 10;
  return `<svg class="zd" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Blockbild">${SVG_DEFS}${o}</svg>`;
}
function ketteVertikal(d, W) {
  const el = d.elemente || [], n = el.length, warnI = d.warnung ?? -1;
  const bw = Math.min(W - 24, 280), x = (W - bw) / 2, bh = 50, G = 40;
  let o = "", y = 4;
  const zeitVon = i => (d.zeiten || []).filter(z => z.von === i).map(z => z.text);
  el.forEach((e, i) => {
    if (e.stapel) {
      const k = e.stapel.length, w2 = (bw - (k - 1) * 10) / k;
      e.stapel.forEach((it, j) => { o += boxSVG(x + j * (w2 + 10), y, w2, bh + 6, it, false); });
      y += bh + 6;
    } else {
      const zt = zeitVon(i);
      o += boxSVG(x, y, bw, bh, zt.length ? { text: e.text, sub: (e.sub ? e.sub + " · " : "") + zt.join(", ") } : e, false);
      y += bh;
    }
    if (i < n - 1) {
      const warn = i === warnI;
      o += `<line x1="${W / 2}" y1="${y + 2}" x2="${W / 2}" y2="${y + G - 4}" class="${warn ? "kpw" : "kp"}" marker-end="url(#${warn ? "pw" : "pn"})"/>`;
      const lab = (d.pfeile || [])[i];
      if (lab) o += `<text x="${W / 2 + 10}" y="${y + G / 2 + 4}" class="ks">${subText(lab)}</text>`;
      if (warn && d.warntext) {
        const z = umbrechen(d.warntext, Math.max(10, Math.floor((W / 2 - 16) / 6.6)));
        z.forEach((t, j) => { o += `<text x="${W / 2 + 10}" y="${y + G / 2 + 4 + (j - (z.length - 1) / 2) * 14}" class="kwt">${esc(t)}</text>`; });
      }
      y += G;
    }
  });
  if (d.takt) { o += `<text x="${W / 2}" y="${y + 20}" text-anchor="middle" class="ks">⏱ ${esc(d.takt.replace(/_/g, " "))} an allen Blöcken ausser dem ersten</text>`; y += 26; }
  const H = y + 6;
  return `<svg class="zd" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Blockbild">${SVG_DEFS}${o}</svg>`;
}

/* ---------- Blöcke ---------- */

/* ---------- Interaktive Teile ---------- */
const WIDGETS = {
  /* Setup/Hold: Zeitpunkt des Datenwechsels verschieben */
  setup_hold(el, p) {
    const ts = p.tsetup ?? 4, th = p.thold ?? 2, B = p.bereich ?? 10, tpd = 2, R = .5;
    const t0 = -B - 2, t1 = B + 8, n = Math.round((t1 - t0) / R), idx = t => Math.round((t - t0) / R);
    el.innerHTML = `<div class="wid"><div class="wkopf">🎛️ Interaktiv · ${subHTML("T_setup")} = ${ts} ns, ${subHTML("T_hold")} = ${th} ns</div>
      <div class="svgbox"></div>
      <label class="sl"><span><em>DataInput wechselt</em><b class="num" id="shW"></b></span><input type="range" min="${-B}" max="${B}" step="${R}" value="${-B + 2}" aria-label="Zeitpunkt des Datenwechsels relativ zur Flanke"></label>
      <div class="wstatus"></div></div>`;
    const inp = $("input", el), box = $(".svgbox", el), st = $(".wstatus", el), lab = $("#shW", el);
    function zeichne() {
      const t = +inp.value, e = idx(0);
      let clk = "", d = "", q = "";

      const landet = (Math.round(t * 2) % 2 + 2) % 2 === 0 ? "1" : "0";
      for (let i = 0; i < n; i++) {
        clk += i < e ? "0" : "1";
        d += i < idx(t) ? "0" : "1";
        if (fall === "frueh") q += i < e + tpd / R ? "0" : "1";
        else if (fall === "spaet") q += "0";
        else q += i < e + tpd / R ? "0" : i < e + (tpd + 5) / R ? "m" : landet;
      }
      box.innerHTML = zeitSVG({
        signale: [{ name: "Clock", wellen: clk }, { name: "DataInput", wellen: d }, { name: "Q", wellen: q }],
        fenster: [{ von: idx(-ts), bis: e, text: "T_setup", art: "setup" }, { von: e, bis: idx(th), text: "T_hold", art: "hold" }].concat(fall === "verletzt" ? [{ von: e + tpd / R, bis: e + (tpd + 5) / R, text: "metastabil", art: "warn" }] : []),
        marken: [{ t: e, text: "Flanke" }]
      }, box.clientWidth);
      lab.textContent = t === 0 ? "genau an der Flanke" : Math.abs(t).toFixed(1).replace(".0", "") + " ns " + (t < 0 ? "vor" : "nach") + " der Flanke";
      st.className = "wstatus " + (fall === "verletzt" ? "bad" : "ok");
      st.innerHTML = fall === "frueh" ? "✓ DataInput ist vor dem Setup-Fenster stabil. Das Flip-Flop übernimmt den neuen Wert <b>1</b> sauber."

        : `⚠️ Der Wechsel liegt im ${t <= 0 ? "Setup" : "Hold"}-Fenster. Das Flip-Flop kann <b>metastabil</b> werden. In diesem Beispiel landet es zufällig bei <b>${landet}</b>.`;
    }
    inp.oninput = zeichne; grafik(zeichne);
  },

  /* Metastabilität: Kugel auf dem Berg */
  kugel(el) {
    el.innerHTML = `<div class="wid"><div class="wkopf">🎛️ Interaktiv · Kugel-Modell</div>
      <svg class="kugel" viewBox="0 0 320 150" role="img" aria-label="Kugel zwischen zwei Tälern 0 und 1"><path class="hang"/><circle r="11" class="ball"/>
        <text x="80" y="144" text-anchor="middle" class="zn">0</text><text x="240" y="144" text-anchor="middle" class="zn">1</text><text x="160" y="16" text-anchor="middle" class="zl">metastabil</text></svg>
      <div class="chips" style="justify-content:center"><button class="chip" data-a="0">Sauber 0 speichern</button><button class="chip" data-a="1">Sauber 1 speichern</button><button class="chip" data-a="v">⚠️ Setup verletzen</button></div>
      <div class="wstatus"></div><p class="small muted" style="text-align:center;margin-top:6px" id="kz"></p></div>`;

  },

  /* Synchronisation mit zwei D-FF, Schritt für Schritt */
  synchronisierer(el) {
    el.innerHTML = `<div class="wid"><div class="wkopf">🎛️ Interaktiv · zwei Synchronisations-FF</div>

      <div class="wstatus"></div>
      <div class="row" style="justify-content:space-between;margin-top:10px"><button class="btn" id="syZ">◀</button><span class="small muted num" id="syN"></span><button class="btn primary" id="syW">Nächste Flanke ▶</button></div>

    function wellen() {
      let c = "", d = "", q1 = "", q2 = "";

        c += (t % 8) >= 4 ? "1" : "0";

      "D<sub>Asyn</sub> wechselt kurz vor der 1. Flanke, also im Setup-Fenster von FF 1.",

/* ---------- Bedingungen wie "S", "!S", "E&!R", "A|B", "1" ohne eval ---------- */
function bedingung(expr, v) {
  const t = String(expr ?? "1").replace(/\s+/g, "").match(/[A-Za-z_][A-Za-z0-9_]*|[!&|()01]/g) || ["1"];
  let i = 0;
  const oder = () => { let x = und(); while (t[i] === "|") { i++; const y = und(); x = x || y; } return x; };
  const und = () => { let x = nicht(); while (t[i] === "&") { i++; const y = nicht(); x = x && y; } return x; };
  const nicht = () => { if (t[i] === "!") { i++; return !nicht(); } return atom(); };
  const atom = () => { const k = t[i++]; if (k === "(") { const x = oder(); i++; return x; } if (k === "1") return true; if (k === "0") return false; return !!v[k]; };
  try { return oder(); } catch (e) { return false; }
}

};

/* ---------- Zustandsdiagramm ----------
   knoten: [{id, label, aus, x, y}] (Rasterkoordinaten), kanten: [{von, nach, text, kurve, schleife}], start: id */
function zdgSVG(d, W, aktiv) {
  W = Math.max(260, Math.floor(W));
  const K = d.knoten || [], E = d.kanten || [];
  const maxX = Math.max(1, ...K.map(k => k.x)), maxY = Math.max(0, ...K.map(k => k.y));
  let r = W < 480 ? 23 : 28;
  // Rand: Platz für Schlaufen samt Beschriftung und den Start-Pfeil
  const hat = (s, f) => E.some(e => e.von === e.nach && (e.schleife || "oben") === s && K.some(k => k.id === e.von && f(k)));
  const gross = r * 2.6 + 22, klein = r + 30;
  const mT = Math.max(hat("oben", k => k.y === 0) ? gross : klein, d.start ? r + 34 : 0), mB = hat("unten", k => k.y === maxY) ? gross : klein;
  const mL = Math.max(hat("links", k => k.x === 0) ? gross + 10 : klein, d.start && K.some(k => k.id === d.start && k.x === 0) ? r + 44 : 0), mR = hat("rechts", k => k.x === maxX) ? gross + 10 : klein;
  const dx = (W - mL - mR) / maxX, dy = d.zeilenabstand || (W < 480 ? 92 : 112);
  r = Math.max(17, Math.min(r, dx * .4, dy * .4));  // bei engen Diagrammen kleinere Kreise
  const P = {}; K.forEach(k => P[k.id] = { x: mL + k.x * dx, y: mT + k.y * dy });
  const H = mT + mB + maxY * dy;
  const halo = `paint-order="stroke" stroke="#1c201d" stroke-width="5" stroke-linejoin="round"`;
  let o = `<svg class="zd zdg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(d.titel || "Zustandsdiagramm")}">${SVG_DEFS}`;
  const hatRueck = (a, b) => E.some(e => e.von === b && e.nach === a);
  E.forEach(e => {
    const p1 = P[e.von], p2 = P[e.nach]; if (!p1 || !p2) return;
    if (e.von === e.nach) {
      const s = e.schleife || "oben", ang = { oben: -90, unten: 90, links: 180, rechts: 0 }[s] * Math.PI / 180;
      const a1 = ang - .45, a2 = ang + .45, R2 = r * 2.3;
      const sx = p1.x + r * Math.cos(a1), sy = p1.y + r * Math.sin(a1), ex = p1.x + r * Math.cos(a2), ey = p1.y + r * Math.sin(a2);
      const c1x = p1.x + R2 * Math.cos(a1 - .35), c1y = p1.y + R2 * Math.sin(a1 - .35), c2x = p1.x + R2 * Math.cos(a2 + .35), c2y = p1.y + R2 * Math.sin(a2 + .35);
      o += `<path d="M${sx} ${sy} C${c1x} ${c1y} ${c2x} ${c2y} ${ex} ${ey}" class="kp" fill="none" marker-end="url(#pn)"/>`;
      const lx = p1.x + (R2 + 6) * Math.cos(ang), ly = p1.y + (R2 + 6) * Math.sin(ang) + 4;
      o += `<text x="${lx}" y="${ly}" text-anchor="${s === "links" ? "end" : s === "rechts" ? "start" : "middle"}" class="ks zt" ${halo}>${subText(e.text ?? e.bed ?? "")}</text>`;
      return;
    }
    const vx = p2.x - p1.x, vy = p2.y - p1.y, L = Math.hypot(vx, vy) || 1, nx = -vy / L, ny = vx / L;
    const k = e.kurve ?? (hatRueck(e.von, e.nach) ? 20 : 0);
    const cx = (p1.x + p2.x) / 2 + nx * k * 2, cy = (p1.y + p2.y) / 2 + ny * k * 2;
    const u1 = Math.hypot(cx - p1.x, cy - p1.y) || 1, u2 = Math.hypot(cx - p2.x, cy - p2.y) || 1;
    const sx = p1.x + (cx - p1.x) / u1 * r, sy = p1.y + (cy - p1.y) / u1 * r;
    const ex = p2.x + (cx - p2.x) / u2 * (r + 2), ey = p2.y + (cy - p2.y) / u2 * (r + 2);
    o += `<path d="M${sx} ${sy} Q${cx} ${cy} ${ex} ${ey}" class="kp" fill="none" marker-end="url(#pn)"/>`;
    const mx = .25 * p1.x + .5 * cx + .25 * p2.x, my = .25 * p1.y + .5 * cy + .25 * p2.y;
    const sgn = k === 0 ? 1 : Math.sign(k), off = 11;
    o += `<text x="${mx + nx * off * sgn}" y="${my + ny * off * sgn + 4}" text-anchor="middle" class="ks zt" ${halo}>${subText(e.text ?? e.bed ?? "")}</text>`;
  });
  if (d.start && P[d.start]) { const p = P[d.start]; o += `<line x1="${p.x - r - 26}" y1="${p.y - r - 14}" x2="${p.x - r * .72}" y2="${p.y - r * .72}" class="kp" marker-end="url(#pn)"/><text x="${p.x - r - 28}" y="${p.y - r - 18}" class="ks" text-anchor="middle">Start</text>`; }
  K.forEach(k => {
    const p = P[k.id], an = k.id === aktiv;
    o += `<circle cx="${p.x}" cy="${p.y}" r="${r}" class="zk${an ? " an" : ""}"/>`;
    if (k.aus !== undefined && k.aus !== "") {
      o += `<text x="${p.x}" y="${p.y - 4}" text-anchor="middle" class="zkt">${subText(k.label ?? k.id)}</text><line x1="${p.x - r * .7}" y1="${p.y + 2}" x2="${p.x + r * .7}" y2="${p.y + 2}" class="zkl"/><text x="${p.x}" y="${p.y + 15}" text-anchor="middle" class="zka">${subText(k.aus)}</text>`;
    } else o += `<text x="${p.x}" y="${p.y + 5}" text-anchor="middle" class="zkt">${subText(k.label ?? k.id)}</text>`;
  });
  return o + "</svg>";
}
BLOCK.zustandsdiagramm = function (b, el) {
  el.innerHTML = `<figure class="fig">${b.titel ? `<figcaption>${md(b.titel)}</figcaption>` : ""}<div class="svgbox"></div></figure>`;

/* ---------- Hilfen für Verlaufs-Diagramme der Widgets ---------- */
function verlauf(hist, namen, felder) {
  // hist: [{feld: 0|1|"x"}] → je Eintrag 2 Zeiteinheiten
  return namen.map((n, i) => ({ name: n, wellen: hist.map(h => { const v = h[felder[i]]; return (v === "x" ? "xx" : v === "m" ? "mm" : v ? "11" : "00"); }).join("") }));
}
const toggle = (txt, an, attr) => `<button class="chip tg" ${attr} aria-pressed="${!!an}">${txt} = <b class="num">${an ? 1 : 0}</b></button>`;

Object.assign(WIDGETS, {

  sr_latch(el) {
    el.innerHTML = `<div class="wid"><div class="wkopf">🎛️ Interaktiv · SR-Latch (zwei NOR)</div>
      <div class="chips" style="justify-content:center" id="srIn"></div>

      <button class="linkbtn" id="srRes">↻ Zurücksetzen</button></div>`;

      let NQ;
      if (S && R) { Q = 0; NQ = 0; unbestimmt = true; }
      else if (S) { Q = 1; NQ = 0; unbestimmt = false; }
      else if (R) { Q = 0; NQ = 1; unbestimmt = false; }
      else NQ = unbestimmt ? "x" : 1 - Q;

      hist.push({ S, R, Q: qv, NQ: !S && !R && unbestimmt ? "x" : NQ }); if (hist.length > 12) hist.shift();

    }

    grafik(zeichne);
  },

  /* D-Latch (transparent) gegen flankengetriggertes D-FF */
  latch_vs_ff(el) {

function chatVerdrahten(a, t, k) {

    const input = [{ role: "user", content: chatPrompt(a, t) }, { role: "assistant", content: "Verstanden. Ich helfe bei dieser Aufgabe." }]
      .concat(ms.map(m => ({ role: m.r, content: m.t })));

      ms.push({ r: "assistant", t: r.text, ts: Date.now() }); speichern();

    }

    const n = ms.filter(m => m.r === "user").length; const cb = $("[data-chat]", k); if (cb) cb.textContent = "🤖 Frag Claude" + (n ? " · " + n : "");
  }
}

// Vergleich von Text-Antworten: ohne Leerzeichen, Gross/Klein egal, Komma = Punkt, Präfixe 0x / Suffixe b, h, d optional
const norm = s => String(s ?? "").toLowerCase().replace(/\s+/g, "").replace(/[‘’'_-]/g, "").replace(",", ".");
function gleich(eingabe, soll) {
  const e = norm(eingabe), s = norm(soll);
  if (e === s) return true;

  const ohne = x => {
    x = x.replace(/^0x/, "").replace(/_\{?\(?(2|8|10|16)\)?\}?$/, "");

      feedback(a, alle, a.antworten.map(x => `<code>${esc(x[0])}</code>`).join(", "));
    });
    inps.forEach((inp, i) => { inp.oninput = () => ak.an(inps.every(x => x.value.trim())); inp.onkeydown = e => { if (e.key === "Enter") (inps[i + 1] || inp).focus(); }; });
    inps[0]?.focus();
  },
  karteikarte(a, box) {
    box.innerHTML = `<div class="typ">Karteikarte</div><div class="q">Weisst du die Antwort?</div><div class="karte">${md(a.vorne)}</div><div class="aktion"><button class="btn primary">Umdrehen</button></div>`;
    $(".aktion button", box).onclick = () => {
      const k = $(".karte", box); k.classList.add("hinten"); k.innerHTML = md(a.hinten); typeset(k);
      $(".aktion", box).innerHTML = `<div class="tfrow"><button class="btn" id="nein">Nicht gewusst</button><button class="btn primary" id="ja">Gewusst</button></div>`;
      $("#ja").onclick = () => feedback(a, true); $("#nein").onclick = () => feedback(a, false);
    };
  },
  zuordnen(a, box) {
    box.innerHTML = kopf(a, a.frage || "Ordne zu:") + `<div class="paar"><div class="opts" id="L"></div><div class="opts" id="R"></div></div>`;
    let links = null, fehler = 0, rest = a.paare.length;
    const L = $("#L", box), R = $("#R", box);
    mischen(a.paare.map((p, i) => [p[0], i])).forEach(([t, i]) => { const b = document.createElement("button"); b.className = "opt"; b.dataset.i = i; b.innerHTML = md(t); b.onclick = () => { links = i; L.querySelectorAll(".opt").forEach(x => x.classList.toggle("sel", x === b)); }; L.appendChild(b); });
    mischen(a.paare.map((p, i) => [p[1], i])).forEach(([t, i]) => {
      const b = document.createElement("button"); b.className = "opt"; b.dataset.i = i; b.innerHTML = md(t);
      b.onclick = () => {
        if (links === null) return wackeln(b);
        const lb = L.querySelector(`.opt[data-i="${links}"]`);
        if (links === i) { [lb, b].forEach(x => { x.classList.remove("sel"); x.classList.add("right"); setTimeout(() => x.classList.add("weg"), 350); }); links = null; if (--rest === 0) setTimeout(() => feedback(a, fehler === 0, "alle Paare richtig verbinden"), 400); }
        else { fehler++; b.classList.add("wrong"); wackeln(b); setTimeout(() => b.classList.remove("wrong"), 500); }
      };
      R.appendChild(b);
    });
  },
  reihenfolge(a, box) {
    box.innerHTML = kopf(a, a.frage) + `<div class="zone" id="ziel"></div><div class="opts" id="pool"></div>`;
    const ziel = $("#ziel", box), pool = $("#pool", box); let reihe = [];
    let gem = mischen(a.elemente.map((_, i) => i)); if (gem.every((v, i) => v === i) && gem.length > 1) gem.reverse();
    const ak = aktion(box, "Prüfen", false, () => feedback(a, reihe.every((x, i) => a.elemente[x] === a.elemente[i]), "<br>" + a.elemente.map((e, i) => (i + 1) + ". " + md(e)).join("<br>")));
    const zeichne = () => {
      ziel.innerHTML = reihe.length ? "" : '<span class="small muted">Tippe die Elemente in der richtigen Reihenfolge an.</span>'; pool.innerHTML = "";
      reihe.forEach((x, p) => { const b = document.createElement("button"); b.className = "opt sel"; b.innerHTML = (p + 1) + ". " + md(a.elemente[x]); b.onclick = () => { reihe.splice(p, 1); zeichne(); }; ziel.appendChild(b); });
      gem.forEach(x => { if (reihe.includes(x)) return; const b = document.createElement("button"); b.className = "opt"; b.innerHTML = md(a.elemente[x]); b.onclick = () => { reihe.push(x); zeichne(); }; pool.appendChild(b); });
      ak.an(reihe.length === a.elemente.length); typeset(box);
    };
    zeichne();
  },
  freitext(a, box) {
    box.innerHTML = kopf(a, a.frage) + `<textarea class="frei" aria-label="Deine Antwort"></textarea>`;
    const ta = $("textarea", box);
    const ak = aktion(box, "Musterantwort zeigen", false, () => {
      box.querySelector(".aktion").remove();
      const d = document.createElement("div"); d.className = "fb ok"; d.style.borderColor = "var(--line)"; d.style.background = "var(--panel2)";
      d.innerHTML = `<p><b>Musterantwort:</b> ${md(a.musterantwort)}</p><div class="tfrow" style="margin-top:12px"><button class="btn" id="nein">Nicht gewusst</button><button class="btn primary" id="ja">Gewusst</button></div>`;
      box.appendChild(d); typeset(d);
      $("#ja").onclick = () => { d.remove(); feedback(a, true); }; $("#nein").onclick = () => { d.remove(); feedback(a, false); };
    });
    ta.oninput = () => ak.an(!!ta.value.trim());
  },
  _unbekannt(a, box) {
    box.innerHTML = `<div class="leer">Aufgabentyp «${esc(a.typ)}» wird hier noch nicht angezeigt.</div>`;
    aktion(box, "Überspringen", true, () => { sitzung.queue.shift(); sitzung.erledigt++; aufgabeZeigen(); });
  }
};

(async () => {
  try {
    await inhalteLaden();
    view = ausHash();
    render();
    syncStart();
  } catch (e) {
    app.innerHTML = `<div class="leer"><h3>Inhalte konnten nicht geladen werden</h3><p>Die Datei <code>content/${FACH_ID}/fach.json</code> fehlt oder ist ungültig.</p><p class="quelle">${esc(e.message)}</p></div>`;
  }
})();
</script>
